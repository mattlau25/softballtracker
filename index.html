<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Base ── */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── 4pt spacing tokens ── */
:root {
  --sp1:  4px;
  --sp2:  8px;
  --sp3:  12px;
  --sp4:  16px;
  --sp5:  20px;
  --sp6:  24px;
  --sp8:  32px;
  --sp10: 40px;
  --sp12: 48px;
  --sp16: 64px;

  /* ── Radius ── */
  --r1: 4px;
  --r2: 8px;
  --r3: 12px;
  --r4: 16px;

  /* ── Typography ── */
  --text-xs:   11px;
  --text-sm:   12px;
  --text-base: 14px;
  --text-md:   16px;
  --text-lg:   18px;
  --text-xl:   20px;
  --text-2xl:  24px;
  --text-3xl:  28px;

  /* ── Light theme ── */
  --bg:           #f0f2f5;
  --surface:      #ffffff;
  --surface2:     #f7fafc;
  --border:       #e2e8f0;
  --border2:      #edf2f7;
  --text:         #1a202c;

  --muted:        #718096;
  --label:        #4a5568;
  --nav-bg:       #ffffff;
  --nav-text:     #4a5568;
  --nav-active:   #1e3a5f;
  --nav-border:   #e2e8f0;
  --primary:      #1e3a5f;
  --primary-text: #ffffff;
  --success:      #276749;
  --danger:       #c53030;
  --blue:         #2b6cb0;
  --card-shadow:  0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
  --spray-foul:   #e8ede8;
  --spray-out:    #d4e6d4;
  --spray-dirt:   #e8d5b0;
  --spray-mound:  #dcc89a;

  /* ── Layout ── */

  --page-max: 1080px;
  --page-px:  40px;
  --page-py:  32px;
}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── FIREBASE CONFIG ───────────────────────────────────────────────────────────
// Replace these values with your Firebase project config
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD0xAOtcrQbqG6nT0kmWaj47T1NibO7ruQ",
  authDomain: "softball-tracker-bbbdd.firebaseapp.com",
  projectId: "softball-tracker-bbbdd",
  storageBucket: "softball-tracker-bbbdd.firebasestorage.app",
  messagingSenderId: "1005556543645",
  appId: "1:1005556543645:web:f3d9afe7a09e6a3bf7e474"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

// ─── CONSTANTS ─────────────────────────────────────────────────────────────────
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const POSITIONS = ['P','C','1B','2B','3B','SS','LF','LCF','CF','RCF','RF','DH','UTIL'];

const HIT_OUTCOMES   = ['Single','Double','Triple','Home Run'];
const OUT_OUTCOMES   = ['Ground Out','Fly Out','Line Out','Pop Out','Foul Out','Double Play','Strikeout'];
const OTHER_OUTCOMES = ['Walk','Hit by Pitch','Sac Fly','Sac Bunt','Reach on Error',"Fielder's Choice"];

const HIT_BASES = { 'Single':1, 'Double':2, 'Triple':3, 'Home Run':4 };

// Outcomes where spray chart applies (excluding Foul Out — handled separately)
const SPRAY_OUTCOMES = new Set([
  'Single','Double','Triple','Home Run',
  'Ground Out','Fly Out','Line Out','Pop Out','Double Play',
  'Sac Fly','Sac Bunt','Reach on Error',"Fielder's Choice"
]);

// Outcomes that count as official AB
const COUNTS_AS_AB = new Set([
  'Single','Double','Triple','Home Run',
  'Ground Out','Fly Out','Line Out','Pop Out','Foul Out','Double Play','Strikeout',
  'Reach on Error',"Fielder's Choice"
]);

const COUNTS_AS_HIT = new Set(['Single','Double','Triple','Home Run']);

// ─── HIT DIRECTION ─────────────────────────────────────────────────────────────
// Returns 'Pull' | 'Center' | 'Oppo' based on spray x position and handedness
function getHitDirection(spray, handedness) {
  if (!spray) return null;
  const W = spray.w || 320;
  const nx = spray.x / W; // 0 = left field, 1 = right field
  // For right-handed batter: pull = left field (nx < 0.4), oppo = right field (nx > 0.6)
  // For left-handed batter: pull = right field (nx > 0.6), oppo = left field (nx < 0.4)
  if (handedness === 'L') {
    if (nx > 0.62) return 'Pull';
    if (nx < 0.38) return 'Oppo';
    return 'Center';
  } else {
    if (nx < 0.38) return 'Pull';
    if (nx > 0.62) return 'Oppo';
    return 'Center';
  }
}


const userDoc  = uid => db.collection('users').doc(uid);
const batsCol  = uid => userDoc(uid).collection('bats');
const gamesCol = uid => userDoc(uid).collection('games');
const absCol   = (uid, gid) => gamesCol(uid).doc(gid).collection('abs');
const seasonsCol = uid => userDoc(uid).collection('seasons');

// ─── STAT HELPERS ──────────────────────────────────────────────────────────────
const fmt3 = n => isNaN(n) || !isFinite(n) ? '.000' : '.' + Math.round(n * 1000).toString().padStart(3,'0');
const calcAVG = (h, ab)      => ab === 0 ? '.---' : fmt3(h / ab);
const calcOBP = (h, bb, hbp, sf, ab) => { const d = ab + bb + hbp + sf; return d === 0 ? '.---' : fmt3((h + bb + hbp) / d); };
const calcSLG = (tb, ab)     => ab === 0 ? '.---' : fmt3(tb / ab);
const calcOPS = (obp, slg)   => { if (obp === '.---' || slg === '.---') return '.---'; const v = parseFloat('0' + obp) + parseFloat('0' + slg); return fmt3(v); };

function getDayOfWeek(ds) { if (!ds) return ''; return DAYS[new Date(ds + 'T12:00:00').getDay()]; }
function fmtDate(ds) {
  if (!ds) return '';
  const d = new Date(ds + 'T12:00:00');
  return d.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,'0')}${ampm}`;
}
function getResult(g) {
  const ms = parseInt(g.myScore), os = parseInt(g.oppScore);
  if (isNaN(ms) || isNaN(os)) return null;
  if (ms > os) return { label:'W', color:'#276749' };
  if (ms < os) return { label:'L', color:'#c53030' };
  return { label:'T', color:'#b7791f' };
}
function abOutcomeColor(ab) {
  if (COUNTS_AS_HIT.has(ab.outcome)) return '#276749';
  if (['Walk','Hit by Pitch'].includes(ab.outcome)) return '#2b6cb0';
  if (ab.outcome === 'Strikeout' || (ab.outcome === 'Foul Out' && ab.subOutcome === 'strikeout')) return '#c53030';
  return '#a0aec0';
}
function calcGameStats(abs, includeKFoulInK) {
  return abs.reduce((a, ab) => {
    a.pa++;
    if (COUNTS_AS_AB.has(ab.outcome)) a.ab++;
    if (COUNTS_AS_HIT.has(ab.outcome)) { a.h++; a.tb += (ab.bases || HIT_BASES[ab.outcome] || 0); }
    if (ab.rbi) a.rbi += ab.rbi;
    if (ab.runScored) a.r++;
    if (ab.outcome === 'Walk') a.bb++;
    if (ab.outcome === 'Hit by Pitch') a.hbp++;
    if (ab.outcome === 'Sac Fly') a.sf++;
    if (ab.outcome === 'Strikeout') a.k++;
    if (ab.outcome === 'Foul Out' && ab.subOutcome === 'strikeout') a.foulK++;
    a.po += (ab.putouts || 0); a.ast += (ab.assists || 0); a.err += (ab.errors || 0);
    if (ab.outcome === 'Double') a.doubles++;
    if (ab.outcome === 'Triple') a.triples++;
    if (ab.outcome === 'Home Run') a.hr++;
    const totalK = a.k + (includeKFoulInK ? a.foulK : 0);
    a.kTotal = totalK;
    return a;
  }, { pa:0, ab:0, h:0, tb:0, rbi:0, r:0, bb:0, hbp:0, sf:0, k:0, foulK:0, kTotal:0, po:0, ast:0, err:0, doubles:0, triples:0, hr:0 });
}

// ─── SPRAY CHART ───────────────────────────────────────────────────────────────
function SprayChart({ onPlot, plotted, interactive = true, hits = [], size = 320, showHeatmap = false, showZones = false, handedness = 'R' }) {
  const W = size, H = Math.round(size * 0.88);
  const HX = W / 2, HY = H - 18;
  const D = size * 0.27; // diamond leg length
  const firstX = HX + D, firstY = HY - D;
  const secX = HX, secY = HY - 2 * D;
  const thirdX = HX - D, thirdY = HY - D;
  const arcR = size * 0.68;
  const foulR = size * 0.83;
  const foulLX = HX - foulR * 0.707, foulLY = HY - foulR * 0.707;
  const foulRX = HX + foulR * 0.707, foulRY = HY - foulR * 0.707;
  const arcLX = HX - arcR * 0.707, arcLY = HY - arcR * 0.707;
  const arcRX = HX + arcR * 0.707, arcRY = HY - arcR * 0.707;

  const handleClick = e => {
    if (!interactive) return;
    const svg = e.currentTarget.closest('svg');
    const rect = svg.getBoundingClientRect();
    const x = Math.round(((e.clientX - rect.left) / rect.width) * W);
    const y = Math.round(((e.clientY - rect.top) / rect.height) * H);
    onPlot && onPlot({ x, y });
  };

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', maxWidth: size, cursor: interactive ? 'crosshair' : 'default' }}
      onClick={handleClick}>
      {/* Foul territory */}
      <rect width={W} height={H} fill="var(--spray-foul)"/>
      {/* Fair territory outfield */}
      <path d={`M ${HX} ${HY} L ${arcLX} ${arcLY} A ${arcR} ${arcR} 0 0 1 ${arcRX} ${arcRY} Z`} fill="var(--spray-out)"/>
      {/* Infield dirt */}
      <polygon points={`${HX},${HY} ${firstX},${firstY} ${secX},${secY} ${thirdX},${thirdY}`} fill="var(--spray-dirt)"/>
      {/* Pitcher's mound */}
      <circle cx={HX} cy={HY - D} r={size * 0.03} fill="var(--spray-mound)"/>
      {/* Base paths */}
      {[[HX,HY,firstX,firstY],[firstX,firstY,secX,secY],[secX,secY,thirdX,thirdY],[thirdX,thirdY,HX,HY]].map(([x1,y1,x2,y2],i) => (
        <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--spray-path)" strokeWidth="1.5"/>
      ))}
      {/* Foul lines */}
      <line x1={HX} y1={HY} x2={foulLX} y2={foulLY} stroke="var(--spray-line)" strokeWidth="1" strokeDasharray="5,3"/>
      <line x1={HX} y1={HY} x2={foulRX} y2={foulRY} stroke="var(--spray-line)" strokeWidth="1" strokeDasharray="5,3"/>
      {/* Outfield fence */}
      <path d={`M ${arcLX} ${arcLY} A ${arcR} ${arcR} 0 0 1 ${arcRX} ${arcRY}`} fill="none" stroke="var(--spray-fence)" strokeWidth="2"/>
      {/* Bases */}
      {[[firstX,firstY],[secX,secY],[thirdX,thirdY]].map(([bx,by],i) => (
        <rect key={i} x={bx-5} y={by-5} width="10" height="10" fill="white" stroke="#bbb" strokeWidth="0.5" transform={`rotate(45,${bx},${by})`}/>
      ))}
      {/* Home plate */}
      <polygon points={`${HX},${HY-7} ${HX+5},${HY-4} ${HX+5},${HY+1} ${HX-5},${HY+1} ${HX-5},${HY-4}`} fill="white" stroke="#bbb" strokeWidth="0.5"/>
      {/* Zone labels */}
      <text x="12" y="26" fill="var(--spray-label)" fontSize={size*0.034}>LF</text>
      <text x={W-12} y="26" textAnchor="end" fill="var(--spray-label)" fontSize={size*0.034}>RF</text>
      <text x={HX} y="16" textAnchor="middle" fill="var(--spray-label)" fontSize={size*0.034}>CF</text>
      <text x={firstX+10} y={firstY} textAnchor="start" fill="var(--spray-label)" fontSize={size*0.03} dominantBaseline="middle">1B</text>
      <text x={thirdX-10} y={thirdY} textAnchor="end" fill="var(--spray-label)" fontSize={size*0.03} dominantBaseline="middle">3B</text>
      <text x={HX} y={secY-10} textAnchor="middle" fill="var(--spray-label)" fontSize={size*0.03}>2B</text>
      {/* Heatmap overlay */}
      {showHeatmap && hits.length > 0 && (() => {
        const cells = 12;
        const cw = W / cells, ch = H / cells;
        const grid = Array.from({length:cells}, () => Array(cells).fill(0));
        hits.forEach(hit => {
          const nx = hit.x * W / (hit.w || 320);
          const ny = hit.y * H / (hit.h || 281);
          const ci = Math.floor(nx / cw), ri = Math.floor(ny / ch);
          if (ci >= 0 && ci < cells && ri >= 0 && ri < cells) grid[ri][ci]++;
        });
        const max = Math.max(...grid.flat(), 1);
        return grid.flatMap((row, ri) => row.map((val, ci) => {
          if (val === 0) return null;
          const opacity = (val / max) * 0.7;
          return <rect key={`h${ri}-${ci}`} x={ci*cw} y={ri*ch} width={cw} height={ch}
            fill={`rgba(220,50,50,${opacity})`} rx="2"/>;
        }));
      })()}
      {/* Hit direction zones (pull/center/oppo) — subtle lines */}
      {hits.length > 0 && (() => {
        // Pull side depends on handedness: R batter pulls to left field, L batter to right
        const pullAngle = handedness === 'L' ? 45 : -45; // degrees from center
        return null; // zones shown via dot colors instead
      })()}
      {/* Hot/cold zones overlay */}
      {showZones && hits.length > 0 && (() => {
        const zones = calcHotColdZones(hits);
        const zoneCoords = [
          // deep row: LF, CF, RF
          {x:0,       y:0,        w:W*0.38, h:H*0.5},
          {x:W*0.38,  y:0,        w:W*0.24, h:H*0.5},
          {x:W*0.62,  y:0,        w:W*0.38, h:H*0.5},
          // short row: LF, CF, RF
          {x:0,       y:H*0.5,    w:W*0.38, h:H*0.5},
          {x:W*0.38,  y:H*0.5,    w:W*0.24, h:H*0.5},
          {x:W*0.62,  y:H*0.5,    w:W*0.38, h:H*0.5},
        ];
        const avgs = zones.map(z => z.avg);
        const maxAvg = Math.max(...avgs.filter(v=>v!==null), 0.001);
        return zones.map((z, i) => {
          if (z.ab === 0) return null;
          const avg = z.avg;
          const avgStr = avg !== null ? '.'+Math.round(avg*1000).toString().padStart(3,'0') : '—';
          // Color: hot=green, cold=red, based on avg
          const intensity = avg / maxAvg;
          const r = Math.round(197 * (1 - intensity));
          const g2 = Math.round(103 * intensity);
          const coord = zoneCoords[i];
          return (
            <g key={i}>
              <rect x={coord.x} y={coord.y} width={coord.w} height={coord.h}
                fill={`rgba(${r},${g2},0,0.25)`} stroke={`rgba(${r},${g2},0,0.4)`} strokeWidth="1"/>
              <text x={coord.x + coord.w/2} y={coord.y + coord.h/2 - 6} textAnchor="middle" dominantBaseline="middle"
                fontSize={size*0.038} fontWeight="700" fill={`rgb(${r},${g2},0)`}>{avgStr}</text>
              <text x={coord.x + coord.w/2} y={coord.y + coord.h/2 + 10} textAnchor="middle"
                fontSize={size*0.028} fill={`rgb(${r},${g2},0)`}>{z.ab} AB</text>
            </g>
          );
        });
      })()}
      {/* Previous hits (display mode) */}
      {hits.map((hit, i) => (
        <circle key={i} cx={hit.x * W / (hit.w || 320)} cy={hit.y * H / (hit.h || 281)}
          r="5" fill={COUNTS_AS_HIT.has(hit.outcome) ? '#276749' : '#c53030'} fillOpacity="0.75"
          stroke={COUNTS_AS_HIT.has(hit.outcome) ? '#1a4d34' : '#9b2222'} strokeWidth="1"/>
      ))}
      {/* Active plotted point */}
      {plotted && (
        <g>
          <circle cx={plotted.x} cy={plotted.y} r="9" fill="var(--spray-plot)" fillOpacity="0.15" stroke="var(--spray-plot)" strokeWidth="1.5"/>
          <circle cx={plotted.x} cy={plotted.y} r="5" fill="var(--spray-plot)"/>
        </g>
      )}
      {interactive && !plotted && (
        <text x={HX} y={HY - D - 20} textAnchor="middle" fill="var(--spray-tap)" fontSize={size*0.038} fontStyle="italic">tap to place hit</text>
      )}
    </svg>
  );
}

// ─── STYLES ────────────────────────────────────────────────────────────────────
const S = {
  // ── Login ──
  loginWrap:  { display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh', padding:24, background:'var(--bg)' },
  loginCard:  { background:'var(--surface)', border:'1px solid var(--border)', borderRadius:16, padding:40, maxWidth:384, width:'100%', textAlign:'center', boxShadow:'0 4px 24px rgba(0,0,0,0.08)' },

  // ── Nav (legacy — now handled by CSS classes) ──
  nav:          { display:'none' },
  navBrand:     { display:'none' },
  navBrandText: { fontSize:16, fontWeight:700, color:'#fff' },
  navBrandSub:  { fontSize:16, fontWeight:700, color:'#fff' },
  navItems:     { display:'none' },
  navItem:      { display:'none' },

// ─── LOGIN SCREEN ──────────────────────────────────────────────────────────────
function LoginScreen() {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const signIn = async () => {
    setLoading(true); setError('');
    try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch(e) { setError(e.message); setLoading(false); }
  };
  return (
    <div style={S.loginWrap}>
      <div style={S.loginCard}>
        <div style={{marginBottom:16, fontSize:52, lineHeight:1}}><i className="fa-solid fa-baseball" style={{fontSize:48, color:'#1e3a5f'}}></i></div>
        <h1 style={S.loginTitle}>Softball Tracker</h1>
        <p style={S.loginSub}>Personal stats, spray charts & game logs</p>
        <button onClick={signIn} disabled={loading} style={S.googleBtn}>
          {loading ? 'Signing in...' : 'Sign in with Google'}
        </button>
        {error && <p style={{color:'#c53030', marginTop:12, fontSize:12}}>{error}</p>}
      </div>
    </div>
  );
}

// ─── IMPORT BUTTON ─────────────────────────────────────────────────────────────
function ImportButton({ uid }) {
  const [importing, setImporting] = useState(false);
  const [result, setResult] = useState(null);
  const ref = React.useRef(null);
  const handle = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);
    try {
      const text = await file.text();
      const r = await importFromCSV(uid, text);
      setResult(r);
    } catch(err) {
      setResult({error: err.message});
    } finally {
      setImporting(false);
      e.target.value = '';
    }
  };
  return (
    <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4}}>
      <button onClick={() => ref.current?.click()} disabled={importing} style={S.btnSmall}>
        {importing ? 'Importing...' : '↑ Import CSV'}
      </button>
      <input ref={ref} type="file" accept=".csv" style={{display:'none'}} onChange={handle}/>
      {result && (
        <span style={{fontSize:11, color: result.error ? 'var(--danger)' : 'var(--success)', maxWidth:200, textAlign:'right'}}>
          {result.error ? result.error : `✓ ${result.gamesImported} games, ${result.absImported} ABs imported`}
        </span>
      )}
    </div>
  );
}

// ─── PROFILE PAGE ──────────────────────────────────────────────────────────────
function ProfilePage({ uid, darkMode, toggleDark }) {
  const [p, setP] = useState({ name:'', bats:'', throws:'', jerseyNum:'', primaryPosition:'', defaultPosition:'', includeKFoulInK: false });
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [exporting, setExporting] = useState(false);
  useEffect(() => {
    userDoc(uid).get().then(d => { if (d.exists && d.data().profile) setP(x => ({...x, ...d.data().profile})); });
  }, [uid]);
  const upd = (k, v) => setP(x => ({...x, [k]: v}));
  const save = async () => {
    setSaving(true);
    await userDoc(uid).set({ profile: p }, { merge: true });
    setSaving(false); setSaved(true); setTimeout(() => setSaved(false), 2500);
  };
  const doExport = async () => {
    setExporting(true);
    try { await exportCSV(uid); } finally { setExporting(false); }

    <div className="page-content">
      <div style={S.pageHeader} className="page-header-row"><h2 style={S.pageTitle}>Profile</h2></div>

            <input style={S.input} value={p.jerseyNum} onChange={e => upd('jerseyNum', e.target.value)} placeholder="e.g. 24"/>

          <div style={S.formGroup}>
            <label style={S.label}>Primary Position</label>
            <select style={S.select} value={p.primaryPosition} onChange={e => upd('primaryPosition', e.target.value)}>
              <option value="">Select</option>
              {POSITIONS.map(pos => <option key={pos} value={pos}>{pos}</option>)}
            </select>
          </div>
          <div style={S.formGroup}>
            <label style={S.label}>Bats</label>
            <select style={S.select} value={p.bats} onChange={e => upd('bats', e.target.value)}>
              <option value="">Select</option>
              <option value="R">Right</option><option value="L">Left</option><option value="S">Switch</option>

          </div>
          <div style={S.formGroup}>
            <label style={S.label}>Throws</label>

            <option value="">None</option>
            {POSITIONS.map(pos => <option key={pos} value={pos}>{pos}</option>)}
          </select>
          <span style={S.hint}>Pre-fills the position field when recording ABs</span>

      </div>
      <div style={S.card}>
        <div style={S.cardTitle}>Stat Preferences</div>
        <label style={S.checkRow}>
          <input type="checkbox" checked={p.includeKFoulInK} onChange={e => upd('includeKFoulInK', e.target.checked)}/>

              <div style={{fontSize:12, color:'var(--muted)', marginTop:2}}>Download all your games and ABs as a CSV file</div>

            <button onClick={doExport} disabled={exporting} style={S.btnSmall}>{exporting ? 'Exporting...' : '↓ Export CSV'}</button>

      </div>
      <button onClick={save} disabled={saving} style={S.btnPrimary}>
        {saving ? 'Saving...' : saved ? '✓ Saved' : 'Save Profile'}
      </button>
    </div>
  );
}

// ─── BATS PAGE ─────────────────────────────────────────────────────────────────
function BatsPage({ uid }) {
  const [bats, setBats] = useState([]);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name:'', weight:'', barrelLength:'', balance:'', endloadWeight:'', notes:'' });
  const [loading, setLoading] = useState(true);
  const [showArchived, setShowArchived] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);

  const load = () => batsCol(uid).orderBy('createdAt','desc').get().then(s => { setBats(s.docs.map(d => ({id:d.id,...d.data()}))); setLoading(false); });
  useEffect(() => { load(); }, [uid]);
  const upd = (k, v) => setForm(f => ({...f, [k]: v}));
  const startNew = () => { setForm({ name:'', weight:'', barrelLength:'', balance:'', endloadWeight:'', notes:'' }); setEditing('new'); };
  const startEdit = bat => { setForm({...bat}); setEditing(bat.id); };
  const save = async () => {
    const data = { ...form, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (editing === 'new') {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      data.archived = false;
      await batsCol(uid).add(data);
    } else {
      const oldBat = bats.find(b => b.id === editing);
      await batsCol(uid).doc(editing).update(data);
      // Propagate bat name change to all ABs that used old bat name
      if (oldBat && oldBat.name !== form.name) {
        const gSnap = await gamesCol(uid).get();
        await Promise.all(gSnap.docs.map(async g => {

// ─── CSV EXPORT ────────────────────────────────────────────────────────────────
async function exportCSV(uid) {
  const gsnap = await gamesCol(uid).orderBy('date','desc').get();
  const games = gsnap.docs.map(d => ({id:d.id,...d.data()}));
  const rows = [['Date','Day','Opponent','Park','Home/Away','Day/Night','My Score','Opp Score','Result','Team','League','Tier','Season','PA','AB','H','2B','3B','HR','R','RBI','BB','K','AVG','OBP','SLG','PO','A','E','AB#','Outcome','Sub-Outcome','Bases','RBI','Run','Bat','Position','Hit Direction','Spray X','Spray Y','AB Comments','Game Comments']];
  for (const g of games) {
    const absSnap = await absCol(uid, g.id).orderBy('timestamp','asc').get();
    const abs = absSnap.docs.map(d => ({id:d.id,...d.data()}));
    const s = calcGameStats(abs, false);
    const res = getResult(g);
    abs.forEach((ab, i) => {
      const dir = ab.spray ? getHitDirection(ab.spray, 'R') : '';
      rows.push([
        g.date||'', g.dayOfWeek||'', g.opponent||'', g.park||'', g.homeAway||'', g.dayNight||'',
        g.myScore||'', g.oppScore||'', res?.label||'',
        g.teamName||'', g.league||'', g.tier||'', g.season||'',
        i===0?s.pa:'', i===0?s.ab:'', i===0?s.h:'', i===0?s.doubles:'', i===0?s.triples:'', i===0?s.hr:'',
        i===0?s.r:'', i===0?s.rbi:'', i===0?s.bb:'', i===0?s.kTotal:'',
        i===0?calcAVG(s.h,s.ab):'', i===0?calcOBP(s.h,s.bb,s.hbp,s.sf,s.ab):'', i===0?calcSLG(s.tb,s.ab):'',
        i===0?s.po:'', i===0?s.ast:'', i===0?s.err:'',
        i+1, ab.outcome||'', ab.subOutcome||'', ab.bases||'', ab.rbi||0, ab.runScored?'Y':'N',
        ab.batName||'', ab.position||'', dir,
        ab.spray?.x||'', ab.spray?.y||'',
        (ab.comments||'').replace(/,/g,' '), (g.comments||'').replace(/,/g,' ')
      ]);
    });
    if (abs.length === 0) {
      rows.push([g.date||'',g.dayOfWeek||'',g.opponent||'',g.park||'',g.homeAway||'',g.dayNight||'',g.myScore||'',g.oppScore||'',res?.label||'',g.teamName||'',g.league||'',g.tier||'',g.season||'',...Array(27).fill(''),(g.comments||'').replace(/,/g,' ')]);
    }
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`softball-stats-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ─── HAPTIC FEEDBACK ───────────────────────────────────────────────────────────
function haptic(style='light') {
  if (navigator.vibrate) {
    if (style === 'light') navigator.vibrate(8);
    else if (style === 'medium') navigator.vibrate(20);
    else if (style === 'success') navigator.vibrate([10, 50, 10]);
  }
}

// ─── HOT/COLD ZONES ────────────────────────────────────────────────────────────
// Divides field into 6 zones, calculates AVG per zone
function calcHotColdZones(hits) {
  // Zones: LF-deep, CF-deep, RF-deep, LF-short, CF-short, RF-short
  const zones = Array.from({length:6}, () => ({h:0, ab:0}));
  hits.forEach(hit => {
    if (!hit.spray) return;
    const W = hit.spray.w || 320, H = hit.spray.h || 281;
    const nx = hit.spray.x / W; // 0=left, 1=right
    const ny = hit.spray.y / H; // 0=top(deep), 1=bottom(home)
    const col = nx < 0.38 ? 0 : nx < 0.62 ? 1 : 2; // L/C/R
    const row = ny < 0.5 ? 0 : 1; // deep/short
    const zone = row * 3 + col;
    zones[zone].ab++;
    if (COUNTS_AS_HIT.has(hit.outcome)) zones[zone].h++;
  });
  return zones.map(z => ({
    ...z,
    avg: z.ab > 0 ? z.h / z.ab : null
  }));
}

// ─── CSV IMPORT ────────────────────────────────────────────────────────────────
async function importFromCSV(uid, csvText) {
  const lines = csvText.trim().split('\n');
  if (lines.length < 2) throw new Error('CSV appears empty');
  
  // Parse CSV rows (handle quoted fields)
  const parseRow = line => {
    const result = [];
    let current = '', inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQuotes = !inQuotes; }
      else if (line[i] === ',' && !inQuotes) { result.push(current); current = ''; }
      else { current += line[i]; }
    }
    result.push(current);
    return result;
  };

  const headers = parseRow(lines[0]);

  // Validate this looks like a softball tracker export
  const requiredHeaders = ['Date', 'Opponent', 'AB#', 'Outcome'];
  const missing = requiredHeaders.filter(h => !headers.includes(h));
  if (missing.length > 0) {
    throw new Error(`This doesn't look like a Softball Tracker CSV. Missing columns: ${missing.join(', ')}`);
  }
  const rows = lines.slice(1).map(parseRow);

  // Group rows by game (Date + Opponent)
  const gameMap = {};
  rows.forEach(row => {
    const get = h => { const i = headers.indexOf(h); return i >= 0 ? row[i]?.trim() : ''; };
    const key = `${get('Date')}__${get('Opponent')}`;
    if (!gameMap[key]) {
      gameMap[key] = {
        date: get('Date'), dayOfWeek: get('Day'), opponent: get('Opponent'),
        park: get('Park'), homeAway: get('Home/Away'), dayNight: get('Day/Night'),
        myScore: get('My Score'), oppScore: get('Opp Score'),
        teamName: get('Team'), league: get('League'), tier: get('Tier'),
        season: get('Season'), comments: get('Game Comments'),
        abs: []
      };
    }
    const abNum = parseInt(get('AB#'));
    if (abNum > 0) {
      gameMap[key].abs.push({
        outcome: get('Outcome'), subOutcome: get('Sub-Outcome'),
        bases: parseInt(get('Bases'))||0, rbi: parseInt(get('RBI'))||0,
        runScored: get('Run') === 'Y', batName: get('Bat'),
        position: get('Position'), comments: get('AB Comments'),
        countAsAB: COUNTS_AS_AB.has(get('Outcome')),
        countAsHit: COUNTS_AS_HIT.has(get('Outcome')),
      });
    }
  });

  // Write to Firebase
  let gamesImported = 0, absImported = 0;
  for (const gameData of Object.values(gameMap)) {
    const { abs, ...gameFields } = gameData;
    const ref = await gamesCol(uid).add({
      ...gameFields,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      imported: true
    });
    for (const ab of abs) {
      await absCol(uid, ref.id).add({
        ...ab,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      absImported++;
    }
    gamesImported++;
  }
  return { gamesImported, absImported };
}


function GamesPage({ uid, setPage, setGameId }) {
  const [games, setGames] = useState([]);
  const [allABs, setAllABs] = useState({});
  const [loading, setLoading] = useState(true);
  const [exporting, setExporting] = useState(false);
  const [search, setSearch] = useState('');

  const loadAll = async () => {
    const snap = await gamesCol(uid).orderBy('date','desc').get();
    const gdata = snap.docs.map(d => ({id:d.id,...d.data()}));
    setGames(gdata);
    const abResults = await Promise.all(gdata.map(g => absCol(uid,g.id).orderBy('timestamp','asc').get()));
    const absMap = {};
    gdata.forEach((g,i) => { absMap[g.id] = abResults[i].docs.map(d=>({id:d.id,...d.data()})); });
    setAllABs(absMap);
    setLoading(false);
  };

  useEffect(() => { loadAll(); }, [uid]);

  const go = id => { setGameId(id); setPage('game-detail'); };

  const searchLower = search.toLowerCase();
  const filteredGames = search
    ? games.filter(g =>
        (g.opponent||'').toLowerCase().includes(searchLower) ||
        (g.park||'').toLowerCase().includes(searchLower) ||
        (g.teamName||'').toLowerCase().includes(searchLower) ||
        (g.season||'').toLowerCase().includes(searchLower) ||
        (g.league||'').toLowerCase().includes(searchLower)
      )
    : games;

  const streak = (() => {
    if (!games.length) return null;
    const sorted = [...games].sort((a,b) => b.date.localeCompare(a.date));
    let hitStreak = 0;
    for (const g of sorted) {
      const abs = allABs[g.id] || [];
      if (abs.some(ab => COUNTS_AS_HIT.has(ab.outcome))) hitStreak++;
      else break;
    }
    return hitStreak >= 2 ? hitStreak : null;
  })();

  const careerHighs = (() => {
    if (!games.length) return null;
    let bestH = 0, bestRBI = 0;
    games.forEach(g => {
      const s = calcGameStats(allABs[g.id]||[], false);
      if (s.h > bestH) bestH = s.h;
      if (s.rbi > bestRBI) bestRBI = s.rbi;
    });
    return { bestH, bestRBI };
  })();

  const doExport = async () => {
    setExporting(true);
    try { await exportCSV(uid); } finally { setExporting(false); }
  };

  return (
    <div className="page-content">
      <div style={S.pageHeader} className="page-header-row">
        <h2 style={S.pageTitle}>Games</h2>
        <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
          <button onClick={() => setPage('new-game')} style={S.btnPrimary}>+ New Game</button>
          <button onClick={() => setPage('profile')} className="mobile-profile-btn"
            style={{display:'none', background:'none', border:'1px solid var(--border)', borderRadius:8, padding:'8px 10px', cursor:'pointer', color:'var(--label)'}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </button>
        </div>
      </div>
        <div style={{marginBottom:12, position:'relative'}}>
          <input style={{...S.input, paddingLeft:34}}
            value={search} onChange={e => setSearch(e.target.value)} placeholder="Search opponent, park, team, season..."/>
          <svg style={{position:'absolute', left:10, top:'50%', transform:'translateY(-50%)', opacity:0.4}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          {search && <button onClick={()=>setSearch('')} style={{position:'absolute', right:8, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', color:'var(--muted)', fontSize:14}}>✕</button>}
        </div>

      {!loading && !search && games.length > 0 && (streak || (careerHighs?.bestH > 0)) && (
        <div style={{...S.card, background:'rgba(99,102,241,0.08)', border:'1px solid rgba(99,102,241,0.2)', marginBottom:16}}>
          <div style={{display:'flex', flexWrap:'wrap', gap:20}}>
            {streak && <div><div style={{fontSize:11, color:'#6366f1', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:2}}>Hit Streak</div><div style={{fontSize:22, fontWeight:700, color:'#4338ca'}}>{streak} <span style={{fontSize:13, fontWeight:400}}>games</span></div></div>}
            {careerHighs?.bestH > 0 && <div><div style={{fontSize:11, color:'#6366f1', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:2}}>Best H (game)</div><div style={{fontSize:22, fontWeight:700, color:'#4338ca'}}>{careerHighs.bestH}</div></div>}

      </div>
    </div>
  );
}

// ─── AB FORM ───────────────────────────────────────────────────────────────────
function ABForm({ uid, gameId, ab, bats, onSave, onCancel, quickMode=false, defaultPosition='' }) {
  const isEdit = !!ab;
  const blank = { batId:'', outcome:'', subOutcome:'', bases:0, rbi:0, runScored:false, spray:null, comments:'', position: defaultPosition, putouts:0, assists:0, errors:0 };
  const [f, setF] = useState(isEdit ? {...blank, ...ab} : blank);
  const [dirty, setDirty] = useState(false);
  const [toast, setToast] = useState(null);
  const upd = (k, v) => { setF(x => ({...x, [k]: v})); setDirty(true); };

  const outcomeGroup = HIT_OUTCOMES.includes(f.outcome) ? 'hit' : OUT_OUTCOMES.includes(f.outcome) ? 'out' : OTHER_OUTCOMES.includes(f.outcome) ? 'other' : '';
  const isFoulOut = f.outcome === 'Foul Out';
  const isFoulCaught = isFoulOut && f.subOutcome === 'caught';
  const isFoulK = isFoulOut && f.subOutcome === 'strikeout';
  const showSpray = SPRAY_OUTCOMES.has(f.outcome) || isFoulCaught;
  const showBases = ['Reach on Error', "Fielder's Choice"].includes(f.outcome);
  const autoBase = HIT_BASES[f.outcome] || null;
  const showRBI = f.outcome && !['Strikeout'].includes(f.outcome) && !isFoulK && !(isFoulOut && !f.subOutcome);
  const showRunScored = f.outcome && !isFoulK && !(isFoulOut && !f.subOutcome);

  const setOutcome = (o) => { haptic('light'); setF(x => ({...x, outcome: o, subOutcome:'', spray: null, bases: HIT_BASES[o] || 0})); setDirty(true); };

  const handleCancel = () => {
    if (dirty && !isEdit) {
      if (!window.confirm('You have unsaved changes. Discard this at bat?')) return;
    }
    onCancel();
  };

  const save = async () => {
    const bat = bats.find(b => b.id === f.batId);
    const bases = autoBase || f.bases || 0;
    const data = {
      ...f, batName: bat?.name || '',
      bases,
      countAsAB: COUNTS_AS_AB.has(f.outcome),
      countAsHit: COUNTS_AS_HIT.has(f.outcome),
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (isEdit) await absCol(uid, gameId).doc(ab.id).update(data);
    else await absCol(uid, gameId).add(data);
    haptic('success');
    // Show toast
    const toastMsg = f.outcome + (f.rbi > 0 ? `, ${f.rbi} RBI` : '') + (f.runScored ? ', R' : '');
    setToast(toastMsg);
    setTimeout(() => { setToast(null); onSave(); }, 1800);
  };

  const OBtn = ({ label, group }) => {
    const active = f.outcome === label;
    const baseStyle = quickMode
      ? { ...S.outBtn, padding:'14px 16px', fontSize:14, flex:'1 1 auto', textAlign:'center', minWidth:80 }
      : S.outBtn;
    const style = active ? (group === 'hit' ? {...baseStyle,...S.outBtnHit} : group === 'out' ? {...baseStyle,...S.outBtnOut} : {...baseStyle,...S.outBtnOther}) : baseStyle;
    return <button style={style} onClick={() => setOutcome(label)}>{label}</button>;
  };
  const SubBtn = ({ label, val }) => {
    const active = f.subOutcome === val;
    return <button style={{...S.outBtn, ...(active ? S.outBtnOut : {}), ...(quickMode?{padding:'12px 14px',fontSize:13}:{})}} onClick={() => { haptic('light'); upd('subOutcome', val); }}>{label}</button>;
  };
  const BaseBtn = ({ n }) => (
    <button style={{...S.outBtn, ...(f.bases===n ? S.outBtnHit : {}), ...(quickMode?{padding:'12px 16px',fontSize:14}:{})}} onClick={() => upd('bases', n)}>{n}B</button>
  );

  // Toast overlay
  if (toast) return (
    <div style={{...S.card, border:'1px solid var(--success)', background:'rgba(39,103,73,0.08)', textAlign:'center', padding:'24px 16px'}}>
      <div style={{fontSize:13, color:'var(--muted)', marginBottom:4}}>Saved</div>
      <div style={{fontSize:18, fontWeight:700, color:'var(--success)'}}>{toast}</div>
    </div>
  );

  return (
    <div style={{...S.card, border:'1px solid var(--border)'}}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
        <div style={S.cardTitle}>{isEdit ? 'Edit At Bat' : quickMode ? 'Quick AB' : 'Record At Bat'}</div>
      </div>

      {/* Bat */}
      {!quickMode && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>Bat Used</label>
          <select style={S.select} value={f.batId} onChange={e => upd('batId', e.target.value)}>
            <option value="">— Select bat —</option>
            {bats.filter(b=>!b.archived&&b.favourite).length > 0 && (
              <optgroup label="⭐ Favourites">
                {bats.filter(b=>!b.archived&&b.favourite).map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
              </optgroup>
            )}
            {bats.filter(b=>!b.archived&&!b.favourite).length > 0 && (
              <optgroup label="All Bats">
                {bats.filter(b=>!b.archived&&!b.favourite).map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
              </optgroup>
            )}
          </select>
        </div>
      )}

      {/* Outcome picker */}
      <div style={{marginBottom:16}}>
        <label style={{...S.label, display:'block', marginBottom:10}}>Outcome *</label>
        <div style={S.outGrp}>
          <div style={S.outGrpLabel}>Hits</div>
          <div style={{...S.outBtns, ...(quickMode?{gap:8}:{})}}>{HIT_OUTCOMES.map(o => <OBtn key={o} label={o} group="hit"/>)}</div>
        </div>
        <div style={S.outGrp}>
          <div style={S.outGrpLabel}>Outs</div>
          <div style={{...S.outBtns, ...(quickMode?{gap:8}:{})}}>{OUT_OUTCOMES.map(o => <OBtn key={o} label={o} group="out"/>)}</div>
        </div>
        <div style={S.outGrp}>
          <div style={S.outGrpLabel}>Other</div>
          <div style={{...S.outBtns, ...(quickMode?{gap:8}:{})}}>{OTHER_OUTCOMES.map(o => <OBtn key={o} label={o} group="other"/>)}</div>
        </div>
      </div>

      {/* Foul out sub-type */}
      {isFoulOut && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>Foul Out Type</label>
          <div style={S.outBtns}>
            <SubBtn label="Foul Caught (by fielder)" val="caught"/>
            <SubBtn label="Foul Strikeout (not caught)" val="strikeout"/>
          </div>
        </div>
      )}

      {/* Bases for ROE / FC */}
      {showBases && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>Bases Reached</label>
          <div style={S.outBtns}>{[1,2,3].map(n => <BaseBtn key={n} n={n}/>)}</div>
        </div>
      )}

      {/* Spray chart — hidden in quick mode */}
      {showSpray && !quickMode && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>Hit Location {f.spray ? '✓ placed' : '— tap the field'}</label>
          <div style={{display:'flex', justifyContent:'center', background:'var(--spray-bg)', borderRadius:10, padding:12, border:'1px solid var(--border)'}}>
            <SprayChart onPlot={pt => upd('spray', {...pt, w:320, h:281})} plotted={f.spray} interactive={true} size={300}/>
          </div>
          {f.spray && <button onClick={() => upd('spray', null)} style={{...S.btnSmall, marginTop:6, fontSize:11}}>Clear placement</button>}
        </div>
      )}

      {/* RBI + Run Scored */}
      {(showRBI || showRunScored) && (
        <div style={{...S.formGrid2, marginBottom:16}}>
          {showRBI && (
            <div style={S.formGroup}>
              <label style={S.label}>RBI</label>
              <input type="number" min="0" max="4" style={{...S.input, maxWidth:90}}
                value={f.rbi} onChange={e => upd('rbi', Math.max(0, parseInt(e.target.value)||0))}/>
            </div>
          )}
          {showRunScored && (
            <div style={S.formGroup}>
              <label style={S.label}>Run Scored?</label>
              <label style={{...S.checkRow, marginTop:4}}>
                <input type="checkbox" checked={f.runScored} onChange={e => upd('runScored', e.target.checked)}/>
                <span>I scored this AB</span>
              </label>
            </div>
          )}
        </div>
      )}

      {/* Fielding — hidden in quick mode */}
      {!quickMode && (
        <div style={{borderTop:'1px solid var(--border)', paddingTop:14, marginBottom:14}}>
          <div style={{...S.label, marginBottom:10, display:'block'}}>Fielding This AB</div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:10}}>
            <div style={S.formGroup}>
              <label style={S.label}>Position</label>
              <select style={S.select} value={f.position} onChange={e => upd('position', e.target.value)}>
                <option value="">—</option>
                {POSITIONS.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <div style={S.formGroup}><label style={S.label}>PO</label><input type="number" min="0" style={S.input} value={f.putouts} onChange={e => upd('putouts', parseInt(e.target.value)||0)}/></div>
            <div style={S.formGroup}><label style={S.label}>A</label><input type="number" min="0" style={S.input} value={f.assists} onChange={e => upd('assists', parseInt(e.target.value)||0)}/></div>
            <div style={S.formGroup}><label style={S.label}>E</label><input type="number" min="0" style={S.input} value={f.errors} onChange={e => upd('errors', parseInt(e.target.value)||0)}/></div>
          </div>
        </div>
      )}

      {/* Comments — hidden in quick mode */}
      {!quickMode && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>AB Comments</label>
          <textarea style={{...S.input, height:65, resize:'vertical'}} value={f.comments} onChange={e => upd('comments', e.target.value)} placeholder="Notes about this at bat..."/>
        </div>
      )}

      <div style={{display:'flex', gap:10}}>
        <button onClick={save} disabled={!f.outcome || (isFoulOut && !f.subOutcome)}
          style={{...S.btnPrimary, ...(quickMode?{flex:1, padding:'14px 18px', fontSize:15}:{})}}>
          {isEdit ? 'Save Changes' : quickMode ? 'Save AB' : 'Record AB'}
        </button>
        <button onClick={handleCancel} style={S.btnSecondary}>Cancel</button>
      </div>
      {isFoulOut && !f.subOutcome && <p style={{...S.hint, marginTop:8}}>Select foul out type to continue.</p>}
    </div>
  );
}

// ─── GAME DETAIL PAGE ──────────────────────────────────────────────────────────
function GameDetailPage({ uid, gameId, setPage, prevPage='games' }) {
  const [game, setGame] = useState(null);
  const [abs, setAbs] = useState([]);
  const [bats, setBats] = useState([]);
  const [profile, setProfile] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [quickMode, setQuickMode] = useState(false);
  const [loading, setLoading] = useState(true);
  const [editingGame, setEditingGame] = useState(false);
  const [gameForm, setGameForm] = useState(null);
  const [savingGame, setSavingGame] = useState(false);
  const [showHeatmap, setShowHeatmap] = useState(false);
  const [confirmAB, setConfirmAB] = useState(null);
  const [confirmGame, setConfirmGame] = useState(false);

  const loadGame = () => gamesCol(uid).doc(gameId).get().then(d => {
    const g = {id:d.id,...d.data()};
    setGame(g);
    setGameForm(g);
  });
  const loadABs = () => absCol(uid,gameId).orderBy('timestamp','asc').get().then(s => { setAbs(s.docs.map(d=>({id:d.id,...d.data()}))); setLoading(false); });

  useEffect(() => {
    loadGame(); loadABs();
    batsCol(uid).get().then(s => setBats(s.docs.map(d=>({id:d.id,...d.data()}))));
    userDoc(uid).get().then(d => { if (d.exists && d.data().profile) setProfile(d.data().profile); });
  }, [uid, gameId]);

  const delAB = async id => {
    await absCol(uid, gameId).doc(id).delete(); setConfirmAB(null); loadABs();
  };

  const delGame = async () => {
    // Delete all ABs first
    const snap = await absCol(uid, gameId).get();
    await Promise.all(snap.docs.map(d => d.ref.delete()));
    await gamesCol(uid).doc(gameId).delete();
    setPage('games');
  };

  const saveGame = async () => {
    setSavingGame(true);
    await gamesCol(uid).doc(gameId).update({...gameForm, dayOfWeek: getDayOfWeek(gameForm.date)});
    setSavingGame(false);
    setEditingGame(false);
    loadGame();
  };

  const updGame = (k,v) => setGameForm(f=>({...f,[k]:v}));

  const stats = calcGameStats(abs, profile.includeKFoulInK);
  const res = game ? getResult(game) : null;
  const fldPct = stats.po+stats.ast+stats.err > 0 ? ((stats.po+stats.ast)/(stats.po+stats.ast+stats.err)).toFixed(3).replace('0.','.') : '—';
  const sprayHits = abs.filter(ab => ab.spray);
  const handedness = profile.bats || 'R';

  // Hit direction breakdown
  const dirCounts = {Pull:0, Center:0, Oppo:0};
  sprayHits.filter(ab => COUNTS_AS_HIT.has(ab.outcome)).forEach(ab => {
    const d = getHitDirection(ab.spray, handedness);
    if (d) dirCounts[d]++;
  });
  const dirTotal = dirCounts.Pull + dirCounts.Center + dirCounts.Oppo;

  if (!game) return <div className="page-content"><p style={S.muted}>Loading game...</p></div>;

  return (
    <div className="page-content">
      {confirmAB && <ConfirmModal message="Delete this at bat?" onConfirm={()=>delAB(confirmAB)} onCancel={()=>setConfirmAB(null)}/>}
      {confirmGame && <ConfirmModal message="Delete this game? All recorded ABs will also be deleted." onConfirm={delGame} onCancel={()=>setConfirmGame(false)}/>}

      <div style={S.pageHeader} className="page-header-row">
        <button onClick={() => setPage(prevPage)} style={S.backBtn}>← {prevPage === 'gamelog' ? 'Game Log' : prevPage === 'stats' ? 'Stats' : 'Games'}</button>
        <div style={{display:'flex', gap:8}}>
          {!editingGame && <button onClick={()=>setEditingGame(true)} style={S.btnSmall}>Edit Game</button>}
          {!editingGame && abs.length>0 && <button onClick={()=>generateGamePDF(game,abs,profile)} style={S.btnSmall}>↓ PDF</button>}
          <button onClick={()=>setConfirmGame(true)} style={S.btnDanger}>Delete Game</button>
        </div>
      </div>

      {/* Edit game form */}
      {editingGame && gameForm && (
        <div style={S.card}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
            <div style={S.cardTitle}>Edit Game Info</div>
            <button onClick={()=>setEditingGame(false)} style={S.btnSmall}>Cancel</button>
          </div>
          <div style={S.formGrid2} className="form-grid-2">
            <div style={S.formGroup}>
              <label style={S.label}>Date *</label>
              <input type="date" style={S.input} value={gameForm.date||''} onChange={e=>updGame('date',e.target.value)}/>
              {gameForm.date && <span style={S.hintGreen}>{getDayOfWeek(gameForm.date)}</span>}
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Time</label>
              <input type="time" style={S.input} value={gameForm.time||''} onChange={e=>updGame('time',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Day / Night</label>
              <select style={S.select} value={gameForm.dayNight||''} onChange={e=>updGame('dayNight',e.target.value)}>
                <option value="">Select</option><option value="Day">Day</option><option value="Night">Night</option>
              </select>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Home / Away</label>
              <select style={S.select} value={gameForm.homeAway||''} onChange={e=>updGame('homeAway',e.target.value)}>
                <option value="">Select</option><option value="Home">Home</option><option value="Away">Away</option>
              </select>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Opponent</label>
              <input style={S.input} value={gameForm.opponent||''} onChange={e=>updGame('opponent',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Park / Location</label>
              <input style={S.input} value={gameForm.park||''} onChange={e=>updGame('park',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>My Score</label>
              <input type="number" min="0" style={S.input} value={gameForm.myScore||''} onChange={e=>updGame('myScore',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Opponent Score</label>
              <input type="number" min="0" style={S.input} value={gameForm.oppScore||''} onChange={e=>updGame('oppScore',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Season Name</label>
              <input style={S.input} value={gameForm.season||''} onChange={e=>updGame('season',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Team Name</label>
              <input style={S.input} value={gameForm.teamName||''} onChange={e=>updGame('teamName',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>League</label>
              <input style={S.input} value={gameForm.league||''} onChange={e=>updGame('league',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Tier / Division</label>
              <input style={S.input} value={gameForm.tier||''} onChange={e=>updGame('tier',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Comments</label>
              <textarea style={{...S.input,height:80,resize:'vertical'}} value={gameForm.comments||''} onChange={e=>updGame('comments',e.target.value)}/>
            </div>
          </div>
          <div style={{display:'flex', gap:10, marginTop:14}}>
            <button onClick={saveGame} disabled={savingGame} style={S.btnPrimary}>{savingGame?'Saving...':'Save Changes'}</button>
            <button onClick={()=>setEditingGame(false)} style={S.btnSecondary}>Cancel</button>
          </div>
        </div>
      )}

      {/* Game header card */}
      {!editingGame && (
        <div style={S.card}>
          <div style={{display:'flex', alignItems:'flex-start', gap:14, marginBottom:14}}>
            {res && <div style={{...S.resultBadge, background:res.color+'18', color:res.color, fontSize:16}}>{res.label}</div>}

                {game.teamName ? `${game.teamName} vs. ${game.opponent||'Unknown'}` : `vs. ${game.opponent||'Unknown'}`}
              </div>
              <div style={S.listSub}>
                {fmtDate(game.date)}{game.time ? ` · ${fmtTime(game.time)}` : ''}{game.dayNight ? ` · ${game.dayNight}` : ''}
              </div>
            </div>
            {game.myScore !== '' && game.oppScore !== '' && game.myScore !== undefined && (

            {[['AVG',calcAVG(stats.h,stats.ab)],['OBP',calcOBP(stats.h,stats.bb,stats.hbp,stats.sf,stats.ab)],['SLG',calcSLG(stats.tb,stats.ab)]].map(([l,v]) => (
              <div key={l} style={S.statCell}><div style={S.statLabel}>{l}</div><div style={{...S.statVal, color:'#276749'}}>{v}</div></div>
            ))}
          </div>
          {(stats.po+stats.ast+stats.err > 0) && (
            <div style={{marginTop:12, paddingTop:12, borderTop:'1px solid #e2e8f0'}}>
              <div style={{...S.label, marginBottom:8, display:'block'}}>Fielding</div>

                <span style={S.muted}>PO: <span style={{color:'#1a202c',fontWeight:600}}>{stats.po}</span></span>
                <span style={S.muted}>A: <span style={{color:'#1a202c',fontWeight:600}}>{stats.ast}</span></span>
                <span style={S.muted}>E: <span style={{color:'#1a202c',fontWeight:600}}>{stats.err}</span></span>

              </div>
            </div>

      {/* Spray chart + heatmap */}
      {sprayHits.length > 0 && (
        <div style={S.card}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12}}>
            <div style={S.cardTitle}>Spray Chart — This Game</div>
            <div style={{display:'flex', gap:4}}>
              {[['Spray', 'spray'],['Heat', 'heat'],['Zones', 'zones']].map(([label, val]) => (
                <button key={val} onClick={()=>setShowHeatmap(val)}
                  style={{...S.btnSmall,...(showHeatmap===val?{background:'var(--primary)',color:'var(--primary-text)',borderColor:'var(--primary)',fontWeight:700}:{})}}>{label}</button>
              ))}
            </div>
          </div>
          <div style={{display:'flex', justifyContent:'center', background:'var(--spray-bg)', borderRadius:10, padding:12}}>
            <SprayChart interactive={false} hits={sprayHits} size={300} showHeatmap={showHeatmap==='heat'} showZones={showHeatmap==='zones'} handedness={handedness}/>
          </div>
          <p style={{...S.hint, marginTop:8, textAlign:'center'}}>
            {sprayHits.length} charted {sprayHits.length===1?'ball':'balls'} · <span style={{color:'#276749'}}>●</span> Hit · <span style={{color:'#c53030'}}>●</span> Out/Other
          </p>
          {dirTotal > 0 && (
            <div style={{marginTop:14, paddingTop:12, borderTop:'1px solid #edf2f7'}}>
              <div style={{...S.cardTitle, marginBottom:10}}>Hit Direction (hits only)</div>
              {['Pull','Center','Oppo'].map(dir => {
                const pct = dirTotal > 0 ? Math.round(dirCounts[dir]/dirTotal*100) : 0;

                  <div key={dir} style={{marginBottom:8}}>
                    <div style={{display:'flex', justifyContent:'space-between', fontSize:12, marginBottom:3}}>

      {/* At Bats */}

        {showForm && (

                  onSave={() => { setEditId(null); loadABs(); }}
                  onCancel={() => setEditId(null)}/>
              );
              const label = ab.outcome + (ab.outcome === 'Foul Out' ? (ab.subOutcome === 'caught' ? ' (caught)' : ab.subOutcome === 'strikeout' ? ' (K)' : '') : '');
              const dir = ab.spray && COUNTS_AS_HIT.has(ab.outcome) ? getHitDirection(ab.spray, handedness) : null;
              const moveAB = async (fromIdx, toIdx) => {
                if (toIdx < 0 || toIdx >= abs.length) return;
                // Swap timestamps to reorder
                const a = abs[fromIdx], b = abs[toIdx];
                const tsA = a.timestamp, tsB = b.timestamp;
                await Promise.all([
                  absCol(uid, gameId).doc(a.id).update({timestamp: tsB}),
                  absCol(uid, gameId).doc(b.id).update({timestamp: tsA}),
                ]);
                loadABs();

              return (
                <div key={ab.id} style={S.listItem}>
                  <div style={{display:'flex', flexDirection:'column', gap:2, flexShrink:0, marginRight:4}}>

                    <div style={{width:24, height:24, borderRadius:7, background:color+'18', color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700}}>{i+1}</div>
                    <button onClick={() => moveAB(i, i+1)} disabled={i===abs.length-1} style={{background:'none', border:'none', cursor:'pointer', color:'var(--muted)', fontSize:12, padding:'1px 4px', lineHeight:1}}>▼</button>
                  </div>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap'}}>
                      <span style={{fontWeight:600, color, fontSize:13}}>{label}</span>
                      {ab.rbi > 0 && <span style={S.badge}>{ab.rbi} RBI</span>}
                      {ab.runScored && <span style={S.badge}>R</span>}
                      {dir && <span style={{...S.badge, color:'var(--primary)'}}>{dir}</span>}
                      {ab.spray && <span style={{...S.badge, color:'var(--success)'}}>📍</span>}
                    </div>
                    <div style={S.listSub}>
                      {[ab.batName, ab.position, (ab.putouts>0||ab.assists>0||ab.errors>0) && `${ab.putouts}PO ${ab.assists}A ${ab.errors}E`].filter(Boolean).join(' · ')}
                    </div>
                    {ab.comments && <div style={{...S.hint, marginTop:3, fontStyle:'italic'}}>"{ab.comments}"</div>}
                  </div>
                  <div style={{display:'flex', gap:6, flexShrink:0}}>
                    <button onClick={() => setEditId(ab.id)} style={S.btnSmall}>Edit</button>
                    <button onClick={() => setConfirmAB(ab.id)} style={S.btnDanger}>Del</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function SeasonsPage({ uid }) {
  const [seasons, setSeasons] = useState([]);
  const [games, setGames] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const blank = { name:'', teamName:'', league:'', tier:'', notes:'' };
  const [form, setForm] = useState(blank);
  const upd = (k,v) => setForm(f=>({...f,[k]:v}));

  const load = async () => {
    const [seasSnap, gamesSnap] = await Promise.all([
      seasonsCol(uid).orderBy('createdAt','desc').get(),
      gamesCol(uid).get()
    ]);
    setSeasons(seasSnap.docs.map(d=>({id:d.id,...d.data()})));
    setGames(gamesSnap.docs.map(d=>({id:d.id,...d.data()})));
    setLoading(false);
  };

  useEffect(() => { load(); }, [uid]);

  const startNew  = () => { setForm(blank); setEditing('new'); };
  const startEdit = s  => { setForm({name:s.name||'',teamName:s.teamName||'',league:s.league||'',tier:s.tier||'',notes:s.notes||''}); setEditing(s.id); };

  const save = async () => {
    const data = { ...form, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (editing === 'new') {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await seasonsCol(uid).add(data);
    } else {
      // Get old season name before updating
      const oldDoc = seasons.find(s => s.id === editing);
      await seasonsCol(uid).doc(editing).update(data);
      // Propagate name change to all games that used old season name
      if (oldDoc && oldDoc.name !== form.name) {
        const gSnap = await gamesCol(uid).where('season', '==', oldDoc.name).get();
        await Promise.all(gSnap.docs.map(d => d.ref.update({
          season: form.name,
          teamName: form.teamName||d.data().teamName,
          league: form.league||d.data().league,
          tier: form.tier||d.data().tier,
        })));
      }
    }
    setEditing(null); load();
  };

  const del = async id => {
    await seasonsCol(uid).doc(id).delete(); setConfirmDel(null); load();
  };

  if (editing !== null) return (
    <div className="page-content">
      <div style={S.pageHeader} className="page-header-row">
        <button onClick={() => setEditing(null)} style={S.backBtn}>← Seasons</button>
        <h2 style={S.pageTitle}>{editing === 'new' ? 'New Season' : 'Edit Season'}</h2>
      </div>
      <div style={S.card}>
        <div style={S.formGrid2} className="form-grid-2">
          <div style={{...S.formGroup, gridColumn:'1/-1'}}>
            <label style={S.label}>Season Name *</label>
            <input style={S.input} value={form.name} onChange={e=>upd('name',e.target.value)} placeholder="e.g. 2026 Sluggers"/>
          </div>
          <div style={{...S.formGroup, gridColumn:'1/-1'}}>
            <label style={S.label}>Team Name</label>
            <input style={S.input} value={form.teamName} onChange={e=>upd('teamName',e.target.value)} placeholder="e.g. The Sluggers"/>
          </div>
          <div style={S.formGroup}>
            <label style={S.label}>League</label>
            <input style={S.input} value={form.league} onChange={e=>upd('league',e.target.value)} placeholder="League name"/>
          </div>
          <div style={S.formGroup}>
            <label style={S.label}>Tier / Division</label>
            <input style={S.input} value={form.tier} onChange={e=>upd('tier',e.target.value)} placeholder="e.g. Division A"/>
          </div>
          <div style={{...S.formGroup, gridColumn:'1/-1'}}>
            <label style={S.label}>Notes (optional)</label>
            <textarea style={{...S.input, height:80, resize:'vertical'}} value={form.notes} onChange={e=>upd('notes',e.target.value)} placeholder="Any notes about this season..."/>
          </div>
        </div>
      </div>
      <div style={{display:'flex', gap:10}}>
        <button onClick={save} disabled={!form.name} style={S.btnPrimary}>{editing==='new'?'Create Season':'Save Changes'}</button>
        <button onClick={()=>setEditing(null)} style={S.btnSecondary}>Cancel</button>
      </div>
    </div>
  );

  return (
    <div className="page-content">
      {confirmDel && <ConfirmModal message="Delete this season? Your games will not be affected." onConfirm={()=>del(confirmDel)} onCancel={()=>setConfirmDel(null)}/>}
      <div style={S.pageHeader} className="page-header-row">
        <h2 style={S.pageTitle}>Seasons</h2>
        <button onClick={startNew} style={S.btnPrimary}>+ New Season</button>
      </div>
      <p style={{...S.muted, marginBottom:16}}>Seasons let you quickly fill in team info when recording a new game.</p>
      {loading ? <p style={S.muted}>Loading...</p> : seasons.length === 0 ? (
        <div style={S.empty}>
          <p>No seasons yet.</p>
        </div>
      ) : (
        <div style={S.list}>
          {seasons.map(s => (
            <div key={s.id} style={S.listItem}>
              <div style={{flex:1, minWidth:0}}>
                <div style={S.listTitle}>{s.name}</div>
                <div style={S.listSub}>
                  {[s.teamName, s.league, s.tier].filter(Boolean).join(' · ')}
                </div>
                {(() => {
                  const sg = games.filter(g => (g.season||'') === s.name);
                  const w = sg.filter(g => getResult(g)?.label==='W').length;
                  const l = sg.filter(g => getResult(g)?.label==='L').length;
                  const t = sg.filter(g => getResult(g)?.label==='T').length;
                  if (!sg.length) return <div style={{...S.hint, marginTop:4}}>No games recorded yet</div>;
                  return (
                    <div style={{marginTop:5, display:'flex', alignItems:'center', gap:10}}>
                      <span style={{fontSize:12, color:'var(--muted)', fontWeight:600}}>{sg.length} game{sg.length!==1?'s':''}</span>
                      {(w+l+t>0) && <span style={{fontSize:12}}><span style={{color:'var(--success)',fontWeight:700}}>{w}W</span>{' '}<span style={{color:'var(--muted)'}}>·</span>{' '}<span style={{color:'var(--danger)',fontWeight:700}}>{l}L</span>{t>0&&<>{' '}<span style={{color:'var(--muted)'}}>·</span>{' '}<span style={{color:'#b7791f',fontWeight:700}}>{t}T</span></>}</span>}
                    </div>

                {s.notes && <div style={{...S.hint, marginTop:4, fontStyle:'italic'}}>{s.notes}</div>}
              </div>
              <div style={{display:'flex', gap:8, flexShrink:0}}>
                <button onClick={()=>startEdit(s)} style={S.btnSmall}>Edit</button>
                <button onClick={()=>setConfirmDel(s.id)} style={S.btnDanger}>Delete</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── SHARED HELPERS (filters + aggregation) ────────────────────────────────────
function useAllData(uid) {
  const [games, setGames]     = useState([]);
  const [allABs, setAllABs]   = useState({});
  const [profile, setProfile] = useState({});
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    const go = async () => {
      const [pdoc, gsnap] = await Promise.all([
        userDoc(uid).get(),
        gamesCol(uid).orderBy('date','desc').get()
      ]);
      if (pdoc.exists && pdoc.data().profile) setProfile(pdoc.data().profile);
      const gdata = gsnap.docs.map(d => ({id:d.id,...d.data()}));
      setGames(gdata);
      const abResults = await Promise.all(gdata.map(g => absCol(uid,g.id).orderBy('timestamp','asc').get()));
      const absMap = {};
      gdata.forEach((g,i) => { absMap[g.id] = abResults[i].docs.map(d=>({id:d.id,...d.data()})); });
      setAllABs(absMap);
      setLoading(false);
    };
    go();
  }, [uid]);
  return { games, allABs, profile, loading };
}

function aggregateGames(gameList, allABs, inclFoulK) {
  const t = { g:0, pa:0, ab:0, h:0, doubles:0, triples:0, hr:0, r:0, rbi:0, bb:0, hbp:0, sf:0, k:0, tb:0, po:0, ast:0, err:0, w:0, l:0, tie:0 };
  gameList.forEach(game => {
    t.g++;
    const abs = allABs[game.id] || [];
    const s = calcGameStats(abs, inclFoulK);
    t.pa+=s.pa; t.ab+=s.ab; t.h+=s.h; t.doubles+=s.doubles; t.triples+=s.triples; t.hr+=s.hr;
    t.r+=s.r; t.rbi+=s.rbi; t.bb+=s.bb; t.hbp+=s.hbp; t.sf+=s.sf; t.k+=s.kTotal; t.tb+=s.tb;
    t.po+=s.po; t.ast+=s.ast; t.err+=s.err;
    const res = getResult(game);
    if (res) { if(res.label==='W') t.w++; else if(res.label==='L') t.l++; else t.tie++; }
  });
  const fldD = t.po+t.ast+t.err;
  const obpStr = calcOBP(t.h,t.bb,t.hbp,t.sf,t.ab);
  const slgStr = calcSLG(t.tb,t.ab);
  const opsVal = (obpStr==='.---'||slgStr==='.---') ? '—' : (parseFloat('0'+obpStr)+parseFloat('0'+slgStr)).toFixed(3);
  return {
    ...t,
    avg: calcAVG(t.h,t.ab), obp: obpStr, slg: slgStr, ops: opsVal,
    fldPct: fldD>0 ? ((t.po+t.ast)/fldD).toFixed(3).replace('0.','.') : '—',
    winPct: (t.w+t.l+t.tie)>0 ? (t.w/(t.w+t.l+t.tie)).toFixed(3).replace('0.','.') : '—',
  };
}

const emptyFilters = () => ({ season:'', dateFrom:'', dateTo:'', result:'all', lastN:'', lastDays:'', homeAway:'', park:'', opponent:'', dayNight:'', team:'', league:'', tier:'' });
const countFilters = f => [f.season,f.dateFrom,f.dateTo,f.homeAway,f.park,f.opponent,f.dayNight,f.team,f.league,f.tier].filter(Boolean).length + (f.result!=='all'?1:0) + (f.lastN?1:0) + (f.lastDays?1:0);

function applyFilters(games, f) {
  const daysAgo = n => { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().split('T')[0]; };
  let out = games.filter(g => {
    if (f.season   && (g.season||'')   !== f.season)   return false;
    if (f.dateFrom && g.date < f.dateFrom)              return false;
    if (f.dateTo   && g.date > f.dateTo)                return false;
    if (f.result !== 'all') { const r=getResult(g); if(!r||r.label!==f.result) return false; }
    if (f.lastDays){ const c=daysAgo(parseInt(f.lastDays)); if(g.date<c) return false; }
    if (f.homeAway && (g.homeAway||'') !== f.homeAway) return false;
    if (f.park     && (g.park||'')     !== f.park)     return false;
    if (f.opponent && (g.opponent||'') !== f.opponent) return false;
    if (f.dayNight && (g.dayNight||'') !== f.dayNight) return false;
    if (f.team     && (g.teamName||'') !== f.team)     return false;
    if (f.league   && (g.league||'')   !== f.league)   return false;
    if (f.tier     && (g.tier||'')     !== f.tier)     return false;
    return true;
  });
  if (f.lastN && parseInt(f.lastN)>0)
    out = [...out].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,parseInt(f.lastN));
  return out;
}

        <div style={S.formGroup}>
          <label style={S.label}>Day / Night</label>
          <select style={fs} value={filters.dayNight} onChange={e=>upd('dayNight',e.target.value)}>
            <option value="">All</option><option value="Day">Day</option><option value="Night">Night</option>

        <div style={S.formGroup}>
          <label style={S.label}>Opponent</label>

        {!compact && <>

            <label style={S.label}>Date from</label>
            <input type="date" style={fi} value={filters.dateFrom} onChange={e=>upd('dateFrom',e.target.value)}/>

            <input type="date" style={fi} value={filters.dateTo} onChange={e=>upd('dateTo',e.target.value)}/>

          <div style={S.formGroup}>
            <label style={S.label}>Last X games</label>
            <input type="number" min="1" style={fi} value={filters.lastN} onChange={e=>upd('lastN',e.target.value)} placeholder="e.g. 5"/>
          </div>
          <div style={S.formGroup}>
            <label style={S.label}>Last X days</label>
            <select style={fs} value={filters.lastDays} onChange={e=>upd('lastDays',e.target.value)}>
              <option value="">Any</option><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option>
            </select>
          </div>
          <div style={S.formGroup}>
            <label style={S.label}>Team</label>
            <select style={fs} value={filters.team} onChange={e=>upd('team',e.target.value)}>
              <option value="">All</option>
              {teams.map(t=><option key={t} value={t}>{t}</option>)}

          <div style={S.formGroup}>
