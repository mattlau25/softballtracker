  --border:       #e2e8f0;
  --border2:      #edf2f7;
  --text:         #1a202c;
  --text2:        #2d3748;
  --muted:        #718096;
  --label:        #4a5568;
  --nav-bg:       #ffffff;
  --nav-text:     #4a5568;
  --nav-active:   #1e3a5f;
  --nav-border:   #e2e8f0;
  --primary:      #1e3a5f;
  --primary-text: #ffffff;
  --success:      #276749;
  --danger:       #c53030;
  --blue:         #2b6cb0;
  --card-shadow:  0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
  --spray-foul:   #e8ede8;
  --spray-out:    #d4e6d4;
  --spray-dirt:   #e8d5b0;
  --spray-mound:  #dcc89a;
  --spray-path:   #c4a882;
  --spray-line:   #9ab89a;
  --spray-fence:  #1e3a5f;
  --spray-label:  #7a9a7a;
  --spray-tap:    #9ab89a;
  --spray-plot:   #1e3a5f;
  --spray-bg:     #eef2ee;

  /* ── Layout ── */
  --nav-w:    224px;
  --page-max: 1080px;
  --page-px:  40px;
  --page-py:  32px;
}

/* ── Dark theme ── */
[data-theme="dark"] {
  --bg:           #0d1117;
  --surface:      #111827;
  --surface2:     #0d1117;
  --border:       #1f2937;
  --border2:      #1a2030;
  --text:         #e2e8f0;
  --text2:        #94a3b8;
  --muted:        #64748b;
  --label:        #94a3b8;
  --nav-bg:       #111d2e;
  --nav-text:     rgba(255,255,255,0.8);
  --nav-active:   #ffffff;
  --nav-border:   rgba(255,255,255,0.1);  --primary:      #4ade80;
  --primary-text: #0d1117;
  --success:      #4ade80;
  --danger:       #f87171;
  --blue:         #60a5fa;
  --card-shadow:  none;
  --spray-foul:   #111827;
  --spray-out:    #14401a;
  --spray-dirt:   #3d2b1f;
  --spray-mound:  #4a3528;
  --spray-path:   #8b7355;
  --spray-line:   #4a6a4a;
  --spray-fence:  #4ade80;
  --spray-label:  #4a6a4a;
  --spray-tap:    #3d5a3d;
  --spray-plot:   #4ade80;
  --spray-bg:     #0a1a0a;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── Forms ── */
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator { filter: none; }
[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator,
[data-theme="dark"] input[type=time]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
button:disabled { opacity: 0.45; cursor: not-allowed; }

/* ── Dark mode nav overrides ── */
[data-theme="dark"] .nav-sidebar { box-shadow: none; border-right-color: rgba(255,255,255,0.08); }
[data-theme="dark"] .nav-brand-text { color: #fff; }
[data-theme="dark"] .nav-item { color: rgba(255,255,255,0.8); }
[data-theme="dark"] .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
[data-theme="dark"] .nav-item-active { color: #fff !important; background: rgba(255,255,255,0.12) !important; border-left-color: #fff !important; }
[data-theme="dark"] .nav-user { color: rgba(255,255,255,0.5); border-top-color: rgba(255,255,255,0.1); }

/* ── Tables dark mode ── */
[data-theme="dark"] table td { border-color: #1f2937 !important; }
[data-theme="dark"] table th { background: #0d1117 !important; color: #64748b !important; border-color: #1f2937 !important; }

/* ── Nav ── */
.nav-sidebar {
  width: var(--nav-w);
  min-height: 100vh;
  background: var(--nav-bg);
  border-right: 1px solid var(--nav-border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  z-index: 100;
  box-shadow: 1px 0 4px rgba(0,0,0,0.04);
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 20px;
  border-bottom: 1px solid var(--nav-border);
  flex-shrink: 0;
}
.nav-brand-text {
  font-size: 15px;
  font-weight: 700;
  color: #1e3a5f;
  letter-spacing: -0.01em;
}
.nav-items {
  flex: 1;
  padding: 8px 0;
  overflow-y: auto;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 20px;
  background: none;
  border: none;
  border-left: 3px solid transparent;
  color: var(--nav-text);
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  text-align: left;
  transition: background 0.12s, color 0.12s;
  line-height: 1.4;
}
.nav-item:hover { background: #f0f4ff; color: #1e3a5f; }
.nav-item-active { color: #1e3a5f !important; background: #eef2ff !important; border-left-color: #1e3a5f !important; font-weight: 600; }
.nav-user {
  padding: 12px 20px;
  border-top: 1px solid var(--nav-border);
  font-size: 12px;
  color: #718096;
  flex-shrink: 0;
}

/* ── Main wrap ── */
.main-wrap {
  margin-left: var(--nav-w);
  min-height: 100vh;
  background: var(--bg);
  width: calc(100% - var(--nav-w));
  display: flex;
  flex-direction: column;
}
.page-content {
  padding: var(--page-py) var(--page-px);
  max-width: var(--page-max);
  margin: 0 auto;
  width: 100%;
  min-width: 0;
}

/* ── Tablet ── */
@media (max-width: 1024px) {
  :root {
    --nav-w: 200px;
    --page-px: 24px;
    --page-py: 24px;
  }
}

/* ── Mobile ── */
@media (max-width: 640px) {
  :root {
    --page-px: 16px;
    --page-py: 16px;
  }
  .nav-sidebar {
    width: 100% !important;
    min-height: auto !important;
    top: auto !important;
    bottom: 0 !important;
    flex-direction: row !important;
    border-top: 1px solid var(--nav-border) !important;
    border-right: none !important;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
  }
  .nav-brand { display: none !important; }
  .nav-user  { display: none !important; }
  .nav-items {
    display: flex !important;
    flex-direction: row !important;
    padding: 0 !important;
    overflow: visible !important;
    width: 100%;
  }
  .nav-item {
    flex-direction: column !important;
    padding: 8px 2px calc(8px + env(safe-area-inset-bottom, 0px)) !important;
    font-size: 10px !important;
    gap: 3px !important;
    border-left: none !important;
    border-top: 2px solid transparent !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 1 !important;
    min-width: 0 !important;
    font-weight: 400 !important;
    white-space: nowrap;
    overflow: hidden;
  }
  .nav-item-active {
    border-left-color: transparent !important;
    border-top-color: #1e3a5f !important;
    font-weight: 600 !important;
    color: #1e3a5f !important;
    background: #f0f4ff !important;
  }
  .main-wrap {
    margin-left: 0 !important;
    width: 100% !important;
    padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px)) !important;
  }
  /* Show profile icon on Games page mobile */
  .mobile-profile-btn { display: flex !important; align-items: center !important; }
  /* Collapse 2-col grids */
  .form-grid-2 { grid-template-columns: 1fr !important; }
  .stats-grid-5 { grid-template-columns: repeat(3, 1fr) !important; }
  .compare-grid { grid-template-columns: 1fr !important; }
  .page-header-row { flex-wrap: wrap !important; gap: 12px !important; }
}

/* Profile nav item — desktop only in sidebar, hidden on mobile bottom bar */
.nav-profile-desktop {
  display: flex;
}
@media (max-width: 640px) {
  .nav-profile-desktop { display: none !important; }
}
</style>

// ─── HIT DIRECTION ─────────────────────────────────────────────────────────────
// Returns 'Pull' | 'Center' | 'Oppo' based on spray x position and handedness
function getHitDirection(spray, handedness) {
  if (!spray) return null;
  const W = spray.w || 320;
  const nx = spray.x / W; // 0 = left field, 1 = right field
  // For right-handed batter: pull = left field (nx < 0.4), oppo = right field (nx > 0.6)
  // For left-handed batter: pull = right field (nx > 0.6), oppo = left field (nx < 0.4)
  if (handedness === 'L') {
    if (nx > 0.62) return 'Pull';
    if (nx < 0.38) return 'Oppo';
    return 'Center';
  } else {
    if (nx < 0.38) return 'Pull';
    if (nx > 0.62) return 'Oppo';
    return 'Center';
  }
}

// ─── STAT HELPERS ──────────────────────────────────────────────────────────────
const fmt3 = n => isNaN(n) || !isFinite(n) ? '.000' : '.' + Math.round(n * 1000).toString().padStart(3,'0');
const calcAVG = (h, ab)      => ab === 0 ? '.---' : fmt3(h / ab);
const calcOBP = (h, bb, hbp, sf, ab) => { const d = ab + bb + hbp + sf; return d === 0 ? '.---' : fmt3((h + bb + hbp) / d); };
const calcSLG = (tb, ab)     => ab === 0 ? '.---' : fmt3(tb / ab);
const calcOPS = (obp, slg)   => { if (obp === '.---' || slg === '.---') return '.---'; const v = parseFloat('0' + obp) + parseFloat('0' + slg); return fmt3(v); };

function getDayOfWeek(ds) { if (!ds) return ''; return DAYS[new Date(ds + 'T12:00:00').getDay()]; }
function fmtDate(ds) {
  if (!ds) return '';
  const d = new Date(ds + 'T12:00:00');
  return d.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,'0')}${ampm}`;
}
function getResult(g) {
  const ms = parseInt(g.myScore), os = parseInt(g.oppScore);
  if (isNaN(ms) || isNaN(os)) return null;
  if (ms > os) return { label:'W', color:'#276749' };
  if (ms < os) return { label:'L', color:'#c53030' };
  return { label:'T', color:'#b7791f' };
}
function abOutcomeColor(ab) {
  if (COUNTS_AS_HIT.has(ab.outcome)) return '#276749';
  if (['Walk','Hit by Pitch'].includes(ab.outcome)) return '#2b6cb0';
  if (ab.outcome === 'Strikeout' || (ab.outcome === 'Foul Out' && ab.subOutcome === 'strikeout')) return '#c53030';
  return '#a0aec0';
}
function calcGameStats(abs, includeKFoulInK) {
  return abs.reduce((a, ab) => {
    a.pa++;
    if (COUNTS_AS_AB.has(ab.outcome)) a.ab++;
    if (COUNTS_AS_HIT.has(ab.outcome)) { a.h++; a.tb += (ab.bases || HIT_BASES[ab.outcome] || 0); }
    if (ab.rbi) a.rbi += ab.rbi;
    if (ab.runScored) a.r++;
    if (ab.outcome === 'Walk') a.bb++;
    if (ab.outcome === 'Hit by Pitch') a.hbp++;
    if (ab.outcome === 'Sac Fly') a.sf++;
    if (ab.outcome === 'Strikeout') a.k++;
    if (ab.outcome === 'Foul Out' && ab.subOutcome === 'strikeout') a.foulK++;
    a.po += (ab.putouts || 0); a.ast += (ab.assists || 0); a.err += (ab.errors || 0);
    if (ab.outcome === 'Double') a.doubles++;
    if (ab.outcome === 'Triple') a.triples++;
    if (ab.outcome === 'Home Run') a.hr++;
    const totalK = a.k + (includeKFoulInK ? a.foulK : 0);
    a.kTotal = totalK;
    return a;
  }, { pa:0, ab:0, h:0, tb:0, rbi:0, r:0, bb:0, hbp:0, sf:0, k:0, foulK:0, kTotal:0, po:0, ast:0, err:0, doubles:0, triples:0, hr:0 });
}

// ─── SPRAY CHART ───────────────────────────────────────────────────────────────
function SprayChart({ onPlot, plotted, interactive = true, hits = [], size = 320, showHeatmap = false, showZones = false, handedness = 'R' }) {
  // Better proportions — taller arc, more realistic field shape
  const W = size;
  const H = Math.round(size * 0.92);
  const HX = W / 2;
  const HY = H - 16;
  const D = size * 0.22; // diamond leg

  // Base positions
  const firstX = HX + D, firstY = HY - D;
  const secX   = HX,     secY   = HY - 2 * D;
  const thirdX = HX - D, thirdY = HY - D;

  // Outfield arc — wider and higher for realistic look
  const arcR  = size * 0.76;
  const arcLX = HX - arcR * 0.71, arcLY = HY - arcR * 0.71;
  const arcRX = HX + arcR * 0.71, arcRY = HY - arcR * 0.71;

  // Foul lines extend past arc
  const foulLen = size * 0.90;
  const foulLX = HX - foulLen * 0.71, foulLY = HY - foulLen * 0.71;
  const foulRX = HX + foulLen * 0.71, foulRY = HY - foulLen * 0.71;

  // Infield arc (grass circle around infield)
  const infieldR = D * 1.55;

  const handleClick = e => {
    if (!interactive) return;
    const svg = e.currentTarget.closest('svg');
    const rect = svg.getBoundingClientRect();
    const x = Math.round(((e.clientX - rect.left) / rect.width) * W);
    const y = Math.round(((e.clientY - rect.top) / rect.height) * H);
    onPlot && onPlot({ x, y });
  };

  // Greyscale palette
  const C = {
    foulGrass:    '#e8e8e8',  // foul territory — lightest
    outfield:     '#d4d4d4',  // outfield grass
    infieldGrass: '#c8c8c8',  // infield grass circle
    infieldDirt:  '#bcbcbc',  // diamond dirt
    mound:        '#b0b0b0',
    base:         '#f5f5f5',
    baseStroke:   '#a0a0a0',
    line:         '#999',
    foulLine:     '#aaa',
    fence:        '#888',
    label:        '#999',
    basePath:     '#a8a8a8',
  };

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', maxWidth: size, cursor: interactive ? 'crosshair' : 'default', borderRadius:8 }}
      onClick={handleClick}>

      {/* Background — foul territory */}
      <rect width={W} height={H} fill={C.foulGrass} rx="6"/>

      {/* Fair territory outfield — clipped to arc */}
      <path d={`M ${HX} ${HY} L ${foulLX} ${foulLY} A ${foulLen} ${foulLen} 0 0 1 ${foulRX} ${foulRY} Z`}
        fill={C.outfield}/>

      {/* Outfield to infield separation — infield grass circle */}
      <circle cx={HX} cy={HY - D * 0.9} r={infieldR} fill={C.infieldGrass}/>

      {/* Infield dirt diamond */}
      <polygon points={`${HX},${HY} ${firstX},${firstY} ${secX},${secY} ${thirdX},${thirdY}`}
        fill={C.infieldDirt}/>

      {/* Foul lines */}
      <line x1={HX} y1={HY} x2={foulLX} y2={foulLY} stroke={C.foulLine} strokeWidth="1" strokeDasharray="4,3" opacity="0.7"/>
      <line x1={HX} y1={HY} x2={foulRX} y2={foulRY} stroke={C.foulLine} strokeWidth="1" strokeDasharray="4,3" opacity="0.7"/>

      {/* Outfield fence arc */}
      <path d={`M ${arcLX} ${arcLY} A ${arcR} ${arcR} 0 0 1 ${arcRX} ${arcRY}`}
        fill="none" stroke={C.fence} strokeWidth="2.5"/>

      {/* Warning track — thick arc just inside fence */}
      <path d={`M ${arcLX} ${arcLY} A ${arcR} ${arcR} 0 0 1 ${arcRX} ${arcRY}`}
        fill="none" stroke={C.mound} strokeWidth="7" opacity="0.4"/>

      {/* Base paths */}
      {[[HX,HY,firstX,firstY],[firstX,firstY,secX,secY],[secX,secY,thirdX,thirdY],[thirdX,thirdY,HX,HY]].map(([x1,y1,x2,y2],i) => (
        <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={C.basePath} strokeWidth="1.5"/>
      ))}

      {/* Pitcher's mound */}
      <circle cx={HX} cy={HY - D * 0.9} r={size * 0.025} fill={C.mound}/>
      <circle cx={HX} cy={HY - D * 0.9} r={size * 0.012} fill={C.foulGrass} opacity="0.6"/>

      {/* Bases */}
      {[[firstX,firstY],[secX,secY],[thirdX,thirdY]].map(([bx,by],i) => (
        <rect key={i} x={bx-5} y={by-5} width="10" height="10"
          fill={C.base} stroke={C.baseStroke} strokeWidth="1"
          transform={`rotate(45,${bx},${by})`}/>
      ))}
      {/* Home plate */}
      <polygon points={`${HX},${HY-7} ${HX+5},${HY-4} ${HX+5},${HY+1} ${HX-5},${HY+1} ${HX-5},${HY-4}`}
        fill={C.base} stroke={C.baseStroke} strokeWidth="1"/>

      {/* Zone labels */}
      <text x={W*0.09} y={H*0.14} fill={C.label} fontSize={size*0.038} fontWeight="500">LF</text>
      <text x={W*0.91} y={H*0.14} textAnchor="end" fill={C.label} fontSize={size*0.038} fontWeight="500">RF</text>
      <text x={HX} y={H*0.07} textAnchor="middle" fill={C.label} fontSize={size*0.038} fontWeight="500">CF</text>
      <text x={HX} y={H*0.5} textAnchor="middle" fill={C.label} fontSize={size*0.032} opacity="0.7">HR</text>

      {/* Heatmap overlay */}
      {showHeatmap && hits.length > 0 && (() => {
        const cells = 12, cw = W/cells, ch = H/cells;
        const grid = Array.from({length:cells},()=>Array(cells).fill(0));
        hits.forEach(hit => {
          const nx = hit.x * W / (hit.w||320), ny = hit.y * H / (hit.h||281);
          const ci = Math.floor(nx/cw), ri = Math.floor(ny/ch);
          if (ci>=0&&ci<cells&&ri>=0&&ri<cells) grid[ri][ci]++;
        });
        const max = Math.max(...grid.flat(),1);
        return grid.flatMap((row,ri) => row.map((val,ci) => {
          if (!val) return null;
          return <rect key={`h${ri}-${ci}`} x={ci*cw} y={ri*ch} width={cw} height={ch}
            fill={`rgba(220,50,50,${(val/max)*0.7})`} rx="2"/>;
        }));
      })()}

      {/* Hot/cold zones */}
      {showZones && hits.length > 0 && (() => {
        const zones = calcHotColdZones(hits);
        const zoneCoords = [
          {x:0,y:0,w:W*0.38,h:H*0.5},{x:W*0.38,y:0,w:W*0.24,h:H*0.5},{x:W*0.62,y:0,w:W*0.38,h:H*0.5},
          {x:0,y:H*0.5,w:W*0.38,h:H*0.5},{x:W*0.38,y:H*0.5,w:W*0.24,h:H*0.5},{x:W*0.62,y:H*0.5,w:W*0.38,h:H*0.5},
        ];
        const maxAvg = Math.max(...zones.map(z=>z.avg||0),0.001);
        return zones.map((z,i) => {
          if (!z.ab) return null;
          const avgStr = z.avg!==null ? '.'+Math.round(z.avg*1000).toString().padStart(3,'0') : '—';
          const intensity = (z.avg||0)/maxAvg;
          const r = Math.round(197*(1-intensity)), g2 = Math.round(103*intensity);
          const c = zoneCoords[i];
          return (
            <g key={i}>
              <rect x={c.x} y={c.y} width={c.w} height={c.h} fill={`rgba(${r},${g2},0,0.25)`} stroke={`rgba(${r},${g2},0,0.4)`} strokeWidth="1"/>
              <text x={c.x+c.w/2} y={c.y+c.h/2-6} textAnchor="middle" dominantBaseline="middle" fontSize={size*0.038} fontWeight="700" fill={`rgb(${r},${g2},0)`}>{avgStr}</text>
              <text x={c.x+c.w/2} y={c.y+c.h/2+10} textAnchor="middle" fontSize={size*0.028} fill={`rgb(${r},${g2},0)`}>{z.ab} AB</text>
            </g>
          );
        });
      })()}

      {/* Previous hits */}
      {hits.map((hit,i) => (
        <circle key={i} cx={hit.x*W/(hit.w||320)} cy={hit.y*H/(hit.h||281)}
          r="5" fill={COUNTS_AS_HIT.has(hit.outcome)?'#276749':'#c53030'} fillOpacity="0.8"
          stroke={COUNTS_AS_HIT.has(hit.outcome)?'#1a4d34':'#9b2222'} strokeWidth="1"/>
      ))}

      {/* Plotted point */}
      {plotted && (
        <g>
          <circle cx={plotted.x} cy={plotted.y} r="10" fill="#1e3a5f" fillOpacity="0.15" stroke="#1e3a5f" strokeWidth="1.5"/>
          <circle cx={plotted.x} cy={plotted.y} r="5" fill="#1e3a5f"/>
        </g>
      )}
    </svg>
  );
}

// ─── LOGIN SCREEN ──────────────────────────────────────────────────────────────
function LoginScreen() {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const signIn = async () => {
    setLoading(true); setError('');
    try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch(e) { setError(e.message); setLoading(false); }
  };
  return (
    <div style={S.loginWrap}>
      <div style={S.loginCard}>
        <div style={{marginBottom:16, fontSize:52, lineHeight:1}}><i className="fa-solid fa-baseball" style={{fontSize:48, color:'#1e3a5f'}}></i></div>
        <h1 style={S.loginTitle}>Softball Tracker</h1>
        <p style={S.loginSub}>Personal stats, spray charts & game logs</p>
        <button onClick={signIn} disabled={loading} style={S.googleBtn}>
          {loading ? 'Signing in...' : 'Sign in with Google'}
        </button>
        {error && <p style={{color:'#c53030', marginTop:12, fontSize:12}}>{error}</p>}
      </div>
    </div>
  );
}

// ─── IMPORT BUTTON ─────────────────────────────────────────────────────────────
function ImportButton({ uid }) {
  const [importing, setImporting] = useState(false);
  const [result, setResult] = useState(null);
  const ref = React.useRef(null);
  const handle = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);
    try {
      const text = await file.text();
      const r = await importFromCSV(uid, text);
      setResult(r);
    } catch(err) {
      setResult({error: err.message});
    } finally {
      setImporting(false);
      e.target.value = '';
    }
  };
  return (
    <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4}}>
      <button onClick={() => ref.current?.click()} disabled={importing} style={S.btnSmall}>
        {importing ? 'Importing...' : '↑ Import CSV'}
      </button>
      <input ref={ref} type="file" accept=".csv" style={{display:'none'}} onChange={handle}/>
      {result && (
        <span style={{fontSize:11, color: result.error ? 'var(--danger)' : 'var(--success)', maxWidth:200, textAlign:'right'}}>
          {result.error ? result.error : `✓ ${result.gamesImported} games, ${result.absImported} ABs imported`}
        </span>
      )}
    </div>
  );
}

// ─── PROFILE PAGE ──────────────────────────────────────────────────────────────
function ProfilePage({ uid, darkMode, toggleDark }) {
  const [p, setP] = useState({ bats:'', defaultPosition:'', includeKFoulInK: false });
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [userEmail, setUserEmail] = useState('');
  useEffect(() => {
    userDoc(uid).get().then(d => { if (d.exists && d.data().profile) setP(x => ({...x, ...d.data().profile})); });
    // Get email from Firebase auth
    const u = auth.currentUser;
    if (u) setUserEmail(u.email || '');
  }, [uid]);
  const upd = (k, v) => setP(x => ({...x, [k]: v}));
  const save = async () => {
    setSaving(true);
    await userDoc(uid).set({ profile: p }, { merge: true });
    setSaving(false); setSaved(true); setTimeout(() => setSaved(false), 2500);
  };
  const doExport = async () => {
    setExporting(true);
    try { await exportCSV(uid); } finally { setExporting(false); }
  };

  const load = () => batsCol(uid).orderBy('createdAt','desc').get().then(s => { setBats(s.docs.map(d => ({id:d.id,...d.data()}))); setLoading(false); });
  useEffect(() => { load(); }, [uid]);
  const upd = (k, v) => setForm(f => ({...f, [k]: v}));

// ─── CSV EXPORT ────────────────────────────────────────────────────────────────
async function exportCSV(uid) {
  const gsnap = await gamesCol(uid).orderBy('date','desc').get();
  const games = gsnap.docs.map(d => ({id:d.id,...d.data()}));
  const rows = [['Date','Day','Opponent','Park','Home/Away','Day/Night','My Score','Opp Score','Result','Team','League','Tier','Season','PA','AB','H','2B','3B','HR','R','RBI','BB','K','AVG','OBP','SLG','PO','A','E','AB#','Outcome','Sub-Outcome','Bases','RBI','Run','Bat','Position','Hit Direction','Spray X','Spray Y','AB Comments','Game Comments']];
  for (const g of games) {
    const absSnap = await absCol(uid, g.id).orderBy('timestamp','asc').get();
    const abs = absSnap.docs.map(d => ({id:d.id,...d.data()}));
    const s = calcGameStats(abs, false);
    const res = getResult(g);
    abs.forEach((ab, i) => {
      const dir = ab.spray ? getHitDirection(ab.spray, 'R') : '';
      rows.push([
        g.date||'', g.dayOfWeek||'', g.opponent||'', g.park||'', g.homeAway||'', g.dayNight||'',
        g.myScore||'', g.oppScore||'', res?.label||'',
        g.teamName||'', g.league||'', g.tier||'', g.season||'',
        i===0?s.pa:'', i===0?s.ab:'', i===0?s.h:'', i===0?s.doubles:'', i===0?s.triples:'', i===0?s.hr:'',
        i===0?s.r:'', i===0?s.rbi:'', i===0?s.bb:'', i===0?s.kTotal:'',
        i===0?calcAVG(s.h,s.ab):'', i===0?calcOBP(s.h,s.bb,s.hbp,s.sf,s.ab):'', i===0?calcSLG(s.tb,s.ab):'',
        i===0?s.po:'', i===0?s.ast:'', i===0?s.err:'',
        i+1, ab.outcome||'', ab.subOutcome||'', ab.bases||'', ab.rbi||0, ab.runScored?'Y':'N',
        ab.batName||'', ab.position||'', dir,
        ab.spray?.x||'', ab.spray?.y||'',
        (ab.comments||'').replace(/,/g,' '), (g.comments||'').replace(/,/g,' ')
      ]);
    });
    if (abs.length === 0) {
      rows.push([g.date||'',g.dayOfWeek||'',g.opponent||'',g.park||'',g.homeAway||'',g.dayNight||'',g.myScore||'',g.oppScore||'',res?.label||'',g.teamName||'',g.league||'',g.tier||'',g.season||'',...Array(27).fill(''),(g.comments||'').replace(/,/g,' ')]);
    }
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`softball-stats-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ─── HAPTIC FEEDBACK ───────────────────────────────────────────────────────────
function haptic(style='light') {
  if (navigator.vibrate) {
    if (style === 'light') navigator.vibrate(8);
    else if (style === 'medium') navigator.vibrate(20);
    else if (style === 'success') navigator.vibrate([10, 50, 10]);
  }
}

// ─── HOT/COLD ZONES ────────────────────────────────────────────────────────────
// Divides field into 6 zones, calculates AVG per zone
function calcHotColdZones(hits) {
  // Zones: LF-deep, CF-deep, RF-deep, LF-short, CF-short, RF-short
  const zones = Array.from({length:6}, () => ({h:0, ab:0}));
  hits.forEach(hit => {
    if (!hit.spray) return;
    const W = hit.spray.w || 320, H = hit.spray.h || 281;
    const nx = hit.spray.x / W; // 0=left, 1=right
    const ny = hit.spray.y / H; // 0=top(deep), 1=bottom(home)
    const col = nx < 0.38 ? 0 : nx < 0.62 ? 1 : 2; // L/C/R
    const row = ny < 0.5 ? 0 : 1; // deep/short
    const zone = row * 3 + col;
    zones[zone].ab++;
    if (COUNTS_AS_HIT.has(hit.outcome)) zones[zone].h++;
  });
  return zones.map(z => ({
    ...z,
    avg: z.ab > 0 ? z.h / z.ab : null
  }));
}

// ─── CSV IMPORT ────────────────────────────────────────────────────────────────
async function importFromCSV(uid, csvText) {
  const lines = csvText.trim().split('\n');
  if (lines.length < 2) throw new Error('CSV appears empty');
  
  // Parse CSV rows (handle quoted fields)
  const parseRow = line => {
    const result = [];
    let current = '', inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQuotes = !inQuotes; }
      else if (line[i] === ',' && !inQuotes) { result.push(current); current = ''; }
      else { current += line[i]; }
    }
    result.push(current);
    return result;
  };

  const headers = parseRow(lines[0]);

  // Validate this looks like a softball tracker export
  const requiredHeaders = ['Date', 'Opponent', 'AB#', 'Outcome'];
  const missing = requiredHeaders.filter(h => !headers.includes(h));
  if (missing.length > 0) {
    throw new Error(`This doesn't look like a Softball Tracker CSV. Missing columns: ${missing.join(', ')}`);
  }
  const rows = lines.slice(1).map(parseRow);

  // Group rows by game (Date + Opponent)
  const gameMap = {};
  rows.forEach(row => {
    const get = h => { const i = headers.indexOf(h); return i >= 0 ? row[i]?.trim() : ''; };
    const key = `${get('Date')}__${get('Opponent')}`;
    if (!gameMap[key]) {
      gameMap[key] = {
        date: get('Date'), dayOfWeek: get('Day'), opponent: get('Opponent'),
        park: get('Park'), homeAway: get('Home/Away'), dayNight: get('Day/Night'),
        myScore: get('My Score'), oppScore: get('Opp Score'),
        teamName: get('Team'), league: get('League'), tier: get('Tier'),
        season: get('Season'), comments: get('Game Comments'),
        abs: []
      };
    }
    const abNum = parseInt(get('AB#'));
    if (abNum > 0) {
      gameMap[key].abs.push({
        outcome: get('Outcome'), subOutcome: get('Sub-Outcome'),
        bases: parseInt(get('Bases'))||0, rbi: parseInt(get('RBI'))||0,
        runScored: get('Run') === 'Y', batName: get('Bat'),
        position: get('Position'), comments: get('AB Comments'),
        countAsAB: COUNTS_AS_AB.has(get('Outcome')),
        countAsHit: COUNTS_AS_HIT.has(get('Outcome')),
      });
    }
  });

  // Write to Firebase
  let gamesImported = 0, absImported = 0;
  for (const gameData of Object.values(gameMap)) {
    const { abs, ...gameFields } = gameData;
    const ref = await gamesCol(uid).add({
      ...gameFields,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      imported: true
    });
    for (const ab of abs) {
      await absCol(uid, ref.id).add({
        ...ab,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      absImported++;
    }
    gamesImported++;
  }
  return { gamesImported, absImported };
}


function GamesPage({ uid, setPage, setGameId, active }) {
  const [games, setGames] = useState([]);

    setLoading(false);

  useEffect(() => { loadAll(); }, [uid, active]);

  const searchLower = search.toLowerCase().trim();

    ? games.filter(g => {
        const res = getResult(g);
        const resLabel = res?.label || '';
        // Whole-word match for result terms only
        const resWords = resLabel === 'W' ? ['w','win','won'] : resLabel === 'L' ? ['l','loss','lost'] : resLabel === 'T' ? ['t','tie','tied','draw'] : [];
        if (resWords.includes(searchLower)) return true;
        const fields = [
          g.opponent, g.park, g.teamName, g.season, g.league, g.tier,
          g.homeAway, g.dayNight, g.comments,
          g.date, fmtDate(g.date), getDayOfWeek(g.date),
          g.time ? fmtTime(g.time) : '', g.time,
          g.myScore !== undefined ? String(g.myScore) : '',
          g.oppScore !== undefined ? String(g.oppScore) : '',
          g.myScore !== undefined && g.oppScore !== undefined ? `${g.myScore}-${g.oppScore}` : '',
          g.date ? g.date.slice(0,4) : '',
        ].filter(Boolean);
        return fields.some(f => f.toLowerCase().includes(searchLower));
      })
    : games;

  const streak = (() => {
    if (!games.length) return null;
    const sorted = [...games].sort((a,b) => b.date.localeCompare(a.date));
    let hitStreak = 0;
    for (const g of sorted) {
      const abs = allABs[g.id] || [];
      if (abs.some(ab => COUNTS_AS_HIT.has(ab.outcome))) hitStreak++;
      else break;
    }
    return hitStreak >= 2 ? hitStreak : null;
  })();

  const careerHighs = (() => {
    if (!games.length) return null;
    let bestH = 0, bestRBI = 0;
    games.forEach(g => {
      const s = calcGameStats(allABs[g.id]||[], false);
      if (s.h > bestH) bestH = s.h;
      if (s.rbi > bestRBI) bestRBI = s.rbi;
    });
    return { bestH, bestRBI };
  })();

  const doExport = async () => {
    setExporting(true);
    try { await exportCSV(uid); } finally { setExporting(false); }
  };

  return (
    <div className="page-content">
      <div style={S.pageHeader} className="page-header-row">

            style={{display:'none', background:'none', border:'1px solid var(--border)', borderRadius:8, padding:'8px 10px', cursor:'pointer', color:'var(--label)'}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </button>
        </div>
      </div>
        <div style={{marginBottom:12, position:'relative'}}>
          <input style={{...S.input, paddingLeft:34}}
            value={search} onChange={e => setSearch(e.target.value)} placeholder="Search opponent, date, team, season, park..."/>
          <svg style={{position:'absolute', left:10, top:'50%', transform:'translateY(-50%)', opacity:0.4}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          {search && <button onClick={()=>setSearch('')} style={{position:'absolute', right:8, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', color:'var(--muted)', fontSize:14}}>✕</button>}
        </div>

      {!loading && !search && games.length > 0 && (streak || (careerHighs?.bestH > 0)) && (
        <div style={{...S.card, background:'rgba(99,102,241,0.08)', border:'1px solid rgba(99,102,241,0.2)', marginBottom:16}}>
          <div style={{display:'flex', flexWrap:'wrap', gap:20}}>
            {streak && <div><div style={{fontSize:11, color:'#6366f1', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:2}}>Hit Streak</div><div style={{fontSize:22, fontWeight:700, color:'#4338ca'}}>{streak} <span style={{fontSize:13, fontWeight:400}}>games</span></div></div>}
            {careerHighs?.bestH > 0 && <div><div style={{fontSize:11, color:'#6366f1', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:2}}>Best H (game)</div><div style={{fontSize:22, fontWeight:700, color:'#4338ca'}}>{careerHighs.bestH}</div></div>}
            {careerHighs?.bestRBI > 0 && <div><div style={{fontSize:11, color:'#6366f1', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:2}}>Best RBI (game)</div><div style={{fontSize:22, fontWeight:700, color:'#4338ca'}}>{careerHighs.bestRBI}</div></div>}
          </div>
        </div>
      )}

      {loading ? <p style={S.muted}>Loading...</p> : filteredGames.length === 0 ? (
        <div style={S.empty}>
          {search ? <p>No games match "{search}".</p> : <p style={{marginBottom:6}}>No games recorded yet.</p>}
        </div>
      ) : (
        <div style={S.list}>
          {filteredGames.map(g => {
            const res = getResult(g);
            const abs = allABs[g.id] || [];
            const s = calcGameStats(abs, false);
            return (
              <a key={g.id} href={pageToPath('game-detail', g.id)}
                onClick={e => { if (e.button === 0 && !e.metaKey && !e.ctrlKey) { e.preventDefault(); go(g.id); } }}
                style={{...S.listItem, cursor:'pointer', textDecoration:'none', display:'flex', alignItems:'center'}}>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{...S.listTitle, display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
                    <span>{g.teamName ? `${g.teamName} vs. ${g.opponent||'Unknown'}` : `vs. ${g.opponent||'Unknown'}`}</span>
                    {res && g.myScore!==undefined && g.myScore!=='' && g.oppScore!=='' && (
                      <span style={{background:res.color+'18', color:res.color, borderRadius:6, padding:'3px 8px', fontWeight:700, fontSize:12, flexShrink:0}}>
                        {res.label} {g.myScore}–{g.oppScore}
                      </span>
                    )}
                  </div>
                  <div style={S.listSub}>
                    {fmtDate(g.date)}{g.time ? ` · ${fmtTime(g.time)}` : ''}{g.park ? ` · ${g.park}` : ''}
                  </div>
                  {g.season && <div style={{...S.listSub, marginTop:2}}>{g.season}</div>}
                  {abs.length > 0 && <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{s.h}-for-{s.ab} · {calcAVG(s.h,s.ab)}{s.hr>0?` · ${s.hr} HR`:''}{s.rbi>0?` · ${s.rbi} RBI`:''}</div>}
                </div>
                <span style={{color:'var(--muted)', fontSize:16, flexShrink:0}}>›</span>
              </a>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── NEW GAME PAGE ─────────────────────────────────────────────────────────────
function NewGamePage({ uid, setPage, setGameId }) {
  const today = new Date().toISOString().split('T')[0];
  const [f, setF] = useState({ date:today, time:'', dayNight:'', park:'', homeAway:'', opponent:'', myScore:'', oppScore:'', teamName:'', league:'', tier:'', season:'', comments:'' });
  const [seasons, setSeasons] = useState([]);
  const [selectedSeasonId, setSelectedSeasonId] = useState('');
  const [saving, setSaving] = useState(false);
  const upd = (k, v) => setF(x => ({...x, [k]: v}));
  const seasonLocked = !!selectedSeasonId;

  useEffect(() => {
    seasonsCol(uid).orderBy('createdAt','desc').get().then(s => setSeasons(s.docs.map(d => ({id:d.id,...d.data()}))));
  }, [uid]);

  useEffect(() => {
    if (f.time) { const h = parseInt(f.time.split(':')[0]); upd('dayNight', (h >= 18 || h < 6) ? 'Night' : 'Day'); }
  }, [f.time]);

  const pickSeason = id => {
    setSelectedSeasonId(id);
    if (!id) {
      setF(x => ({...x, season:'', teamName:'', league:'', tier:'', seasonId:''}));
      return;
    }
    const s = seasons.find(s => s.id === id);
    if (s) setF(x => ({...x, season: s.name, teamName: s.teamName||'', league: s.league||'', tier: s.tier||'', seasonId: id}));
  };

  const save = async () => {
    setSaving(true);
    const ref = await gamesCol(uid).add({ ...f, dayOfWeek: getDayOfWeek(f.date), createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    setPage('game-detail', ref.id);
  };

  const lockedStyle = { ...S.input, opacity:0.55, cursor:'not-allowed', background:'var(--border2)' };

  return (
    <div className="page-content">
      <div style={S.pageHeader} className="page-header-row">
        <button onClick={() => setPage('games')} style={S.backBtn}>← Games</button>
        <h2 style={S.pageTitle}>New Game</h2>
      </div>

      <div style={S.card}>
        <div style={S.cardTitle}>Game Info</div>
        <div style={S.formGrid2} className="form-grid-2">
          <div style={S.formGroup}>
            <label style={S.label}>Date *</label>
            <input type="date" style={S.input} value={f.date} onChange={e => upd('date', e.target.value)}/>
            {f.date && <span style={S.hintGreen}>{getDayOfWeek(f.date)}</span>}
          </div>
          <div style={S.formGroup}>
            <label style={S.label}>Time</label>
            <input type="time" style={S.input} value={f.time} onChange={e => upd('time', e.target.value)}/>
          </div>
          <div style={S.formGroup}>
            <label style={S.label}>Day / Night</label>
            <select style={S.select} value={f.dayNight} onChange={e => upd('dayNight', e.target.value)}>
              <option value="">Select</option><option value="Day">Day</option><option value="Night">Night</option>
            </select>
            {f.time && <span style={S.hint}>Auto-detected from time</span>}
          </div>
          <div style={S.formGroup}>
            <label style={S.label}>Home / Away</label>
            <select style={S.select} value={f.homeAway} onChange={e => upd('homeAway', e.target.value)}>
              <option value="">Select</option><option value="Home">Home</option><option value="Away">Away</option>
            </select>
          </div>
          <div style={{...S.formGroup, gridColumn:'1/-1'}}>
            <label style={S.label}>Park / Location</label>
            <input style={S.input} value={f.park} onChange={e => upd('park', e.target.value)} placeholder="e.g. Christie Pits Diamond 1"/>
          </div>
          <div style={{...S.formGroup, gridColumn:'1/-1'}}>
            <label style={S.label}>Opponent</label>
            <input style={S.input} value={f.opponent} onChange={e => upd('opponent', e.target.value)} placeholder="Opponent team name"/>

          <div style={S.formGroup}>

          </div>
          <div style={S.formGroup}>
            <label style={S.label}>Opponent's Score</label>
            <input type="number" min="0" style={S.input} value={f.oppScore} onChange={e => upd('oppScore', e.target.value)} placeholder="–"/>

      </div>

      <div style={S.card}>

          <div style={{...S.formGroup, gridColumn:'1/-1'}}>

          </div>
          <div style={{...S.formGroup, gridColumn:'1/-1'}}>
            <label style={S.label}>Your Team Name</label>
            <input style={seasonLocked ? lockedStyle : S.input} readOnly={seasonLocked} value={f.teamName} onChange={e => !seasonLocked && upd('teamName', e.target.value)} placeholder="e.g. The Sluggers"/>

          <div style={S.formGroup}>

      <div style={S.card}>
        <div style={S.cardTitle}>Game Comments</div>
        <textarea style={{...S.input, height:90, resize:'vertical'}} value={f.comments} onChange={e => upd('comments', e.target.value)} placeholder="Field conditions, weather, notes about the game..."/>
      </div>
      <div style={{display:'flex', gap:10}}>
        <button onClick={save} disabled={!f.date || saving} style={S.btnPrimary}>{saving ? 'Creating...' : 'Create Game & Record ABs →'}</button>
        <button onClick={() => setPage('games')} style={S.btnSecondary}>Cancel</button>
      </div>
    </div>
  );
}

// ─── BAT DROPDOWN ──────────────────────────────────────────────────────────────
function BatDropdown({ bats, value, onChange }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const activeFavs = bats.filter(b => !b.archived && b.favourite);
  const activeRest = bats.filter(b => !b.archived && !b.favourite);
  const selected = bats.find(b => b.id === value);

  const batSubline = b => {
    const parts = [];
    if (b.weight) parts.push(`${b.weight} oz`);
    if (b.endloadWeight) parts.push(`${b.endloadWeight} oz endload`);
    return parts.join(' · ');
  };

  const BatOption = ({ bat }) => (
    <div onClick={() => { onChange(bat.id); setOpen(false); }}
      style={{padding:'10px 14px', cursor:'pointer', background: value===bat.id ? 'var(--border2)' : 'transparent', borderBottom:'1px solid var(--border2)'}}
      onMouseEnter={e => e.currentTarget.style.background='var(--border2)'}
      onMouseLeave={e => e.currentTarget.style.background = value===bat.id ? 'var(--border2)' : 'transparent'}>
      <div style={{fontSize:14, color:'var(--text)', fontWeight: bat.favourite ? 600 : 400}}>{bat.name}</div>
      {batSubline(bat) && <div style={{fontSize:12, color:'var(--muted)', marginTop:2}}>{batSubline(bat)}</div>}
    </div>
  );

  return (
    <div ref={ref} style={{position:'relative'}}>
      <div onClick={() => setOpen(o => !o)}
        style={{...S.select, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'space-between', minHeight:40}}>
        <div>
          {selected ? (
            <>
              <div style={{fontSize:14, color:'var(--text)', fontWeight: selected.favourite ? 600 : 400}}>{selected.name}</div>
              {batSubline(selected) && <div style={{fontSize:12, color:'var(--muted)'}}>{batSubline(selected)}</div>}
            </>
          ) : <span style={{color:'var(--muted)'}}>— Select bat —</span>}
        </div>
        <span style={{color:'var(--muted)', marginLeft:8, fontSize:12}}>{open ? '▲' : '▼'}</span>
      </div>
      {open && (
        <div style={{position:'absolute', top:'100%', left:0, right:0, background:'var(--surface)',
          border:'1px solid var(--border)', borderRadius:8, zIndex:200, maxHeight:240, overflowY:'auto',
          boxShadow:'0 4px 16px rgba(0,0,0,0.12)'}}>
          <div onClick={() => { onChange(''); setOpen(false); }}
            style={{padding:'10px 14px', cursor:'pointer', borderBottom:'1px solid var(--border2)', color:'var(--muted)', fontSize:14}}
            onMouseEnter={e => e.currentTarget.style.background='var(--border2)'}
            onMouseLeave={e => e.currentTarget.style.background='transparent'}>
            — Select bat —
          </div>
          {activeFavs.length > 0 && (
            <>
              <div style={{padding:'6px 14px 4px', fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.06em', background:'var(--surface2)', display:'flex', alignItems:'center', gap:6}}>
                <i className="fa-solid fa-star" style={{color:'#f59e0b', fontSize:10}}></i> Favourites
              </div>
              {activeFavs.map(b => <BatOption key={b.id} bat={b}/>)}
            </>
          )}
          {activeRest.length > 0 && (
            <>
              {activeFavs.length > 0 && <div style={{padding:'6px 14px 4px', fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.06em', background:'var(--surface2)'}}>All Bats</div>}
              {activeRest.map(b => <BatOption key={b.id} bat={b}/>)}
            </>
          )}
          {activeFavs.length === 0 && activeRest.length === 0 && (
            <div style={{padding:'12px 14px', color:'var(--muted)', fontSize:13}}>No bats registered yet.</div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── AB FORM ───────────────────────────────────────────────────────────────────
function ABForm({ uid, gameId, ab, bats, onSave, onCancel, defaultPosition='' }) {
  const isEdit = !!ab;
  const blank = { batId:'', outcome:'', subOutcome:'', bases:0, rbi:0, trajectory:'', spray:null, comments:'' };
  const [f, setF] = useState(isEdit ? {...blank, ...ab} : blank);
  const [dirty, setDirty] = useState(false);
  const [toast, setToast] = useState(null);
  const upd = (k, v) => { setF(x => ({...x, [k]: v})); setDirty(true); };

  const outcomeGroup = HIT_OUTCOMES.includes(f.outcome) ? 'hit' : OUT_OUTCOMES.includes(f.outcome) ? 'out' : OTHER_OUTCOMES.includes(f.outcome) ? 'other' : '';
  const isFoulOut = f.outcome === 'Foul Out';
  const isFoulCaught = isFoulOut && f.subOutcome === 'caught';
  const isFoulK = isFoulOut && f.subOutcome === 'strikeout';
  const showSpray = SPRAY_OUTCOMES.has(f.outcome) || isFoulCaught;
  const showBases = ['Reach on Error', "Fielder's Choice"].includes(f.outcome);
  const autoBase = HIT_BASES[f.outcome] || null;
  const showRBI = f.outcome && !['Strikeout'].includes(f.outcome) && !isFoulK && !(isFoulOut && !f.subOutcome);

  // Change outcome but preserve spray placement
  const setOutcome = (o) => {
    haptic('light');
    setF(x => ({...x, outcome: o, subOutcome:'', bases: HIT_BASES[o] || 0}));
    setDirty(true);
  };

  const handleCancel = () => {
    if (dirty && !isEdit) {
      if (!window.confirm('You have unsaved changes. Discard this at bat?')) return;
    }
    onCancel();
  };

  const save = async () => {
    const bat = bats.find(b => b.id === f.batId);
    const bases = autoBase || f.bases || 0;
    const data = {
      ...f, batName: bat?.name || '',
      bases,
      countAsAB: COUNTS_AS_AB.has(f.outcome),
      countAsHit: COUNTS_AS_HIT.has(f.outcome),
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (isEdit) await absCol(uid, gameId).doc(ab.id).update(data);
    else await absCol(uid, gameId).add(data);
    haptic('success');
    const toastMsg = f.outcome + (f.rbi > 0 ? `, ${f.rbi} RBI` : '');
    setToast(toastMsg);
    setTimeout(() => { setToast(null); onSave(); }, 1800);
  };

  // Outcome tile colours
  const tileStyle = (group, active) => {
    const base = { display:'flex', alignItems:'center', justifyContent:'center', padding:'11px 14px', borderRadius:8, border:'1.5px solid', cursor:'pointer', fontSize:14, fontWeight:500, transition:'all 0.1s', userSelect:'none', textAlign:'center' };
    if (active) {
      if (group==='hit')   return {...base, background:'#059669', borderColor:'#047857', color:'#fff'};
      if (group==='out')   return {...base, background:'#dc2626', borderColor:'#b91c1c', color:'#fff'};
      if (group==='other') return {...base, background:'#2563eb', borderColor:'#1d4ed8', color:'#fff'};
    }
    // Unselected — light tinted background
    if (group==='hit')   return {...base, background:'#d1fae5', borderColor:'#6ee7b7', color:'#065f46'};
    if (group==='out')   return {...base, background:'#fee2e2', borderColor:'#fca5a5', color:'#991b1b'};
    if (group==='other') return {...base, background:'#dbeafe', borderColor:'#93c5fd', color:'#1e40af'};
    return {...base, background:'var(--surface)', borderColor:'var(--border)', color:'var(--text)'};
  };

  const OTile = ({ label, group }) => {
    const active = f.outcome === label;
    return (
      <div style={tileStyle(group, active)} onClick={() => setOutcome(label)}>
        <span>{label}</span>
      </div>
    );
  };

  const TRAJECTORIES = ['Ground Ball','Line Drive','Fly Ball','Pop Up','Bunt'];

  if (toast) return (
    <div style={{...S.card, border:'1px solid var(--success)', background:'rgba(39,103,73,0.08)', textAlign:'center', padding:'24px 16px'}}>
      <div style={{fontSize:13, color:'var(--muted)', marginBottom:4}}>Saved</div>
      <div style={{fontSize:18, fontWeight:700, color:'var(--success)'}}>{toast}</div>
    </div>
  );

  return (
    <div style={{...S.card, border:'1px solid var(--border)'}}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
        <div style={S.cardTitle}>{isEdit ? 'Edit At Bat' : 'Record At Bat'}</div>
      </div>

      {/* Bat */}
      <div style={{...S.formGroup, marginBottom:16}}>
        <label style={S.label}>Bat Used</label>
        <BatDropdown bats={bats} value={f.batId} onChange={id => upd('batId', id)}/>
      </div>

      {/* Outcome tiles */}
      <div style={{marginBottom:16}}>
        <label style={{...S.label, display:'block', marginBottom:10}}>Outcome *</label>
        <div style={S.outGrp}>
          <div style={S.outGrpLabel}>Hits</div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
            {HIT_OUTCOMES.map(o => <OTile key={o} label={o} group="hit"/>)}
          </div>
        </div>
        <div style={S.outGrp}>
          <div style={S.outGrpLabel}>Outs</div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
            {OUT_OUTCOMES.map(o => <OTile key={o} label={o} group="out"/>)}
          </div>
        </div>
        <div style={S.outGrp}>
          <div style={S.outGrpLabel}>Other</div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
            {OTHER_OUTCOMES.map(o => <OTile key={o} label={o} group="other"/>)}
          </div>
        </div>
      </div>

      {/* Foul out sub-type */}
      {isFoulOut && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>Foul Out Type</label>
          <div style={S.outBtns}>
            <button style={{...S.outBtn, ...(f.subOutcome==='caught'?S.outBtnOut:{})}} onClick={() => { haptic('light'); upd('subOutcome','caught'); }}>Foul Caught (by fielder)</button>
            <button style={{...S.outBtn, ...(f.subOutcome==='strikeout'?S.outBtnOut:{})}} onClick={() => { haptic('light'); upd('subOutcome','strikeout'); }}>Foul Strikeout (not caught)</button>
          </div>
        </div>
      )}

      {/* Bases for ROE / FC */}
      {showBases && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>Bases Reached</label>
          <div style={S.outBtns}>{[1,2,3].map(n => <button key={n} style={{...S.outBtn, ...(f.bases===n?S.outBtnHit:{})}} onClick={() => upd('bases',n)}>{n}B</button>)}</div>
        </div>
      )}

      {/* Spray chart */}
      {showSpray && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={{...S.label, display:'block', marginBottom:8}}>Hit Location</label>
          <div style={{display:'flex', justifyContent:'center', background:'var(--spray-bg)', borderRadius:10, padding:12, border:'1px solid var(--border)'}}>
            <SprayChart onPlot={pt => upd('spray', {...pt, w:320, h:281})} plotted={f.spray} interactive={true} size={300}/>
          </div>
          {f.spray && <button onClick={() => upd('spray', null)} style={{...S.btnSmall, marginTop:6, fontSize:11}}>Clear placement</button>}
        </div>
      )}

      {/* Trajectory */}
      {f.outcome && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={{...S.label, display:'block', marginBottom:8}}>Trajectory</label>
          <div style={{display:'flex', flexWrap:'wrap', gap:8}}>
            {TRAJECTORIES.map(t => (
              <button key={t} onClick={() => upd('trajectory', f.trajectory===t ? '' : t)}
                style={{padding:'7px 14px', borderRadius:20, border:'1.5px solid', cursor:'pointer', fontSize:13, fontWeight:500, transition:'all 0.1s',
                  background: f.trajectory===t ? '#1e3a5f' : 'var(--surface)',
                  borderColor: f.trajectory===t ? '#1e3a5f' : 'var(--border)',
                  color: f.trajectory===t ? '#fff' : 'var(--text)'}}>
                {t}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* RBI stepper */}
      {showRBI && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>RBI</label>
          <div style={{display:'flex', alignItems:'center', gap:16, marginTop:4}}>
            <button onClick={() => upd('rbi', Math.max(0, f.rbi-1))}
              style={{width:36, height:36, borderRadius:8, border:'1.5px solid var(--border)', background:'var(--surface)', cursor:'pointer', fontSize:18, color:'var(--text)', display:'flex', alignItems:'center', justifyContent:'center'}}>
              <i className="fa-solid fa-minus" style={{fontSize:12}}></i>
            </button>
            <span style={{fontSize:20, fontWeight:700, minWidth:24, textAlign:'center', color:'var(--text)'}}>{f.rbi}</span>
            <button onClick={() => upd('rbi', Math.min(4, f.rbi+1))}
              style={{width:36, height:36, borderRadius:8, border:'1.5px solid var(--border)', background:'var(--surface)', cursor:'pointer', fontSize:18, color:'var(--text)', display:'flex', alignItems:'center', justifyContent:'center'}}>
              <i className="fa-solid fa-plus" style={{fontSize:12}}></i>
            </button>
          </div>
        </div>
      )}

      {/* Comments */}
      <div style={{...S.formGroup, marginBottom:16}}>
        <label style={S.label}>Comments</label>
        <textarea style={{...S.input, height:65, resize:'vertical'}} value={f.comments} onChange={e => upd('comments', e.target.value)} placeholder="Notes about this at bat..."/>
      </div>

      <div style={{display:'flex', gap:10}}>
        <button onClick={save} disabled={!f.outcome || (isFoulOut && !f.subOutcome)} style={S.btnPrimary}>
          {isEdit ? 'Save Changes' : 'Record AB'}
        </button>
        <button onClick={handleCancel} style={S.btnSecondary}>Cancel</button>
      </div>
      {isFoulOut && !f.subOutcome && <p style={{...S.hint, marginTop:8}}>Select foul out type to continue.</p>}
    </div>
  );
}
// ─── GAME DETAIL PAGE ──────────────────────────────────────────────────────────
function GameDetailPage({ uid, gameId, setPage, prevPage='games' }) {
  const [game, setGame] = useState(null);
  const [abs, setAbs] = useState([]);
  const [bats, setBats] = useState([]);
  const [profile, setProfile] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [editingGame, setEditingGame] = useState(false);
  const [gameForm, setGameForm] = useState(null);
  const [savingGame, setSavingGame] = useState(false);
  const [showHeatmap, setShowHeatmap] = useState(false);
  const [confirmAB, setConfirmAB] = useState(null);
  const [confirmGame, setConfirmGame] = useState(false);
  const [showFieldingForm, setShowFieldingForm] = useState(false);
  const [fieldingEntries, setFieldingEntries] = useState([]);
  const [fieldingForm, setFieldingForm] = useState({ position:'', putouts:0, assists:0, errors:0, notes:'' });
  const [editFieldingId, setEditFieldingId] = useState(null);

  const fieldingCol = () => gamesCol(uid).doc(gameId).collection('fielding');

  const loadFielding = () => fieldingCol().orderBy('createdAt','asc').get()
    .then(s => setFieldingEntries(s.docs.map(d=>({id:d.id,...d.data()}))));

  const saveFielding = async () => {
    const data = { ...fieldingForm, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (editFieldingId) {
      await fieldingCol().doc(editFieldingId).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await fieldingCol().add(data);
    }
    setShowFieldingForm(false);
    setEditFieldingId(null);
    setFieldingForm({ position:'', putouts:0, assists:0, errors:0, notes:'' });
    loadFielding();
  };

  const deleteFielding = async id => {
    await fieldingCol().doc(id).delete(); loadFielding();
  };

  const startEditFielding = entry => {
    setFieldingForm({ position: entry.position||'', putouts: entry.putouts||0, assists: entry.assists||0, errors: entry.errors||0, notes: entry.notes||'' });
    setEditFieldingId(entry.id);
    setShowFieldingForm(true);
  };

  const loadGame = () => gamesCol(uid).doc(gameId).get().then(d => {
    const g = {id:d.id,...d.data()};
    setGame(g);
    setGameForm(g);
  });
  const loadABs = () => absCol(uid,gameId).orderBy('timestamp','asc').get().then(s => { setAbs(s.docs.map(d=>({id:d.id,...d.data()}))); setLoading(false); });

  useEffect(() => {
    loadGame(); loadABs(); loadFielding();
    batsCol(uid).get().then(s => setBats(s.docs.map(d=>({id:d.id,...d.data()}))));
    userDoc(uid).get().then(d => { if (d.exists && d.data().profile) setProfile(d.data().profile); });
  }, [uid, gameId]);

  const delAB = async id => {
    await absCol(uid, gameId).doc(id).delete(); setConfirmAB(null); loadABs();
  };

  const delGame = async () => {
    // Delete all ABs first
    const snap = await absCol(uid, gameId).get();
    await Promise.all(snap.docs.map(d => d.ref.delete()));
    await gamesCol(uid).doc(gameId).delete();
    setPage('games');
  };

  const saveGame = async () => {
    setSavingGame(true);
    await gamesCol(uid).doc(gameId).update({...gameForm, dayOfWeek: getDayOfWeek(gameForm.date)});
    setSavingGame(false);
    setEditingGame(false);
    loadGame();
  };

  const updGame = (k,v) => setGameForm(f=>({...f,[k]:v}));

  const stats = calcGameStats(abs, profile.includeKFoulInK);
  const res = game ? getResult(game) : null;
  const fldPct = stats.po+stats.ast+stats.err > 0 ? ((stats.po+stats.ast)/(stats.po+stats.ast+stats.err)).toFixed(3).replace('0.','.') : '—';
  const sprayHits = abs.filter(ab => ab.spray);
  const handedness = profile.bats || 'R';

  // Hit direction breakdown
  const dirCounts = {Pull:0, Center:0, Oppo:0};
  sprayHits.filter(ab => COUNTS_AS_HIT.has(ab.outcome)).forEach(ab => {
    const d = getHitDirection(ab.spray, handedness);
    if (d) dirCounts[d]++;
  });
  const dirTotal = dirCounts.Pull + dirCounts.Center + dirCounts.Oppo;

  if (!game) return <div className="page-content"><p style={S.muted}>Loading game...</p></div>;

  return (
    <div className="page-content">
      {confirmAB && <ConfirmModal message="Delete this at bat?" onConfirm={()=>delAB(confirmAB)} onCancel={()=>setConfirmAB(null)}/>}
      {confirmGame && <ConfirmModal message="Delete this game? All recorded ABs will also be deleted." onConfirm={delGame} onCancel={()=>setConfirmGame(false)}/>}

      <div style={S.pageHeader} className="page-header-row">
        <button onClick={() => setPage(prevPage)} style={S.backBtn}>← {prevPage === 'gamelog' ? 'Game Log' : prevPage === 'stats' ? 'Stats' : 'Games'}</button>
        <div style={{display:'flex', gap:8}}>
          {!editingGame && <button onClick={()=>setEditingGame(true)} style={S.btnSmall}>Edit Game</button>}
          {!editingGame && <button onClick={()=>{setShowFieldingForm(true);setEditFieldingId(null);setFieldingForm({position:'',putouts:0,assists:0,errors:0,notes:''}); }} style={S.btnSmall}>+ Fielding</button>}
          {!editingGame && abs.length>0 && <button onClick={()=>generateGamePDF(game,abs,profile)} style={S.btnSmall}>↓ PDF</button>}
          <button onClick={()=>setConfirmGame(true)} style={S.btnDanger}>Delete Game</button>
        </div>
      </div>

      {/* Edit game form */}
      {editingGame && gameForm && (
        <div style={S.card}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
            <div style={S.cardTitle}>Edit Game Info</div>
            <button onClick={()=>setEditingGame(false)} style={S.btnSmall}>Cancel</button>
          </div>
          <div style={S.formGrid2} className="form-grid-2">
            <div style={S.formGroup}>
              <label style={S.label}>Date *</label>
              <input type="date" style={S.input} value={gameForm.date||''} onChange={e=>updGame('date',e.target.value)}/>
              {gameForm.date && <span style={S.hintGreen}>{getDayOfWeek(gameForm.date)}</span>}
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Time</label>
              <input type="time" style={S.input} value={gameForm.time||''} onChange={e=>updGame('time',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Day / Night</label>
              <select style={S.select} value={gameForm.dayNight||''} onChange={e=>updGame('dayNight',e.target.value)}>
                <option value="">Select</option><option value="Day">Day</option><option value="Night">Night</option>
              </select>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Home / Away</label>
              <select style={S.select} value={gameForm.homeAway||''} onChange={e=>updGame('homeAway',e.target.value)}>
                <option value="">Select</option><option value="Home">Home</option><option value="Away">Away</option>
              </select>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Opponent</label>
              <input style={S.input} value={gameForm.opponent||''} onChange={e=>updGame('opponent',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Park / Location</label>
              <input style={S.input} value={gameForm.park||''} onChange={e=>updGame('park',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>My Score</label>
              <input type="number" min="0" style={S.input} value={gameForm.myScore||''} onChange={e=>updGame('myScore',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Opponent Score</label>
              <input type="number" min="0" style={S.input} value={gameForm.oppScore||''} onChange={e=>updGame('oppScore',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Season Name</label>
              <input style={S.input} value={gameForm.season||''} onChange={e=>updGame('season',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Team Name</label>
              <input style={S.input} value={gameForm.teamName||''} onChange={e=>updGame('teamName',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>League</label>
              <input style={S.input} value={gameForm.league||''} onChange={e=>updGame('league',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Tier / Division</label>
              <input style={S.input} value={gameForm.tier||''} onChange={e=>updGame('tier',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Comments</label>
              <textarea style={{...S.input,height:80,resize:'vertical'}} value={gameForm.comments||''} onChange={e=>updGame('comments',e.target.value)}/>
            </div>
          </div>
          <div style={{display:'flex', gap:10, marginTop:14}}>
            <button onClick={saveGame} disabled={savingGame} style={S.btnPrimary}>{savingGame?'Saving...':'Save Changes'}</button>
            <button onClick={()=>setEditingGame(false)} style={S.btnSecondary}>Cancel</button>
          </div>
        </div>
      )}

      {/* Game header card */}
      {!editingGame && (
        <div style={S.card}>
          {/* Line 1: Team vs Opponent + result pill */}
          <div style={{display:'flex', alignItems:'baseline', gap:12, marginBottom:3}}>
            <div style={{flex:1, minWidth:0}}>
              <span style={{fontSize:18, fontWeight:700, color:'var(--text)', lineHeight:1.3}}>
                {game.teamName ? `${game.teamName} vs. ${game.opponent||'Unknown'}` : `vs. ${game.opponent||'Unknown'}`}
              </span>
              {res && game.myScore !== undefined && game.myScore !== '' && game.oppScore !== '' && (
                <span style={{background:res.color+'18', color:res.color, borderRadius:6, padding:'4px 10px', fontWeight:700, fontSize:14, marginLeft:10, flexShrink:0}}>
                  {res.label} {game.myScore}–{game.oppScore}
                </span>
              )}
            </div>
          </div>
          {/* Line 2: Date · Time · Day/Night · Park · Home/Away */}
          <div style={{...S.listSub, marginBottom: (game.league || game.season) ? 10 : 0}}>
            {fmtDate(game.date)}{game.time ? ` · ${fmtTime(game.time)}` : ''}{game.dayNight ? ` · ${game.dayNight}` : ''}{game.park ? ` · ${game.park}` : ''}{game.homeAway ? ` · ${game.homeAway}` : ''}
          </div>
          {/* Line 3: League · Tier [gap] Season */}
          {(game.league || game.season) && (
            <div style={{display:'flex', flexWrap:'wrap', gap:'4px 16px', fontSize:13, marginTop:8}}>
              {game.league && <span style={{color:'var(--label)'}}>{game.league}{game.tier && ` · ${game.tier}`}</span>}
              {game.season && <span style={{color:'var(--label)'}}>{game.season}</span>}
            </div>
          )}
          {game.comments && <p style={{...S.muted, marginTop:12, fontStyle:'italic', borderTop:'1px solid var(--border)', paddingTop:10}}>{game.comments}</p>}
        </div>
      )}

      {/* Stats */}
      {abs.length > 0 && (
        <div style={S.card}>
          <div style={S.cardTitle}>Game Stats</div>
          <div style={S.statsGrid} className="stats-grid-5">
            {[['PA',stats.pa],['AB',stats.ab],['H',stats.h],['R',stats.r],['RBI',stats.rbi],
              ['2B',stats.doubles],['3B',stats.triples],['HR',stats.hr],['BB',stats.bb],['K',stats.kTotal]].map(([l,v]) => (
              <div key={l} style={S.statCell}><div style={S.statLabel}>{l}</div><div style={S.statVal}>{v}</div></div>
            ))}
          </div>
          <div style={{...S.statsGrid, marginTop:8, gridTemplateColumns:'repeat(3,1fr)'}}>
            {[['AVG',calcAVG(stats.h,stats.ab)],['OBP',calcOBP(stats.h,stats.bb,stats.hbp,stats.sf,stats.ab)],['SLG',calcSLG(stats.tb,stats.ab)]].map(([l,v]) => (
              <div key={l} style={S.statCell}><div style={S.statLabel}>{l}</div><div style={{...S.statVal, color:'#276749'}}>{v}</div></div>
            ))}
          </div>
          {(stats.po+stats.ast+stats.err > 0) && (
            <div style={{marginTop:12, paddingTop:12, borderTop:'1px solid #e2e8f0'}}>
              <div style={{...S.label, marginBottom:8, display:'block'}}>Fielding</div>
              <div style={{display:'flex', gap:16, fontSize:13}}>
                <span style={S.muted}>PO: <span style={{color:'#1a202c',fontWeight:600}}>{stats.po}</span></span>
                <span style={S.muted}>A: <span style={{color:'#1a202c',fontWeight:600}}>{stats.ast}</span></span>
                <span style={S.muted}>E: <span style={{color:'#1a202c',fontWeight:600}}>{stats.err}</span></span>
                <span style={S.muted}>FLD%: <span style={{color:'#1a202c',fontWeight:600}}>{fldPct}</span></span>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Spray chart + heatmap */}
      {sprayHits.length > 0 && (
        <div style={S.card}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12}}>
            <div style={S.cardTitle}>Spray Chart — This Game</div>
            <div style={{display:'flex', gap:4}}>
              {[['Spray', 'spray'],['Heat', 'heat'],['Zones', 'zones']].map(([label, val]) => (
                <button key={val} onClick={()=>setShowHeatmap(val)}
                  style={{...S.btnSmall,...(showHeatmap===val?{background:'var(--primary)',color:'var(--primary-text)',borderColor:'var(--primary)',fontWeight:700}:{})}}>{label}</button>
              ))}
            </div>
          </div>
          <div style={{display:'flex', justifyContent:'center', background:'var(--spray-bg)', borderRadius:10, padding:12}}>
            <SprayChart interactive={false} hits={sprayHits} size={300} showHeatmap={showHeatmap==='heat'} showZones={showHeatmap==='zones'} handedness={handedness}/>
          </div>
          <p style={{...S.hint, marginTop:8, textAlign:'center'}}>
            {sprayHits.length} charted {sprayHits.length===1?'ball':'balls'} · <span style={{color:'#276749'}}>●</span> Hit · <span style={{color:'#c53030'}}>●</span> Out/Other
          </p>
          {dirTotal > 0 && (
            <div style={{marginTop:14, paddingTop:12, borderTop:'1px solid #edf2f7'}}>
              <div style={{...S.cardTitle, marginBottom:10}}>Hit Direction (hits only)</div>
              {['Pull','Center','Oppo'].map(dir => {
                const pct = dirTotal > 0 ? Math.round(dirCounts[dir]/dirTotal*100) : 0;
                return (
                  <div key={dir} style={{marginBottom:8}}>
                    <div style={{display:'flex', justifyContent:'space-between', fontSize:12, marginBottom:3}}>
                      <span style={{color:'#4a5568', fontWeight:600}}>{dir}</span>
                      <span style={{color:'#718096'}}>{dirCounts[dir]} ({pct}%)</span>
                    </div>
                    <div style={{height:8, background:'#edf2f7', borderRadius:4, overflow:'hidden'}}>
                      <div style={{height:'100%', width:`${pct}%`, background:'#1e3a5f', borderRadius:4}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* At Bats */}
      <div style={S.card}>
        <div style={{...S.pageHeader, marginBottom:14}}>
          <div style={S.sectionTitle}>At Bats {abs.length > 0 && <span style={{color:'var(--label)', fontSize:14, fontWeight:400}}>({abs.length})</span>}</div>
          {!showForm && !editId && (
            <div style={{display:'flex', gap:6}}>
              <button onClick={()=>setShowForm(true)} style={S.btnSmall}>+ Record AB</button>
            </div>
          )}
        </div>

        {showForm && (
          <ABForm uid={uid} gameId={gameId} bats={bats}
            defaultPosition={profile.primaryPosition||''}
            onSave={() => { setShowForm(false); loadABs(); }}
            onCancel={() => setShowForm(false)}/>
        )}

        {loading ? <p style={S.muted}>Loading...</p> : abs.length === 0 && !showForm ? (
          <div style={{...S.empty, padding:'28px 0'}}>
            <p>No at bats recorded yet.</p>
            <button onClick={() => setShowForm(true)} style={{...S.btnPrimary, marginTop:12}}>+ Record First AB</button>
          </div>
        ) : (
          <div style={S.list}>
            {abs.map((ab, i) => {
              const color = abOutcomeColor(ab);
              if (editId === ab.id) return (
                <ABForm key={ab.id} uid={uid} gameId={gameId} bats={bats} ab={ab}
                  onSave={() => { setEditId(null); loadABs(); }}
                  onCancel={() => setEditId(null)}/>
              );
              const label = ab.outcome + (ab.outcome === 'Foul Out' ? (ab.subOutcome === 'caught' ? ' (caught)' : ab.subOutcome === 'strikeout' ? ' (K)' : '') : '');
              const dir = ab.spray && COUNTS_AS_HIT.has(ab.outcome) ? getHitDirection(ab.spray, handedness) : null;
              const moveAB = async (fromIdx, toIdx) => {
                if (toIdx < 0 || toIdx >= abs.length) return;
                // Swap timestamps to reorder
                const a = abs[fromIdx], b = abs[toIdx];
                const tsA = a.timestamp, tsB = b.timestamp;
                await Promise.all([
                  absCol(uid, gameId).doc(a.id).update({timestamp: tsB}),
                  absCol(uid, gameId).doc(b.id).update({timestamp: tsA}),
                ]);
                loadABs();
              };
              return (
                <div key={ab.id} style={S.listItem}>
                  <div style={{display:'flex', flexDirection:'column', gap:2, flexShrink:0, marginRight:4}}>
                    <button onClick={() => moveAB(i, i-1)} disabled={i===0} style={{background:'none', border:'none', cursor:'pointer', color:'var(--muted)', fontSize:12, padding:'1px 4px', lineHeight:1}}>▲</button>
                    <div style={{width:24, height:24, borderRadius:7, background:color+'18', color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700}}>{i+1}</div>
                    <button onClick={() => moveAB(i, i+1)} disabled={i===abs.length-1} style={{background:'none', border:'none', cursor:'pointer', color:'var(--muted)', fontSize:12, padding:'1px 4px', lineHeight:1}}>▼</button>
                  </div>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap'}}>
                      <span style={{fontWeight:600, color, fontSize:13}}>{label}</span>
                      {ab.rbi > 0 && <span style={S.badge}>{ab.rbi} RBI</span>}
                      {ab.runScored && <span style={S.badge}>R</span>}
                      {dir && <span style={{...S.badge, color:'var(--primary)'}}>{dir}</span>}
                      {ab.spray && <span style={{...S.badge, color:'var(--success)'}}>📍</span>}
                    </div>
                    <div style={S.listSub}>
                      {[ab.batName, ab.position, (ab.putouts>0||ab.assists>0||ab.errors>0) && `${ab.putouts}PO ${ab.assists}A ${ab.errors}E`].filter(Boolean).join(' · ')}
                    </div>
                    {ab.comments && <div style={{...S.hint, marginTop:3, fontStyle:'italic'}}>"{ab.comments}"</div>}
                  </div>
                  <div style={{display:'flex', gap:6, flexShrink:0}}>
                    <button onClick={() => setEditId(ab.id)} style={S.btnSmall}>Edit</button>
                    <button onClick={() => setConfirmAB(ab.id)} style={S.btnDanger}>Del</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ── Fielding Section ── */}
      {showFieldingForm && (
        <div style={{...S.card, border:'1px solid var(--border)', marginTop:16}}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
            <div style={S.cardTitle}>{editFieldingId ? 'Edit Fielding' : 'Record Fielding'}</div>
            <button onClick={()=>{setShowFieldingForm(false);setEditFieldingId(null);}} style={S.btnSmall}>Cancel</button>
          </div>
          <div style={{...S.formGroup, marginBottom:14}}>
            <label style={S.label}>Position *</label>
            <select style={S.select} value={fieldingForm.position} onChange={e=>setFieldingForm(f=>({...f,position:e.target.value}))}>
              <option value="">— Select position —</option>
              {['P','C','1B','2B','3B','SS','LF','CF','RF','DH','EH','UTIL'].map(p=>(
                <option key={p} value={p}>{p}</option>
              ))}
            </select>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12, marginBottom:14}}>
            {[['putouts','Putouts'],['assists','Assists'],['errors','Errors']].map(([key,lbl])=>(
              <div key={key}>
                <label style={{...S.label, display:'block', marginBottom:6}}>{lbl}</label>
                <div style={{display:'flex', alignItems:'center', gap:8}}>
                  <button onClick={()=>setFieldingForm(f=>({...f,[key]:Math.max(0,f[key]-1)}))}
                    style={{width:32,height:32,borderRadius:6,border:'1.5px solid var(--border)',background:'var(--surface)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <i className="fa-solid fa-minus" style={{fontSize:10,color:'var(--text)'}}></i>
                  </button>

  const [editing, setEditing] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const blank = { name:'', teamName:'', league:'', tier:'', notes:'' };
  const [form, setForm] = useState(blank);
  const upd = (k,v) => setForm(f=>({...f,[k]:v}));

  const load = async () => {
    const [seasSnap, gamesSnap] = await Promise.all([
      seasonsCol(uid).orderBy('createdAt','desc').get(),
      gamesCol(uid).get()
    ]);
    setSeasons(seasSnap.docs.map(d=>({id:d.id,...d.data()})));
    setGames(gamesSnap.docs.map(d=>({id:d.id,...d.data()})));
    setLoading(false);
  };

  useEffect(() => { load(); }, [uid]);

  const startNew  = () => { setForm(blank); setEditing('new'); };
  const startEdit = s  => { setForm({name:s.name||'',teamName:s.teamName||'',league:s.league||'',tier:s.tier||'',notes:s.notes||''}); setEditing(s.id); };

  const save = async () => {
    const data = { ...form, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (editing === 'new') {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await seasonsCol(uid).add(data);
    } else {
      const oldDoc = seasons.find(s => s.id === editing);
      await seasonsCol(uid).doc(editing).update(data);
      // Propagate changes to all games that reference this season
      // Match by seasonId (preferred) or by old season name string (legacy)
      if (oldDoc) {
        const gSnap = await gamesCol(uid).get();
        const toUpdate = gSnap.docs.filter(d => {
          const g = d.data();
          return g.seasonId === editing || g.season === oldDoc.name;
        });
        await Promise.all(toUpdate.map(d => d.ref.update({
          seasonId: editing,
          season: form.name,
          teamName: form.teamName || d.data().teamName,
          league: form.league || d.data().league,
          tier: form.tier || d.data().tier,
        })));
      }
    }
    setEditing(null); load();
  };

  const del = async id => {
    await seasonsCol(uid).doc(id).delete(); setConfirmDel(null); load();
  };

  if (editing !== null) return (
    <div className="page-content">
      <div style={S.pageHeader} className="page-header-row">

        <div style={S.formGrid2} className="form-grid-2">
          <div style={{...S.formGroup, gridColumn:'1/-1'}}>
