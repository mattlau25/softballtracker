  --surface2:     #f7fafc;
  --border:       #e2e8f0;
  --border2:      #edf2f7;
  --text:         #1a202c;
  --text2:        #2d3748;
  --muted:        #718096;
  --label:        #4a5568;
  --nav-bg:       #ffffff;
  --nav-text:     #4a5568;
  --nav-active:   #1e3a5f;
  --nav-border:   #e2e8f0;
  --primary:      #1e3a5f;
  --primary-text: #ffffff;
  --success:      #276749;
  --danger:       #c53030;
  --blue:         #2b6cb0;
  --card-shadow:  0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
  --spray-foul:   #e8ede8;
  --spray-out:    #d4e6d4;
  --spray-dirt:   #e8d5b0;
  --spray-mound:  #dcc89a;
  --spray-path:   #c4a882;
  --spray-line:   #9ab89a;

  --nav-w:    224px;
  --page-max: 1080px;
  --page-px:  40px;
  --page-py:  32px;

/* ── Dark theme ── */
[data-theme="dark"] {
  --bg:           #0d1117;
  --surface:      #111827;
  --surface2:     #0d1117;
  --border:       #1f2937;
  --border2:      #1a2030;
  --text:         #e2e8f0;
  --text2:        #94a3b8;
  --muted:        #64748b;
  --label:        #94a3b8;
  --nav-bg:       #111d2e;
  --nav-text:     rgba(255,255,255,0.8);
  --nav-active:   #ffffff;
  --nav-border:   rgba(255,255,255,0.1);  --primary:      #4ade80;
  --primary-text: #0d1117;
  --success:      #4ade80;
  --danger:       #f87171;
  --blue:         #60a5fa;
  --card-shadow:  none;
  --spray-foul:   #111827;
  --spray-out:    #14401a;
  --spray-dirt:   #3d2b1f;
  --spray-mound:  #4a3528;

  --spray-line:   #4a6a4a;
  --spray-fence:  #4ade80;
  --spray-label:  #4a6a4a;
  --spray-tap:    #3d5a3d;
  --spray-plot:   #4ade80;
  --spray-bg:     #ffffff;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── Game Detail desktop layout (≥1280px) ── */
.game-detail-content { max-width: 1440px !important; }
@media (min-width: 1280px) {
  .game-detail-split {
    display: grid;
    grid-template-columns: 55fr 45fr;
    column-gap: 32px;
    align-items: start;
    margin-top: 32px;
  }
  /* .gd-left holds At Bats + Fielding stacked tightly. Spray Chart is its own
     column — independent heights, no shared-row stretch. */
  .gd-left {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .gd-atbats, .gd-fielding, .gd-spray { margin-top: 0 !important; }
}

/* ── Forms ── */
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator { filter: none; }
[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator,
[data-theme="dark"] input[type=time]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
button:disabled { opacity: 0.45; cursor: not-allowed; }

/* ── Select chevron — unified across all selects (matches FA fa-chevron-down) ── */
select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23718096'><path d='M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 12px 12px;
}
[data-theme="dark"] select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%2394a3b8'><path d='M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z'/></svg>");
}

/* ── Dark mode nav overrides ── */
[data-theme="dark"] .nav-sidebar { box-shadow: none; border-right-color: rgba(255,255,255,0.08); }
[data-theme="dark"] .nav-brand-text { color: #fff; }
[data-theme="dark"] .nav-item { color: rgba(255,255,255,0.8); }
[data-theme="dark"] .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
[data-theme="dark"] .nav-item-active { color: #fff !important; background: rgba(255,255,255,0.12) !important; }
[data-theme="dark"] .nav-user { color: rgba(255,255,255,0.5); border-top-color: rgba(255,255,255,0.1); }

/* ── Tables dark mode ── */
[data-theme="dark"] table td { border-color: #1f2937 !important; }
[data-theme="dark"] table th { background: #0d1117 !important; color: #64748b !important; border-color: #1f2937 !important; }

/* ── Nav ── */
.nav-sidebar {
  width: var(--nav-w);
  min-height: 100vh;
  background: var(--nav-bg);
  border-right: 1px solid var(--nav-border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  z-index: 100;
  box-shadow: 1px 0 4px rgba(0,0,0,0.04);
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 20px;
  border-bottom: 1px solid var(--nav-border);
  flex-shrink: 0;
}
.nav-brand-text {
  font-size: 15px;
  font-weight: 700;
  color: #1e3a5f;
  letter-spacing: -0.01em;
}
.nav-items {
  flex: 1;
  padding: 8px 0;
  overflow-y: auto;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: calc(100% - 16px);
  padding: 12px 16px;
  margin: 0 8px;
  background: none;
  border: none;
  border-radius: 8px;
  color: var(--nav-text);
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  text-align: left;
  transition: background 0.12s, color 0.12s;
  line-height: 1.4;
}
.nav-item:hover { background: #f0f4ff; color: #1e3a5f; }
.nav-item-active { color: #1e3a5f !important; background: #eef2ff !important; font-weight: 600; }
.nav-divider { height: 1px; background: var(--nav-border); margin: 8px 16px; }

/* ── Mobile More bottom sheet ── */
.more-sheet-wrap {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.more-sheet-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.45);
  animation: more-fade-in 0.16s ease-out;
}
.more-sheet {
  position: relative;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 32px rgba(0,0,0,0.18);
  animation: more-slide-up 0.2s ease-out;
}
.more-sheet-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 4px;
  margin: 8px auto 16px;
  cursor: pointer;
}
.more-sheet-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 0 0 8px;
  padding-left: 4px;
}
.more-sheet-item {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 8px;
  color: var(--text);
  font-size: 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.more-sheet-item:last-of-type { border-bottom: none; }
.more-sheet-item:active { background: var(--surface2); }
.more-sheet-item-active { color: var(--primary); font-weight: 600; }
@keyframes more-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes more-slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
[data-theme="dark"] .more-sheet-backdrop { background: rgba(0,0,0,0.6); }
[data-theme="dark"] .more-sheet { background: var(--surface); }
.nav-user {
  padding: 12px 20px;
  border-top: 1px solid var(--nav-border);
  font-size: 12px;
  color: #718096;
  flex-shrink: 0;
}

/* ── Main wrap ── */
.main-wrap {
  margin-left: var(--nav-w);
  min-height: 100vh;
  background: var(--bg);
  width: calc(100% - var(--nav-w));
  display: flex;
  flex-direction: column;
}
.page-content {
  padding: var(--page-py) var(--page-px);
  max-width: var(--page-max);
  margin: 0 auto;
  width: 100%;
  min-width: 0;
}

/* ── Tablet ── */
@media (max-width: 1024px) {
  :root {
    --nav-w: 200px;
    --page-px: 24px;
    --page-py: 24px;
  }
}

/* ── Mobile ── */
@media (max-width: 640px) {
  :root {
    --page-px: 16px;
    --page-py: 16px;
  }
  .nav-sidebar {
    width: 100% !important;
    min-height: auto !important;
    top: auto !important;
    bottom: 0 !important;
    flex-direction: row !important;
    border-top: 1px solid var(--nav-border) !important;
    border-right: none !important;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
  }
  .nav-brand { display: none !important; }
  .nav-user  { display: none !important; }
  .nav-items {
    display: flex !important;
    flex-direction: row !important;
    padding: 0 !important;
    overflow: visible !important;
    width: 100%;
  }
  .nav-item {
    flex-direction: column !important;
    padding: 4px 4px env(safe-area-inset-bottom, 4px) !important;
    font-size: 10px !important;
    line-height: 1 !important;
    gap: 4px !important;
    margin: 0 !important;
    width: auto !important;
    border-radius: 0 !important;
    border-top: 2px solid transparent !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 1 !important;
    min-width: 0 !important;
    font-weight: 400 !important;
    white-space: nowrap;
    overflow: hidden;
  }
  .nav-item-active {
    border-top-color: #1e3a5f !important;
    font-weight: 600 !important;
    color: #1e3a5f !important;
    background: #f0f4ff !important;
  }
  /* Hide divider in mobile bottom bar */
  .nav-sidebar .nav-divider { display: none !important; }
  /* Hide v4.7 footer on mobile bottom bar */
  .nav-sidebar .nav-footer { display: none !important; }
  .main-wrap {
    margin-left: 0 !important;
    width: 100% !important;
    padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)) !important;
  }
  /* Status bar: handled by a single sticky #ios-status-cover bar injected as the first
     child of <body> (see script near end of file). On this device env(safe-area-inset-top)
     reports 0 in BOTH the standalone app and Safari, and content renders under the status
     bar in both — so a sticky bar (which BOTH reserves 47px of space AND paints the strip,
     as one in-flow element) is the only thing that can't double-count. */
  /* Bigger nav-item icons on mobile bottom bar — Apollo-style ~24px instead of desktop's 16px */
  .nav-sidebar .nav-item > span:first-child {
    width: 24px !important;
    height: 24px !important;
  }
  .nav-sidebar .nav-item > span:first-child > svg {
    width: 24px !important;
    height: 24px !important;
  }
  /* Show profile icon on Games page mobile */
  .mobile-profile-btn { display: flex !important; align-items: center !important; }
  /* Collapse 2-col grids */
  .form-grid-2 { grid-template-columns: 1fr !important; }
  .stats-grid-5 { grid-template-columns: repeat(3, 1fr) !important; }
  .compare-grid { grid-template-columns: 1fr !important; }
  .page-header-row { flex-wrap: wrap !important; gap: 12px !important; }
}

/* Profile nav item — desktop only in sidebar, hidden on mobile bottom bar */
.nav-profile-desktop {
  display: flex;
}
@media (max-width: 640px) {
  .nav-profile-desktop { display: none !important; }
}

// ─── HIT DIRECTION ─────────────────────────────────────────────────────────────
// Returns 'Pull' | 'Center' | 'Oppo' based on spray x position and handedness
function getHitDirection(spray, handedness) {
  if (!spray) return null;
  const W = spray.w || 320;
  const nx = spray.x / W; // 0 = left field, 1 = right field
  // For right-handed batter: pull = left field (nx < 0.4), oppo = right field (nx > 0.6)
  // For left-handed batter: pull = right field (nx > 0.6), oppo = left field (nx < 0.4)
  if (handedness === 'L') {
    if (nx > 0.62) return 'Pull';
    if (nx < 0.38) return 'Oppo';
    return 'Center';
  } else {
    if (nx < 0.38) return 'Pull';
    if (nx > 0.62) return 'Oppo';
    return 'Center';
  }
}

const fmt3 = n => isNaN(n) || !isFinite(n) ? '.000' : '.' + Math.round(n * 1000).toString().padStart(3,'0');
const calcAVG = (h, ab)      => ab === 0 ? '.---' : fmt3(h / ab);
const calcOBP = (h, bb, hbp, sf, ab) => { const d = ab + bb + hbp + sf; return d === 0 ? '.---' : fmt3((h + bb + hbp) / d); };
const calcSLG = (tb, ab)     => ab === 0 ? '.---' : fmt3(tb / ab);
const calcOPS = (obp, slg)   => { if (obp === '.---' || slg === '.---') return '.---'; const v = parseFloat('0' + obp) + parseFloat('0' + slg); return fmt3(v); };

function getDayOfWeek(ds) { if (!ds) return ''; return DAYS[new Date(ds + 'T12:00:00').getDay()]; }
function fmtDate(ds) {
  if (!ds) return '';
  const d = new Date(ds + 'T12:00:00');
  return d.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,'0')}${ampm}`;
}
function getResult(g) {
  // Manual result override takes priority
  if (g.result === 'W') return { label:'W', color:'#276749' };
  if (g.result === 'L') return { label:'L', color:'#c53030' };
  if (g.result === 'T') return { label:'T', color:'#b7791f' };
  // Auto from scores
  const ms = parseInt(g.myScore), os = parseInt(g.oppScore);
  if (isNaN(ms) || isNaN(os)) return null;
  if (ms > os) return { label:'W', color:'#276749' };
  if (ms < os) return { label:'L', color:'#c53030' };
  return { label:'T', color:'#b7791f' };
}
function abOutcomeColor(ab) {
  if (COUNTS_AS_HIT.has(ab.outcome)) return '#276749';
  if (OUT_OUTCOMES.includes(ab.outcome)) return '#c53030';
  if (OTHER_OUTCOMES.includes(ab.outcome)) return '#2e6db4';
  return '#a0aec0';
}
function calcGameStats(abs, includeKFoulInK) {
  return abs.reduce((a, ab) => {
    a.pa++;
    if (COUNTS_AS_AB.has(ab.outcome)) a.ab++;
    if (COUNTS_AS_HIT.has(ab.outcome)) { a.h++; a.tb += (ab.bases || HIT_BASES[ab.outcome] || 0); }
    if (ab.rbi) a.rbi += ab.rbi;
    if (ab.runScored) a.r++;
    if (ab.outcome === 'Walk') a.bb++;
    if (ab.outcome === 'Hit by Pitch') a.hbp++;
    if (ab.outcome === 'Sac Fly') a.sf++;
    if (ab.outcome === 'Strikeout') a.k++;
    if (ab.outcome === 'Foul Out' && ab.subOutcome === 'strikeout') a.foulK++;
    a.po += (ab.putouts || 0); a.ast += (ab.assists || 0); a.err += (ab.errors || 0);
    if (ab.outcome === 'Double') a.doubles++;
    if (ab.outcome === 'Triple') a.triples++;
    if (ab.outcome === 'Home Run') a.hr++;
    const totalK = a.k + (includeKFoulInK ? a.foulK : 0);
    a.kTotal = totalK;
    return a;
  }, { pa:0, ab:0, h:0, tb:0, rbi:0, r:0, bb:0, hbp:0, sf:0, k:0, foulK:0, kTotal:0, po:0, ast:0, err:0, doubles:0, triples:0, hr:0 });
}

// ─── SPRAY CHART ───────────────────────────────────────────────────────────────
function SprayChart({ onPlot, plotted, interactive = true, hits = [], size = 320, showHeatmap = false, showZones = false, showOuts = true }) {
  const IMG_W = 3040, IMG_H = 2584;
  const HOME_PX = IMG_W * 0.49803;
  const HOME_PY = IMG_H * 0.87693;

  const toPx = p => {
    if (!p) return {x:0, y:0};
    const w = p.w || 320;
    const h = p.h || 281;
    // New data: saved in full image pixel space (w≈2839)
    // Old data v2.13-v2.14: saved in 1000x1000 NORM space (w=1000)
    // Legacy data: saved in old SVG space (w=320, h=281 or similar small values)
    // All cases: x/w gives 0-1 fraction, then multiply by IMG dimensions
    const fracX = p.x / w;
    const fracY = p.y / h;
    return { x: fracX * IMG_W, y: fracY * IMG_H };
  };

  const ABBREVS = {
    'Single':'1B','Double':'2B','Triple':'3B','Home Run':'HR',
    'Strikeout':'K','Ground Out':'GO','Fly Out':'FO','Line Out':'LO',
    'Pop Out':'PO','Foul Out':'FOK','Double Play':'DP',
    'Walk':'BB','Hit by Pitch':'HBP','Sac Fly':'SF','Sac Bunt':'SH',
    'Reach on Error':'E',"Fielder's Choice":'FC'
  };

  const dotColor = outcome => {
    if (outcome === 'Single')   return '#1a7a4a';  // darkest green
    if (outcome === 'Double')   return '#4aab6e';  // mid green
    if (outcome === 'Triple')   return '#8dd4a8';  // lightest green
    if (outcome === 'Home Run') return '#d4782a';  // pastel orange for HR
    if (COUNTS_AS_HIT.has(outcome)) return '#1a7a4a';
    if (OUT_OUTCOMES.includes(outcome)) return '#d14f62'; // lighter red for outs
    return '#5b8fc9';  // lighter slate-blue for "other"
  };
  const dotTextColor = () => 'white';
  const lineColor = outcome => {
    if (COUNTS_AS_HIT.has(outcome)) return '#74b08a'; // muted green line
    if (OUT_OUTCOMES.includes(outcome)) return '#c47a7a'; // muted red line
    return '#7a9fc2'; // muted blue line for other
  };

  const visibleHits = hits.filter(h => showOuts ? true : COUNTS_AS_HIT.has(h.outcome));
  const DOT_R = 60, FONT = 38;

  if (showHeatmap) {
    const cells = 10, cw = IMG_W/cells, ch = IMG_H/cells;
    const grid = Array.from({length:cells},()=>Array(cells).fill(0));
    visibleHits.forEach(h => {
      const p = toPx(h.spray);
      const ci = Math.min(Math.floor(p.x/cw), cells-1);
      const ri = Math.min(Math.floor(p.y/ch), cells-1);
      if (ci>=0&&ri>=0) grid[ri][ci]++;
    });
    const max = Math.max(...grid.flat(), 1);
    return (
      <div style={{position:'relative', width:'100%', userSelect:'none'}}>
        <img src={DIAMOND_URL} alt="field" style={{width:'100%', display:'block', borderRadius:8}} draggable={false}/>
        <svg viewBox={`0 0 ${IMG_W} ${IMG_H}`} preserveAspectRatio="none" style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none'}}>
          {grid.flatMap((row,ri) => row.map((val,ci) => {
            if (!val) return null;
            return <rect key={`h${ri}-${ci}`} x={ci*cw} y={ri*ch} width={cw} height={ch} fill={`rgba(220,50,50,${(val/max)*0.7})`}/>;
          }))}
        </svg>
      </div>
    );
  }

  const imgRef = React.useRef(null);
  const isDragging = React.useRef(false);
  const dragMoved = React.useRef(false);

  const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

  const clientToField = (clientX, clientY) => {
    const img = imgRef.current;
    if (!img) return null;
    const rect = img.getBoundingClientRect();
    const x = clamp(Math.round(((clientX - rect.left) / rect.width) * IMG_W), DOT_R, IMG_W - DOT_R);
    const y = clamp(Math.round(((clientY - rect.top) / rect.height) * IMG_H), DOT_R, IMG_H - DOT_R);
    return { x, y, w: IMG_W, h: IMG_H };
  };

  const containerRef = React.useRef(null);
  const onPlotRef = React.useRef(onPlot);
  onPlotRef.current = onPlot;

  const handleMouseDown = e => {
    if (!interactive) return;
    if (!plotted) return;
    const p = toPx(plotted);
    const img = imgRef.current;
    if (!img) return;
    const rect = img.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * IMG_W;
    const my = ((e.clientY - rect.top) / rect.height) * IMG_H;
    if (Math.sqrt((mx - p.x) ** 2 + (my - p.y) ** 2) <= DOT_R * 2) {
      isDragging.current = true;
      dragMoved.current = false;
      e.preventDefault();
    }
  };

  const handleMouseMove = e => {
    if (!isDragging.current || !interactive) return;
    dragMoved.current = true;
    const pt = clientToField(e.clientX, e.clientY);
    if (pt) onPlotRef.current && onPlotRef.current(pt);
  };

  const handleMouseUp = () => { if (isDragging.current) isDragging.current = false; };

  const handleClick = e => {
    if (!interactive) return;
    if (dragMoved.current) { dragMoved.current = false; return; }
    const pt = clientToField(e.clientX, e.clientY);
    if (pt) onPlotRef.current && onPlotRef.current(pt);
  };

  // Native non-passive touch listeners so e.preventDefault() actually works,
  // blocking iOS long-press image-save sheet on every touch.
  React.useEffect(() => {
    if (!interactive) return;
    const el = containerRef.current;
    if (!el) return;
    const onTouchStart = e => {
      e.preventDefault();
      if (!plotted) return;
      const touch = e.touches[0];
      const p = toPx(plotted);
      const img = imgRef.current;
      if (!img) return;
      const rect = img.getBoundingClientRect();
      const mx = ((touch.clientX - rect.left) / rect.width) * IMG_W;
      const my = ((touch.clientY - rect.top) / rect.height) * IMG_H;
      if (Math.sqrt((mx - p.x) ** 2 + (my - p.y) ** 2) <= DOT_R * 2) {
        isDragging.current = true;
        dragMoved.current = false;
      }
    };
    const onTouchMove = e => {
      e.preventDefault();
      if (!isDragging.current) return;
      dragMoved.current = true;
      const touch = e.touches[0];
      const img = imgRef.current;
      if (!img) return;
      const rect = img.getBoundingClientRect();
      const x = Math.max(DOT_R, Math.min(IMG_W - DOT_R, Math.round(((touch.clientX - rect.left) / rect.width) * IMG_W)));
      const y = Math.max(DOT_R, Math.min(IMG_H - DOT_R, Math.round(((touch.clientY - rect.top) / rect.height) * IMG_H)));
      onPlotRef.current && onPlotRef.current({ x, y, w: IMG_W, h: IMG_H });
    };
    const onTouchEnd = e => {
      e.preventDefault();
      if (isDragging.current) { isDragging.current = false; dragMoved.current = false; return; }
      if (!dragMoved.current && e.changedTouches.length > 0) {
        const touch = e.changedTouches[0];
        const img = imgRef.current;
        if (img) {
          const rect = img.getBoundingClientRect();
          const x = Math.max(DOT_R, Math.min(IMG_W - DOT_R, Math.round(((touch.clientX - rect.left) / rect.width) * IMG_W)));
          const y = Math.max(DOT_R, Math.min(IMG_H - DOT_R, Math.round(((touch.clientY - rect.top) / rect.height) * IMG_H)));
          onPlotRef.current && onPlotRef.current({ x, y, w: IMG_W, h: IMG_H });
        }
      }
      dragMoved.current = false;
    };
    const onContextMenu = e => e.preventDefault();
    el.addEventListener('touchstart',  onTouchStart,  { passive: false });
    el.addEventListener('touchmove',   onTouchMove,   { passive: false });
    el.addEventListener('touchend',    onTouchEnd,    { passive: false });
    el.addEventListener('contextmenu', onContextMenu);
    return () => {
      el.removeEventListener('touchstart',  onTouchStart);
      el.removeEventListener('touchmove',   onTouchMove);
      el.removeEventListener('touchend',    onTouchEnd);
      el.removeEventListener('contextmenu', onContextMenu);
    };
  }, [interactive, plotted]);

  return (
    <div
      ref={containerRef}
      style={{position:'relative', width:'100%', cursor: interactive ? 'crosshair' : 'default',
        userSelect:'none', WebkitUserSelect:'none', WebkitTouchCallout:'none'}}
      onClick={handleClick}
      onMouseDown={handleMouseDown}
      onMouseMove={handleMouseMove}
      onMouseUp={handleMouseUp}
      onMouseLeave={handleMouseUp}
    >
      <div style={{position:'relative'}}>
        <img ref={imgRef} src={DIAMOND_URL} alt="field"
          style={{width:'100%', display:'block', borderRadius:8, pointerEvents:'none'}}
          draggable={false}/>
        <svg viewBox={`0 0 ${IMG_W} ${IMG_H}`} preserveAspectRatio="none" style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none'}}>
        {visibleHits.map((h,i) => {
          const p = toPx(h.spray);
          return <line key={`l${i}`} x1={HOME_PX} y1={HOME_PY} x2={p.x} y2={p.y}
            stroke={lineColor(h.outcome)} strokeWidth="8" opacity="0.6"/>;
        })}
        {visibleHits.map((h,i) => {
          const p = toPx(h.spray);
          const abbr = ABBREVS[h.outcome] || '?';
          return (
            <g key={`d${i}`}>
              <circle cx={p.x} cy={p.y} r={DOT_R} fill={dotColor(h.outcome)} stroke="rgba(255,255,255,0.5)" strokeWidth="5"/>
              <text x={p.x} y={p.y} textAnchor="middle" dominantBaseline="central"
                fontSize={FONT} fontWeight="700" fill={dotTextColor(h.outcome)} fontFamily="sans-serif">{abbr}</text>
            </g>
          );
        })}
        {plotted && (() => {
          const p = toPx(plotted);
          return (
            <g style={{cursor:'grab'}}>
              <circle cx={p.x} cy={p.y} r={DOT_R} fill="#1e3a5f" fillOpacity="0.18" stroke="#1e3a5f" strokeWidth="10"/>
              <circle cx={p.x} cy={p.y} r={30} fill="#1e3a5f"/>
            </g>
          );
        })()}
      </svg>
      </div>
    </div>
  );
}

// ─── IMPORT BUTTON ─────────────────────────────────────────────────────────────
function ImportButton({ uid }) {
  const [importing, setImporting] = useState(false);
  const [result, setResult] = useState(null);
  const ref = React.useRef(null);
  const handle = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);
    try {
      const text = await file.text();
      const r = await importFromCSV(uid, text);
      setResult(r);
    } catch(err) {
      setResult({error: err.message});
    } finally {
      setImporting(false);
      e.target.value = '';
    }
  };
  return (
    <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4}}>
      <button onClick={() => ref.current?.click()} disabled={importing} style={S.btnSmall}>
        {importing ? 'Importing...' : <><i className="fa-solid fa-arrow-up" style={{marginRight:8, fontSize:11}}></i>Import CSV</>}
      </button>
      <input ref={ref} type="file" accept=".csv" style={{display:'none'}} onChange={handle}/>
      {result && (
        <span style={{fontSize:11, color: result.error ? 'var(--danger)' : 'var(--success)', maxWidth:200, textAlign:'right'}}>
          {result.error ? result.error : `✓ ${result.gamesImported} games, ${result.absImported} ABs imported`}
        </span>
      )}
    </div>
  );
}

// ─── CSV EXPORT ────────────────────────────────────────────────────────────────
async function exportCSV(uid) {
  const gsnap = await gamesCol(uid).orderBy('date','desc').get();
  const games = gsnap.docs.map(d => ({id:d.id,...d.data()}));
  const rows = [['Date','Day','Opponent','Park','Home/Away','Day/Night','My Score','Opp Score','Result','Team','League','Tier','Season','PA','AB','H','2B','3B','HR','R','RBI','BB','K','AVG','OBP','SLG','PO','A','E','AB#','Outcome','Sub-Outcome','Bases','RBI','Run','Bat','Position','Hit Direction','Spray X','Spray Y','AB Comments','Game Comments']];
  for (const g of games) {
    const absSnap = await absCol(uid, g.id).orderBy('timestamp','asc').get();
    const abs = absSnap.docs.map(d => ({id:d.id,...d.data()}));
    const s = calcGameStats(abs, false);
    const res = getResult(g);
    abs.forEach((ab, i) => {
      const dir = ab.spray ? getHitDirection(ab.spray, 'R') : '';
      rows.push([
        g.date||'', g.dayOfWeek||'', g.opponent||'', g.park||'', g.homeAway||'', g.dayNight||'',
        g.myScore||'', g.oppScore||'', res?.label||'',
        g.teamName||'', g.league||'', g.tier||'', g.season||'',
        i===0?s.pa:'', i===0?s.ab:'', i===0?s.h:'', i===0?s.doubles:'', i===0?s.triples:'', i===0?s.hr:'',
        i===0?s.r:'', i===0?s.rbi:'', i===0?s.bb:'', i===0?s.kTotal:'',
        i===0?calcAVG(s.h,s.ab):'', i===0?calcOBP(s.h,s.bb,s.hbp,s.sf,s.ab):'', i===0?calcSLG(s.tb,s.ab):'',
        i===0?s.po:'', i===0?s.ast:'', i===0?s.err:'',
        i+1, ab.outcome||'', ab.subOutcome||'', ab.bases||'', ab.rbi||0, ab.runScored?'Y':'N',
        ab.batName||'', ab.position||'', dir,
        ab.spray?.x||'', ab.spray?.y||'',
        (ab.comments||'').replace(/,/g,' '), (g.comments||'').replace(/,/g,' ')
      ]);
    });
    if (abs.length === 0) {
      rows.push([g.date||'',g.dayOfWeek||'',g.opponent||'',g.park||'',g.homeAway||'',g.dayNight||'',g.myScore||'',g.oppScore||'',res?.label||'',g.teamName||'',g.league||'',g.tier||'',g.season||'',...Array(27).fill(''),(g.comments||'').replace(/,/g,' ')]);
    }
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`softball-stats-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ─── HAPTIC FEEDBACK ───────────────────────────────────────────────────────────
function haptic(style='light') {
  if (navigator.vibrate) {
    if (style === 'light') navigator.vibrate(8);
    else if (style === 'medium') navigator.vibrate(20);
    else if (style === 'success') navigator.vibrate([10, 50, 10]);
  }
}

// ─── HOT/COLD ZONES ────────────────────────────────────────────────────────────
// Divides field into 6 zones, calculates AVG per zone
function calcHotColdZones(hits) {
  // Zones: LF-deep, CF-deep, RF-deep, LF-short, CF-short, RF-short
  const zones = Array.from({length:6}, () => ({h:0, ab:0}));
  hits.forEach(hit => {
    if (!hit.spray) return;
    const W = hit.spray.w || 320, H = hit.spray.h || 281;
    const nx = hit.spray.x / W; // 0=left, 1=right
    const ny = hit.spray.y / H; // 0=top(deep), 1=bottom(home)
    const col = nx < 0.38 ? 0 : nx < 0.62 ? 1 : 2; // L/C/R
    const row = ny < 0.5 ? 0 : 1; // deep/short
    const zone = row * 3 + col;
    zones[zone].ab++;
    if (COUNTS_AS_HIT.has(hit.outcome)) zones[zone].h++;
  });
  return zones.map(z => ({
    ...z,
    avg: z.ab > 0 ? z.h / z.ab : null
  }));
}

// ─── CSV IMPORT ────────────────────────────────────────────────────────────────
async function importFromCSV(uid, csvText) {
  const lines = csvText.trim().split('\n');
  if (lines.length < 2) throw new Error('CSV appears empty');
  
  // Parse CSV rows (handle quoted fields)
  const parseRow = line => {
    const result = [];
    let current = '', inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQuotes = !inQuotes; }
      else if (line[i] === ',' && !inQuotes) { result.push(current); current = ''; }
      else { current += line[i]; }
    }
    result.push(current);
    return result;
  };

  const headers = parseRow(lines[0]);

  // Validate this looks like a softball tracker export
  const requiredHeaders = ['Date', 'Opponent', 'AB#', 'Outcome'];
  const missing = requiredHeaders.filter(h => !headers.includes(h));
  if (missing.length > 0) {
    throw new Error(`This doesn't look like a Softball Tracker CSV. Missing columns: ${missing.join(', ')}`);
  }
  const rows = lines.slice(1).map(parseRow);

  // Group rows by game (Date + Opponent)
  const gameMap = {};
  rows.forEach(row => {
    const get = h => { const i = headers.indexOf(h); return i >= 0 ? row[i]?.trim() : ''; };
    const key = `${get('Date')}__${get('Opponent')}`;
    if (!gameMap[key]) {
      gameMap[key] = {
        date: get('Date'), dayOfWeek: get('Day'), opponent: get('Opponent'),
        park: get('Park'), homeAway: get('Home/Away'), dayNight: get('Day/Night'),
        myScore: get('My Score'), oppScore: get('Opp Score'),
        teamName: get('Team'), league: get('League'), tier: get('Tier'),
        season: get('Season'), comments: get('Game Comments'),
        abs: []
      };
    }
    const abNum = parseInt(get('AB#'));
    if (abNum > 0) {
      gameMap[key].abs.push({
        outcome: get('Outcome'), subOutcome: get('Sub-Outcome'),
        bases: parseInt(get('Bases'))||0, rbi: parseInt(get('RBI'))||0,
        runScored: get('Run') === 'Y', batName: get('Bat'),
        position: get('Position'), comments: get('AB Comments'),
        countAsAB: COUNTS_AS_AB.has(get('Outcome')),
        countAsHit: COUNTS_AS_HIT.has(get('Outcome')),
      });
    }
  });

  // Write to Firebase
  let gamesImported = 0, absImported = 0;
  for (const gameData of Object.values(gameMap)) {
    const { abs, ...gameFields } = gameData;
    const ref = await gamesCol(uid).add({
      ...gameFields,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      imported: true
    });
    for (const ab of abs) {
      await absCol(uid, ref.id).add({
        ...ab,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      absImported++;
    }
    gamesImported++;
  }
  return { gamesImported, absImported };
}


function GamesPage({ uid, setPage, setGameId, active }) {
  const [games, setGames] = useState([]);
  const [allABs, setAllABs] = useState({});
  const [loading, setLoading] = useState(true);
  const [exporting, setExporting] = useState(false);
  const [search, setSearch] = useState('');
  const [showComments, setShowComments] = useState(() => {
    try { return localStorage.getItem('gamesShowComments') === 'true'; } catch { return false; }
  });
  const toggleShowComments = (val) => {
    setShowComments(val);
    try { localStorage.setItem('gamesShowComments', val ? 'true' : 'false'); } catch {}
  };

  const loadAll = async () => {
    setLoading(true);
    const snap = await gamesCol(uid).orderBy('date','desc').get();
    const gdata = snap.docs.map(d => ({id:d.id,...d.data()}));
    gdata.sort((a,b)=>{ const da=(a.date+(a.time||'00:00')); const db=(b.date+(b.time||'00:00')); return db.localeCompare(da); });
    setGames(gdata);
    const abResults = await Promise.all(gdata.map(g => absCol(uid,g.id).orderBy('timestamp','asc').get()));
    const absMap = {};
    gdata.forEach((g,i) => { absMap[g.id] = abResults[i].docs.map(d=>({id:d.id,...d.data()})); });
    setAllABs(absMap);
    setLoading(false);
  };

  useEffect(() => { loadAll(); }, [uid, active]);

  const go = id => { setPage('game-detail', id); };

  const searchLower = search.toLowerCase().trim();
  const filteredGames = searchLower
    ? games.filter(g => {
        const res = getResult(g);
        const resLabel = res?.label || '';
        // Whole-word match for result terms only
        const resWords = resLabel === 'W' ? ['w','win','won'] : resLabel === 'L' ? ['l','loss','lost'] : resLabel === 'T' ? ['t','tie','tied','draw'] : [];
        if (resWords.includes(searchLower)) return true;
        const fields = [
          g.opponent, g.park, g.teamName, g.season, g.league, g.tier,
          g.homeAway, g.dayNight, g.comments,
          g.date, fmtDate(g.date), getDayOfWeek(g.date),
          g.time ? fmtTime(g.time) : '', g.time,
          g.myScore !== undefined ? String(g.myScore) : '',
          g.oppScore !== undefined ? String(g.oppScore) : '',
          g.myScore !== undefined && g.oppScore !== undefined ? `${g.myScore}-${g.oppScore}` : '',
          g.date ? g.date.slice(0,4) : '',
        ].filter(Boolean);
        return fields.some(f => f.toLowerCase().includes(searchLower));
      })
    : games;

  const streak = (() => {
    if (!games.length) return null;
    const sorted = [...games].sort((a,b) => b.date.localeCompare(a.date));
    let hitStreak = 0;
    for (const g of sorted) {
      const abs = allABs[g.id] || [];
      if (abs.some(ab => COUNTS_AS_HIT.has(ab.outcome))) hitStreak++;
      else break;
    }
    return hitStreak >= 2 ? hitStreak : null;
  })();

  const careerHighs = (() => {
    if (!games.length) return null;
    let bestH = 0, bestRBI = 0;
    games.forEach(g => {
      const s = calcGameStats(allABs[g.id]||[], false);
      if (s.h > bestH) bestH = s.h;
      if (s.rbi > bestRBI) bestRBI = s.rbi;
    });

// ─── BAT DROPDOWN ──────────────────────────────────────────────────────────────
function BatDropdown({ bats, value, onChange }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const activeFavs = bats.filter(b => !b.archived && b.favourite);
  const activeRest = bats.filter(b => !b.archived && !b.favourite);
  const selected = bats.find(b => b.id === value);

  const batSubline = b => {
    const parts = [];
    if (b.weight) parts.push(`${b.weight} oz`);
    if (b.endloadWeight) parts.push(`${b.endloadWeight} oz endload`);
    return parts.join(' · ');
  };

  const BatOption = ({ bat }) => (
    <div onClick={() => { onChange(bat.id); setOpen(false); }}
      style={{padding:'10px 14px', cursor:'pointer', background: value===bat.id ? 'var(--border2)' : 'transparent', borderBottom:'1px solid var(--border2)'}}
      onMouseEnter={e => e.currentTarget.style.background='var(--border2)'}
      onMouseLeave={e => e.currentTarget.style.background = value===bat.id ? 'var(--border2)' : 'transparent'}>
      <div style={{fontSize:14, color:'var(--text)', fontWeight: bat.favourite ? 600 : 400}}>
        {bat.nickname || bat.name}{bat.nickname && <span style={{color:'var(--muted)', fontWeight:400, fontSize:12, marginLeft:4}}>({bat.name})</span>}
      </div>
      {batSubline(bat) && <div style={{fontSize:12, color:'var(--muted)', marginTop:2}}>{batSubline(bat)}</div>}
    </div>
  );

  return (
    <div ref={ref} style={{position:'relative'}}>
      <div onClick={() => setOpen(o => !o)}
        style={{...S.select, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'space-between', minHeight:40}}>
        <div>
          {selected ? (
            <>
              <div style={{fontSize:14, color:'var(--text)', fontWeight: selected.favourite ? 600 : 400}}>
                {selected.nickname || selected.name}{selected.nickname && <span style={{color:'var(--muted)', fontWeight:400, fontSize:12, marginLeft:4}}>({selected.name})</span>}
              </div>
              {batSubline(selected) && <div style={{fontSize:12, color:'var(--muted)'}}>{batSubline(selected)}</div>}
            </>
          ) : <span style={{color:'var(--muted)'}}>— Select bat —</span>}
        </div>
        <i className={`fa-solid ${open ? 'fa-chevron-up' : 'fa-chevron-down'}`} style={{color:'var(--muted)', marginLeft:8, fontSize:11}}></i>
      </div>
      {open && (
        <div style={{position:'absolute', top:'100%', left:0, right:0, background:'var(--surface)',
          border:'1px solid var(--border)', borderRadius:8, zIndex:200, maxHeight:240, overflowY:'auto',
          boxShadow:'0 4px 16px rgba(0,0,0,0.12)'}}>
          <div onClick={() => { onChange(''); setOpen(false); }}
            style={{padding:'10px 14px', cursor:'pointer', borderBottom:'1px solid var(--border2)', color:'var(--muted)', fontSize:14}}
            onMouseEnter={e => e.currentTarget.style.background='var(--border2)'}
            onMouseLeave={e => e.currentTarget.style.background='transparent'}>
            — Select bat —
          </div>
          {activeFavs.length > 0 && (
            <>
              <div style={{padding:'6px 14px 4px', fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.06em', background:'var(--surface2)', display:'flex', alignItems:'center', gap:6}}>
                <i className="fa-solid fa-star" style={{color:'#f59e0b', fontSize:10}}></i> Favourites
              </div>
              {activeFavs.map(b => <BatOption key={b.id} bat={b}/>)}
            </>
          )}
          {activeRest.length > 0 && (
            <>
              {activeFavs.length > 0 && <div style={{padding:'6px 14px 4px', fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.06em', background:'var(--surface2)'}}>All Bats</div>}
              {activeRest.map(b => <BatOption key={b.id} bat={b}/>)}
            </>
          )}
          {activeFavs.length === 0 && activeRest.length === 0 && (
            <div style={{padding:'12px 14px', color:'var(--muted)', fontSize:13}}>No bats registered yet.</div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── AB FORM ───────────────────────────────────────────────────────────────────
function ABForm({ uid, gameId, ab, bats, onSave, onCancel, defaultPosition='' }) {
  const isEdit = !!ab;
  const blank = { batId:'', outcome:'', subOutcome:'', bases:0, rbi:0, runScored:null, trajectory:'', spray:null, comments:'' };
  const [f, setF] = useState(isEdit ? {...blank, ...ab} : blank);
  const [toast, setToast] = useState(null);
  const [validModal, setValidModal] = useState(null);
  const upd = (k, v) => { setF(x => ({...x, [k]: v})); window.__dirtyForm = true; };

  const outcomeGroup = HIT_OUTCOMES.includes(f.outcome) ? 'hit' : OUT_OUTCOMES.includes(f.outcome) ? 'out' : OTHER_OUTCOMES.includes(f.outcome) ? 'other' : '';
  const isFoulOut = f.outcome === 'Foul Out';
  const isFoulCaught = isFoulOut && f.subOutcome === 'caught';
  const isFoulK = isFoulOut && f.subOutcome === 'strikeout';
  const showSpray = SPRAY_OUTCOMES.has(f.outcome) || isFoulCaught || isFoulK;
  const showBases = ['Reach on Error', "Fielder's Choice"].includes(f.outcome);
  const autoBase = HIT_BASES[f.outcome] || null;
  const showRBI = f.outcome && !['Strikeout'].includes(f.outcome) && !isFoulK && !(isFoulOut && !f.subOutcome);
  const RUN_SCORED_OUTCOMES = new Set(['Single','Double','Triple','Home Run','Walk','Hit by Pitch','Reach on Error',"Fielder's Choice"]);
  const showRunScored = RUN_SCORED_OUTCOMES.has(f.outcome);
  const isHR = f.outcome === 'Home Run';

  const setOutcome = (o) => {
    haptic('light');
    setF(x => ({...x, outcome: o, subOutcome:'', bases: HIT_BASES[o] || 0, runScored: o === 'Home Run' ? true : x.runScored}));
    window.__dirtyForm = true;
  };

  // Cancel always just cancels — warnings fire at collapse/navigate level
  const handleCancel = () => {
    window.__dirtyForm = false;
    onCancel();
  };

  const needsTraj = NEEDS_TRAJECTORY.has(f.outcome) && !(isFoulOut);
  const needsBases = NEEDS_BASES.has(f.outcome);

  const save = async () => {
    const missing = [];
    if (needsTraj && !f.trajectory) missing.push('Trajectory');
    if (needsBases && !f.bases) missing.push('Bases Reached');
    if (showRunScored && f.runScored === null) missing.push('Run Scored');
    if (missing.length) { setValidModal(`Please select ${missing.join(' and ')}.`); return; }
    const bat = bats.find(b => b.id === f.batId);
    const bases = autoBase || f.bases || 0;
    const data = {
      ...f, batName: bat?.name || '', batNickname: bat?.nickname || '',
      bases,
      countAsAB: COUNTS_AS_AB.has(f.outcome),
      countAsHit: COUNTS_AS_HIT.has(f.outcome),
    };
    if (isEdit) {
      await absCol(uid, gameId).doc(ab.id).update(data);
    } else {
      data.timestamp = firebase.firestore.FieldValue.serverTimestamp();
      await absCol(uid, gameId).add(data);
    }
    haptic('success');
    window.__dirtyForm = false;
    setToast('saved');
    setTimeout(() => { setToast(null); onSave(); }, 900);
  };

  // Outcome tile colours
  const tileStyle = (group, active) => {
    const base = { display:'flex', alignItems:'center', justifyContent:'center', padding:'11px 14px', borderRadius:8, border:'1.5px solid', cursor:'pointer', fontSize:14, transition:'all 0.1s', userSelect:'none', textAlign:'center' };
    // Unselected — soft pastels matching reference screenshot
    if (group==='hit')   { const s = {...base, background:'#e8f8f2', borderColor:'#a8d8c4', color:'#1a7a5a', fontWeight:400}; if (active) { s.borderColor='#2d8f6f'; s.fontWeight=700; s.background='#c8eee0'; } return s; }
    if (group==='out')   { const s = {...base, background:'#fdecea', borderColor:'#f5b8b8', color:'#c0392b', fontWeight:400}; if (active) { s.borderColor='#c0392b'; s.fontWeight=700; s.background='#fad0cc'; } return s; }
    if (group==='other') { const s = {...base, background:'#eaf2fd', borderColor:'#b8d0f0', color:'#2e6db4', fontWeight:400}; if (active) { s.borderColor='#2e6db4'; s.fontWeight=700; s.background='#cde0f8'; } return s; }
    return {...base, background:'var(--surface)', borderColor:'var(--border)', color:'var(--text)', fontWeight:400};
  };

  const OUTCOME_ABBREVS = {
    'Single':'1B','Double':'2B','Triple':'3B','Home Run':'HR',
    'Strikeout':'K','Ground Out':'GO','Fly Out':'FO','Line Out':'LO','Pop Out':'PO',
    'Foul Out':'FOK','Double Play':'DP',
    'Walk':'BB','Hit by Pitch':'HBP','Sac Fly':'SF','Sac Bunt':'SH',
    'Reach on Error':'E',"Fielder's Choice":'FC'
  };

  const OTile = ({ label, group }) => {
    const active = f.outcome === label;
    const abbr = OUTCOME_ABBREVS[label];
    return (
      <div style={{...tileStyle(group, active), justifyContent:'space-between'}} onClick={() => setOutcome(label)}>
        <span>{label}</span>
        {abbr && <span style={{fontSize:11, fontWeight:700, opacity: active ? 0.9 : 0.55, marginLeft:8, flexShrink:0}}>{abbr}</span>}
      </div>
    );
  };

  const TRAJECTORIES = ['Ground Ball','Line Drive','Fly Ball','Pop Up','Bunt'];

  if (toast) return (
    <div style={{...S.card, border:'1px solid var(--success)', background:'rgba(39,103,73,0.08)', textAlign:'center', padding:'24px 16px'}}>
      <div style={{fontSize:48, color:'#1a7a4a'}}>
        <i className="fa-solid fa-circle-check"></i>
      </div>
    </div>
  );

  return (
    <div>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14, paddingTop:4}}>
        <div style={S.cardTitle}>{isEdit ? 'Edit At Bat' : 'Record At Bat'}</div>
        <div style={{display:'flex', gap:8}}>
          <button onClick={handleCancel} style={S.btnSecondary}>Cancel</button>
          <button onClick={save} disabled={!f.outcome || (isFoulOut && !f.subOutcome)} style={S.btnPrimary}>{isEdit ? 'Save Changes' : 'Record AB'}</button>
        </div>
      </div>
      {validModal && <WarnModal message={validModal} confirmLabel="OK" confirmColor="#1e3a5f"
        onConfirm={() => setValidModal(null)} onCancel={null}/>}

      {/* Bat */}
      <div style={{...S.formGroup, marginBottom:16}}>
        <label style={S.label}>Bat Used</label>
        <BatDropdown bats={bats} value={f.batId} onChange={id => upd('batId', id)}/>
      </div>

      {/* Outcome tiles */}
      <div style={{marginBottom:16}}>
        <label style={{...S.label, display:'block', marginBottom:10}}>Outcome *</label>
        <div style={S.outGrp}>
          <div style={S.outGrpLabel}>Hits</div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
            {HIT_OUTCOMES.map(o => <OTile key={o} label={o} group="hit"/>)}
          </div>
        </div>
        <div style={S.outGrp}>
          <div style={S.outGrpLabel}>Outs</div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
            {OUT_OUTCOMES.map(o => <OTile key={o} label={o} group="out"/>)}
          </div>
        </div>
      {/* Foul out sub-type */}
      {isFoulOut && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>Foul Out Type</label>
          <div style={S.outBtns}>
            <button style={{...S.outBtn, ...(f.subOutcome==='caught'?S.outBtnOut:{})}} onClick={() => { haptic('light'); upd('subOutcome','caught'); }}>Foul Caught (by fielder)</button>
            <button style={{...S.outBtn, ...(f.subOutcome==='strikeout'?S.outBtnOut:{})}} onClick={() => { haptic('light'); upd('subOutcome','strikeout'); }}>Foul Strikeout (not caught)</button>
          </div>
        </div>
      )}

        <div style={S.outGrp}>
          <div style={S.outGrpLabel}>Other</div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
            {OTHER_OUTCOMES.map(o => <OTile key={o} label={o} group="other"/>)}
          </div>
        </div>
      </div>


      {/* Bases for ROE / FC */}
      {showBases && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>Bases Reached{needsBases ? ' *' : ''}</label>
          <div style={S.outBtns}>{[1,2,3].map(n => <button key={n} style={{...S.outBtn, ...(f.bases===n?S.outBtnHit:{})}} onClick={() => upd('bases',n)}>{n}B</button>)}</div>
        </div>
      )}


      {/* Trajectory */}
      {f.outcome && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={{...S.label, display:'block', marginBottom:8}}>Trajectory{needsTraj ? ' *' : ''}</label>
          <div style={{display:'flex', flexWrap:'wrap', gap:8}}>
            {TRAJECTORIES.map(t => (
              <button key={t} onClick={() => upd('trajectory', f.trajectory===t ? '' : t)}
                style={{padding:'9px 14px', borderRadius:8, border:'1.5px solid', cursor:'pointer', fontSize:13, fontWeight:500, transition:'all 0.1s',
                  background: f.trajectory===t ? '#1e3a5f' : 'var(--surface)',
                  borderColor: f.trajectory===t ? '#1e3a5f' : 'var(--border)',
                  color: f.trajectory===t ? '#fff' : 'var(--text)'}}>
                {t}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Spray chart — after trajectory, before RBI */}
      {showSpray && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={{...S.label, display:'block', marginBottom:8}}>Hit Location</label>
          <div style={{width:'100%', background:'var(--spray-bg)', borderRadius:10, overflow:'hidden', border:'1px solid var(--border)', display:'flex', justifyContent:'center'}}>
            <SprayChart onPlot={pt => upd('spray', pt)} plotted={f.spray} interactive={true} size={600}/>
          </div>
          {f.spray && <button onClick={() => upd('spray', null)} style={{...S.btnSmall, marginTop:6, fontSize:11}}>Clear placement</button>}
        </div>
      )}

      {/* RBI stepper */}
      {showRBI && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={S.label}>RBI</label>
          <div style={{display:'flex', alignItems:'center', gap:16, marginTop:4}}>
            <button onClick={() => upd('rbi', Math.max(0, f.rbi-1))}
              style={{width:36, height:36, borderRadius:8, border:'1.5px solid var(--border)', background:'var(--surface)', cursor:'pointer', fontSize:18, color:'var(--text)', display:'flex', alignItems:'center', justifyContent:'center'}}>
              <i className="fa-solid fa-minus" style={{fontSize:12}}></i>
            </button>
            <span style={{fontSize:20, fontWeight:700, minWidth:24, textAlign:'center', color:'var(--text)'}}>{f.rbi}</span>
            <button onClick={() => upd('rbi', Math.min(4, f.rbi+1))}
              style={{width:36, height:36, borderRadius:8, border:'1.5px solid var(--border)', background:'var(--surface)', cursor:'pointer', fontSize:18, color:'var(--text)', display:'flex', alignItems:'center', justifyContent:'center'}}>
              <i className="fa-solid fa-plus" style={{fontSize:12}}></i>
            </button>
          </div>
        </div>
      )}

      {/* Run Scored */}
      {showRunScored && (
        <div style={{...S.formGroup, marginBottom:16}}>
          <label style={{...S.label, display:'block', marginBottom:8}}>Run Scored? *</label>
          <div style={{display:'flex', gap:8}}>
            <button
              onClick={() => { if (!isHR) upd('runScored', true); }}
              disabled={isHR}
              style={{flex:1, padding:'11px 14px', borderRadius:8, border:'1.5px solid', cursor: isHR ? 'default' : 'pointer', fontSize:14, fontWeight: f.runScored===true ? 700 : 400, transition:'all 0.1s',
                background: f.runScored===true ? '#c8eee0' : 'var(--surface)',
                borderColor: f.runScored===true ? '#2d8f6f' : 'var(--border)',
                color: f.runScored===true ? '#1a7a5a' : 'var(--text)',
                opacity: isHR ? 0.7 : 1}}>
              Scored
            </button>
            <button
              onClick={() => { if (!isHR) upd('runScored', false); }}
              disabled={isHR}
              style={{flex:1, padding:'11px 14px', borderRadius:8, border:'1.5px solid', cursor: isHR ? 'default' : 'pointer', fontSize:14, fontWeight: f.runScored===false ? 700 : 400, transition:'all 0.1s',
                background: f.runScored===false ? '#fad0cc' : 'var(--surface)',
                borderColor: f.runScored===false ? '#c0392b' : 'var(--border)',
                color: f.runScored===false ? '#c0392b' : 'var(--text)',
                opacity: isHR ? 0.7 : 1}}>
              Did Not Score
            </button>
          </div>
          {isHR && <p style={{...S.hint, marginTop:6}}>Automatically set for Home Runs.</p>}
        </div>
      )}

      {/* Comments */}
      <div style={{...S.formGroup, marginBottom:16}}>
        <label style={S.label}>Comments</label>
        <textarea style={{...S.input, height:65, resize:'vertical'}} value={f.comments} onChange={e => upd('comments', e.target.value)} placeholder="Notes about this at bat..."/>
      </div>

      <div style={{display:'flex', gap:10, justifyContent:'flex-end', paddingBottom:16}}>
        <button onClick={handleCancel} style={S.btnSecondary}>Cancel</button>
        <button onClick={save} disabled={!f.outcome || (isFoulOut && !f.subOutcome)} style={S.btnPrimary}>
          {isEdit ? 'Save Changes' : 'Record AB'}
        </button>
      </div>
      {isFoulOut && !f.subOutcome && <p style={{...S.hint, marginTop:8}}>Select foul out type to continue.</p>}
    </div>
  );
}
// ─── GAME DETAIL PAGE ──────────────────────────────────────────────────────────
function GameDetailPage({ uid, gameId, setPage, prevPage='games' }) {
  const [game, setGame] = useState(null);
  const [abs, setAbs] = useState([]);
  const [bats, setBats] = useState([]);
  const [profile, setProfile] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [editingGame, setEditingGame] = useState(false);
  const [gameForm, setGameForm] = useState(null);
  const [parks, setParks] = useState([]);
  const [showEditParkDropdown, setShowEditParkDropdown] = useState(false);
  const [savingGame, setSavingGame] = useState(false);
  const [showHeatmap, setShowHeatmap] = useState('spray');
  const [showOuts, setShowOuts] = useState(true);
  const [confirmAB, setConfirmAB] = useState(null);
  const [confirmGame, setConfirmGame] = useState(false);
  const [confirmFielding, setConfirmFielding] = useState(null);
  const [reorderMode, setReorderMode] = useState(false);
  const [dragIdx, setDragIdx] = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);
  const [fieldingReorderMode, setFieldingReorderMode] = useState(false);
  const [fieldingDragIdx, setFieldingDragIdx] = useState(null);
  const [fieldingDragOverIdx, setFieldingDragOverIdx] = useState(null);
  const [abCollapsed, setAbCollapsed] = useState(false);
  const [abFormFromCollapsed, setAbFormFromCollapsed] = useState(false);
  const [sprayCollapsed, setSprayCollapsed] = useState(false);
  const [fieldingCollapsed, setFieldingCollapsed] = useState(false);
  const [fieldingFormFromCollapsed, setFieldingFormFromCollapsed] = useState(false);
  const [showFieldingForm, setShowFieldingForm] = useState(false);
  const [fieldingEntries, setFieldingEntries] = useState([]);
  const [fieldingForm, setFieldingForm] = useState({ inning:'', position:'', putouts:0, assists:0, fe:0, te:0, notes:'' });
  const [editFieldingId, setEditFieldingId] = useState(null);

  const fieldingCol = () => gamesCol(uid).doc(gameId).collection('fielding');

  const [fieldingToast, setFieldingToast] = useState(false);
  const [warnModal, setWarnModal] = useState(null);

  const loadFielding = () => fieldingCol().orderBy('createdAt','asc').get()
    .then(s => setFieldingEntries(s.docs.map(d=>({id:d.id,...d.data()}))));

  const saveFielding = async () => {
    const data = { ...fieldingForm, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    // Migrate: if old 'errors' field exists but fe/te don't, move to fe
    if (data.errors !== undefined && data.fe === undefined) { data.fe = data.errors; data.te = 0; delete data.errors; }
    if (editFieldingId) {
      await fieldingCol().doc(editFieldingId).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await fieldingCol().add(data);
    }
    setShowFieldingForm(false);
    setEditFieldingId(null);
    setFieldingForm({ inning:'', position:'', putouts:0, assists:0, fe:0, te:0, notes:'' });
    window.__dirtyForm = false;
    loadFielding();
    setFieldingToast(true);
    setTimeout(() => setFieldingToast(false), 900);
  };

  const deleteFielding = async id => {
    await fieldingCol().doc(id).delete(); setConfirmFielding(null); loadFielding();
  };

  const startEditFielding = entry => {
    window.__dirtyForm = false;
    setFieldingForm({ inning: entry.inning||'', position: entry.position||'', putouts: entry.putouts||0, assists: entry.assists||0, fe: entry.fe !== undefined ? entry.fe : (entry.errors||0), te: entry.te||0, notes: entry.notes||'' });
    setEditFieldingId(entry.id);
    setShowFieldingForm(true);
  };

  const loadGame = () => gamesCol(uid).doc(gameId).get().then(d => {
    const g = {id:d.id,...d.data()};
    setGame(g);
    setGameForm(g);
  });
  const loadABs = () => absCol(uid,gameId).orderBy('timestamp','asc').get().then(s => { setAbs(s.docs.map(d=>({id:d.id,...d.data()}))); setLoading(false); });

  useEffect(() => {
    setAbs([]);
    setGame(null);
    setLoading(true);
    loadGame(); loadABs(); loadFielding();
    batsCol(uid).get().then(s => setBats(s.docs.map(d=>({id:d.id,...d.data()}))));
    userDoc(uid).get().then(d => { if (d.exists && d.data().profile) setProfile(d.data().profile); });
    parksCol(uid).orderBy('name','asc').get().then(p => setParks(p.docs.map(d => ({id:d.id,...d.data()}))));
  }, [uid, gameId]);

  const delAB = async id => {
    await absCol(uid, gameId).doc(id).delete(); setConfirmAB(null); loadABs();
  };

  const delGame = async () => {
    // Delete all ABs first
    const snap = await absCol(uid, gameId).get();
    await Promise.all(snap.docs.map(d => d.ref.delete()));
    await gamesCol(uid).doc(gameId).delete();
    setPage('games');
  };

  const [gameFormError, setGameFormError] = useState(null);

  const saveGame = async () => {
    // Validate W/L/T vs scores
    const ms = parseInt(gameForm.myScore), os = parseInt(gameForm.oppScore);
    const hasScores = !isNaN(ms) && !isNaN(os) && gameForm.myScore !== '' && gameForm.oppScore !== '';
    if (hasScores && gameForm.result) {
      const conflict =
        (gameForm.result === 'W' && ms <= os) ||
        (gameForm.result === 'L' && ms >= os) ||
        (gameForm.result === 'T' && ms !== os);
      if (conflict) {
        setGameFormError(`Result "${gameForm.result === 'W' ? 'Win' : gameForm.result === 'L' ? 'Loss' : 'Tie'}" conflicts with the score ${ms}–${os}.`);
        return;
      }
    }
    setGameFormError(null);
    setSavingGame(true);
    await gamesCol(uid).doc(gameId).update({...gameForm, dayOfWeek: getDayOfWeek(gameForm.date)});
    window.__dirtyForm = false;
    setSavingGame(false);
    setEditingGame(false);
    loadGame();
  };

  const updGame = (k,v) => { setGameForm(f=>({...f,[k]:v})); window.__dirtyForm = true; };

  const stats = calcGameStats(abs, profile.includeKFoulInK);
  const res = game ? getResult(game) : null;
  const fldPct = stats.po+stats.ast+stats.err > 0 ? ((stats.po+stats.ast)/(stats.po+stats.ast+stats.err)).toFixed(3).replace('0.','.') : '—';
  const sprayHits = abs.filter(ab => ab.spray);
  const handedness = profile.bats || 'R';

  // Hit direction breakdown
  const dirCounts = {Pull:0, Center:0, Oppo:0};
  sprayHits.filter(ab => COUNTS_AS_HIT.has(ab.outcome)).forEach(ab => {
    const d = getHitDirection(ab.spray, handedness);
    if (d) dirCounts[d]++;
  });
  const dirTotal = dirCounts.Pull + dirCounts.Center + dirCounts.Oppo;

  if (!game) return <div className="page-content"><p style={S.muted}>Loading game...</p></div>;

  return (
    <div className="page-content game-detail-content">
      {confirmAB && <ConfirmModal message="Delete this at bat?" onConfirm={()=>delAB(confirmAB)} onCancel={()=>setConfirmAB(null)}/>}
      {confirmGame && <ConfirmModal message="Delete this game? All recorded ABs will also be deleted." onConfirm={delGame} onCancel={()=>setConfirmGame(false)}/>}
      {confirmFielding && <ConfirmModal message="Delete this fielding entry?" onConfirm={()=>deleteFielding(confirmFielding)} onCancel={()=>setConfirmFielding(null)}/>}
      {warnModal && (warnModal.onConfirm
        ? <WarnModal message={warnModal.message} confirmLabel="Discard"
            onConfirm={() => { const cb = warnModal.onConfirm; setWarnModal(null); cb(); }}
            onCancel={() => setWarnModal(null)} confirmColor="#c53030"/>
        : <WarnModal message={warnModal.message} confirmLabel="OK"
            onConfirm={() => setWarnModal(null)} onCancel={null} confirmColor="#1e3a5f"/>
      )}

      <div style={S.pageHeader} className="page-header-row">
        <button onClick={() => setPage(prevPage)} style={S.backBtn}><i className="fa-solid fa-arrow-left" style={{fontSize:11}}></i>{prevPage === 'gamelog' ? 'Log' : prevPage === 'stats' ? 'Stats' : 'Games'}</button>
        <div style={{display:'flex', gap:8}}>
          {!editingGame && <button onClick={()=>setEditingGame(true)} style={S.btnSmall}>Edit Game</button>}
          {!editingGame && abs.length>0 && <button onClick={()=>generateGamePDF(game,abs,profile)} style={S.btnSmall}><i className="fa-solid fa-arrow-down" style={{marginRight:8, fontSize:11}}></i>PDF</button>}
          <button onClick={()=>setConfirmGame(true)} style={S.btnDanger}>Delete Game</button>
        </div>
      </div>

      {/* Edit game form */}
      {editingGame && gameForm && (
        <div style={S.card}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
            <div style={S.cardTitle}>Edit Game Info</div>
            <div style={{display:'flex', gap:8}}>
              <button onClick={()=>{setEditingGame(false); setGameFormError(null); window.__dirtyForm = false;}} style={S.btnSmall}>Cancel</button>
              <button onClick={saveGame} disabled={savingGame} style={S.btnPrimary}>{savingGame?'Saving...':'Save Changes'}</button>
            </div>
          </div>
          {gameFormError && <div style={{color:'var(--danger)', fontSize:13, marginBottom:12, padding:'8px 12px', background:'rgba(192,57,43,0.08)', borderRadius:8}}>{gameFormError}</div>}
          <div style={S.formGrid2} className="form-grid-2">
            <div style={S.formGroup}>
              <label style={S.label}>Date *</label>
              <input type="date" style={S.input} value={gameForm.date||''} onChange={e=>updGame('date',e.target.value)}/>
              {gameForm.date && <span style={S.hintGreen}>{getDayOfWeek(gameForm.date)}</span>}
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Time</label>
              <input type="time" style={S.input} value={gameForm.time||''} onChange={e=>updGame('time',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Day / Night</label>
              <select style={S.select} value={gameForm.dayNight||''} onChange={e=>updGame('dayNight',e.target.value)}>
                <option value="">Select</option><option value="Day">Day</option><option value="Night">Night</option>
              </select>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Home / Away</label>
              <select style={S.select} value={gameForm.homeAway||''} onChange={e=>updGame('homeAway',e.target.value)}>
                <option value="">Select</option><option value="Home">Home</option><option value="Away">Away</option>
              </select>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Opponent</label>
              <input style={S.input} value={gameForm.opponent||''} onChange={e=>updGame('opponent',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Park / Location</label>
              <div style={{position:'relative'}}>
                <input style={S.input} value={gameForm.park||''}
                  onChange={e => { updGame('park', e.target.value); setShowEditParkDropdown(true); }}
                  onFocus={() => setShowEditParkDropdown(true)}
                  onBlur={() => setTimeout(() => setShowEditParkDropdown(false), 150)}
                  placeholder="e.g. Christie Pits Diamond 1"/>
                {showEditParkDropdown && parks.filter(p => p.name.toLowerCase().includes((gameForm.park||'').toLowerCase())).length > 0 && (
                  <div style={{position:'absolute', top:'100%', left:0, right:0, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:8, zIndex:100, maxHeight:180, overflowY:'auto', boxShadow:'0 4px 12px rgba(0,0,0,0.1)'}}>
                    {parks.filter(p => p.name.toLowerCase().includes((gameForm.park||'').toLowerCase())).map(p => (
                      <div key={p.id} onMouseDown={() => { updGame('park', p.name); setShowEditParkDropdown(false); }}
                        style={{padding:'10px 14px', cursor:'pointer', borderBottom:'1px solid var(--border)', fontSize:14, color:'var(--text)'}}>
                        {p.name}{p.fieldType ? <span style={{fontSize:11, color:'var(--muted)', marginLeft:8}}>{p.fieldType}</span> : ''}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>My Score</label>
              <input type="number" min="0" style={S.input} value={gameForm.myScore||''} onChange={e=>updGame('myScore',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Opponent Score</label>
              <input type="number" min="0" style={S.input} value={gameForm.oppScore||''} onChange={e=>updGame('oppScore',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Result</label>
              <select style={S.select} value={gameForm.result||''} onChange={e=>updGame('result',e.target.value)}>
                <option value="">— Auto from scores —</option>
                <option value="W">Win</option>
                <option value="L">Loss</option>
                <option value="T">Tie</option>
              </select>
              <span style={S.hint}>Leave blank to auto-calculate from scores.</span>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Season Name</label>
              <input style={S.input} value={gameForm.season||''} onChange={e=>updGame('season',e.target.value)}/>
            </div>
            <div style={{...S.formGroup, gridColumn:'1/-1'}}>
              <label style={S.label}>Team Name</label>
              <input style={S.input} value={gameForm.teamName||''} onChange={e=>updGame('teamName',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>League</label>
              <input style={S.input} value={gameForm.league||''} onChange={e=>updGame('league',e.target.value)}/>
            </div>
            <div style={S.formGroup}>
              <label style={S.label}>Tier / Division</label>
              <input style={S.input} value={gameForm.tier||''} onChange={e=>updGame('tier',e.target.value)}/>
