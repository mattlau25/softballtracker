                {[['career','Career'],['season','Season']].map(([v,l],i)=>(
                  <button key={v} onClick={()=>setSprayScope(v)} style={{...S.toggleBtn, ...(i>0?S.toggleBtnDivider:{}), ...(sprayScope===v?S.toggleBtnActive:{})}}>{l}</button>
                ))}
              </div>
              {sprayScope==='season'&&(
                <select style={{...S.select,width:'auto',padding:'4px 32px 4px 8px',fontSize:12}} value={effectiveSeason} onChange={e=>setActiveSeason(e.target.value)}>
                  {seasons.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              )}
              <div style={S.toggleGroup}>
                {[['spray','Spray'],['heat','Heat'],['zones','Zones']].map(([v,l],i)=>(
                  <button key={v} onClick={()=>setSprayView(v)} style={{...S.toggleBtn, ...(i>0?S.toggleBtnDivider:{}), ...(sprayView===v?S.toggleBtnActive:{})}}>{l}</button>
                ))}
              </div>
              <div style={S.toggleGroup}>
                {[['all','All'],['hits','Hits Only']].map(([v,l],i)=>(
                  <button key={v} onClick={()=>setSprayFilter(v)} style={{...S.toggleBtn, ...(i>0?S.toggleBtnDivider:{}), ...(sprayFilter===v?S.toggleBtnActive:{})}}>{l}</button>
                ))}
              </div>
            </div>
          </div>
          {sprayFiltered.length===0?<p style={{...S.muted,textAlign:'center',padding:'20px 0'}}>No mapped balls for this selection.</p>:(
            <>
              <div style={{display:'flex',justifyContent:'center',background:'var(--spray-bg)',borderRadius:10,padding:12}}>
                <SprayChart interactive={false} hits={sprayFiltered} size={360} showHeatmap={sprayView==='heat'} showZones={sprayView==='zones'}/>
              </div>
              <p style={{...S.hint,marginTop:8,textAlign:'center'}}>
                {sprayFiltered.length} mapped {sprayFiltered.length===1?'ball':'balls'} · {sprayScope==='season'?effectiveSeason:'Career'}
                {' · '}<span style={{color:'var(--success)'}}>●</span> Hit
                {sprayFilter==='all'&&<> · <span style={{color:'var(--danger)'}}>●</span> Out · <span style={{color:'#2e6db4'}}>●</span> Other</>}
              </p>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ─── GAME LOG PAGE ─────────────────────────────────────────────────────────────
function GameLogPage({ uid, setPage, setGameId }) {
  const { games, allABs, profile, loading } = useAllData(uid);
  const inclFoulK = profile.includeKFoulInK || false;
  const [mode, setMode] = useState('log');
  const [filters, setFilters] = useState(emptyFilters());
  const [showFilters, setShowFilters] = useState(false);
  const [sortKey, setSortKey] = useState('date');
  const [sortDir, setSortDir] = useState('desc');
  const [filtersA, setFiltersA] = useState(emptyFilters());
  const [filtersB, setFiltersB] = useState(emptyFilters());
  const [showFA, setShowFA] = useState(true);
  const [showFB, setShowFB] = useState(true);
  const [sprayFA, setSprayFA] = useState('all');
  const [sprayFB, setSprayFB] = useState('all');
  const [sprayVA, setSprayVA] = useState('spray'); // spray|heat|zones
  const [sprayVB, setSprayVB] = useState('spray');
  const [filtersLoaded, setFiltersLoaded] = useState(false);

  // Load saved filters on mount
  useEffect(() => {
    loadSavedFilters(uid).then(saved => {
      if (saved.gamelog)    setFilters(f => ({...f,...saved.gamelog}));
      if (saved.compareA)   setFiltersA(f => ({...f,...saved.compareA}));
      if (saved.compareB)   setFiltersB(f => ({...f,...saved.compareB}));
      if (saved.gamelogSort) { setSortKey(saved.gamelogSort.key||'date'); setSortDir(saved.gamelogSort.dir||'desc'); }
      setFiltersLoaded(true);
    });
  }, [uid]);

  // Persist filters whenever they change (after initial load)
  useEffect(() => { if (filtersLoaded) saveFilters(uid, 'gamelog', filters); }, [filters, filtersLoaded]);
  useEffect(() => { if (filtersLoaded) saveFilters(uid, 'compareA', filtersA); }, [filtersA, filtersLoaded]);
  useEffect(() => { if (filtersLoaded) saveFilters(uid, 'compareB', filtersB); }, [filtersB, filtersLoaded]);
  useEffect(() => { if (filtersLoaded) saveFilters(uid, 'gamelogSort', {key:sortKey, dir:sortDir}); }, [sortKey, sortDir, filtersLoaded]);

  const runDiff = g => { const ms=parseInt(g.myScore),os=parseInt(g.oppScore); return(isNaN(ms)||isNaN(os))?-999:ms-os; };
  const getStatForGame = (g,key) => {
    const s=calcGameStats(allABs[g.id]||[],inclFoulK);
    return ({ab:s.ab,h:s.h,r:s.r,rbi:s.rbi,bb:s.bb,k:s.kTotal,avg:s.ab>0?s.h/s.ab:-1,hr:s.hr})[key]??0;
  };

  const filtered = applyFilters(games, filters);
  const sorted = [...filtered].sort((a,b)=>{
    let av,bv;
    if(sortKey==='date'){
      // Primary: date, secondary: time (so same-day games appear in game-time order)
      const dateCmp = a.date<b.date?(sortDir==='asc'?-1:1):a.date>b.date?(sortDir==='asc'?1:-1):0;
      if(dateCmp!==0) return dateCmp;
      const at=a.time||'', bt=b.time||'';
      return at<bt?(sortDir==='asc'?-1:1):at>bt?(sortDir==='asc'?1:-1):0;
    }
    else if(sortKey==='rd'){av=runDiff(a);bv=runDiff(b);}
    else{av=getStatForGame(a,sortKey);bv=getStatForGame(b,sortKey);}
    return av<bv?(sortDir==='asc'?-1:1):av>bv?(sortDir==='asc'?1:-1):0;
  });
  const toggleSort = key => { if(sortKey===key)setSortDir(d=>d==='asc'?'desc':'asc'); else{setSortKey(key);setSortDir('desc');} };
  const SortIcon = ({k}) => sortKey!==k?<i className="fa-solid fa-sort" style={{color:'#cbd5e0',marginLeft:4,fontSize:11}}></i>:<i className={`fa-solid ${sortDir==='asc'?'fa-sort-up':'fa-sort-down'}`} style={{color:'#1e3a5f',marginLeft:4,fontSize:11}}></i>;

  const summaryStats = aggregateGames(filtered,allABs,inclFoulK);
  const filteredABs = filtered.flatMap(g=>allABs[g.id]||[]);
  const totalPA=filteredABs.length, hitCnt=filteredABs.filter(ab=>COUNTS_AS_HIT.has(ab.outcome)).length;
  const kCnt=filteredABs.filter(ab=>ab.outcome==='Strikeout'||(ab.outcome==='Foul Out'&&ab.subOutcome==='strikeout'&&inclFoulK)).length;
  const otherCnt=totalPA-hitCnt-kCnt;
  const hitPct=totalPA>0?Math.round(hitCnt/totalPA*100):0, kPct=totalPA>0?Math.round(kCnt/totalPA*100):0, otherPct=totalPA>0?Math.round(otherCnt/totalPA*100):0;

  const setA=applyFilters(games,filtersA), setB=applyFilters(games,filtersB);
  const statsA=aggregateGames(setA,allABs,inclFoulK), statsB=aggregateGames(setB,allABs,inclFoulK);
  const sprayABsA=setA.flatMap(g=>(allABs[g.id]||[]).filter(ab=>ab.spray));
  const sprayABsB=setB.flatMap(g=>(allABs[g.id]||[]).filter(ab=>ab.spray));
  const sprayA=sprayFA==='hits'?sprayABsA.filter(ab=>COUNTS_AS_HIT.has(ab.outcome)):sprayABsA;
  const sprayB=sprayFB==='hits'?sprayABsB.filter(ab=>COUNTS_AS_HIT.has(ab.outcome)):sprayABsB;

  const go = id => { setPage('game-detail', id); };
  const thS={padding:'9px 10px',textAlign:'center',fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',cursor:'pointer',whiteSpace:'nowrap',userSelect:'none'};
  const tdS={padding:'10px 10px',textAlign:'center',fontSize:13,color:'#4a5568',borderBottom:'1px solid #f0f2f5'};

  const compareStats=[
    {label:'Games',key:'g'},{label:'AVG',key:'avg',rate:true},{label:'OBP',key:'obp',rate:true},
    {label:'SLG',key:'slg',rate:true},{label:'OPS',key:'ops',rate:true},
    {label:'PA',key:'pa'},{label:'AB',key:'ab'},{label:'H',key:'h'},{label:'2B',key:'doubles'},
    {label:'3B',key:'triples'},{label:'HR',key:'hr'},{label:'R',key:'r'},{label:'RBI',key:'rbi'},
    {label:'BB',key:'bb'},{label:'K',key:'k'},{label:'W',key:'w'},{label:'L',key:'l'},
    {label:'Win%',key:'winPct',rate:true},{label:'FLD%',key:'fldPct',rate:true},
  ];
  const better=(key,a,b)=>{
    const hi=['avg','obp','slg','ops','h','doubles','triples','hr','r','rbi','bb','w','winPct','fldPct','pa','ab','g'];
    const lo=['k','l','err'];
    const av=parseFloat(String(a[key]).replace(/^\./,'0.'))||a[key]||0;
    const bv=parseFloat(String(b[key]).replace(/^\./,'0.'))||b[key]||0;
    if(hi.includes(key)) return av>bv?'A':av<bv?'B':null;
    if(lo.includes(key)) return av<bv?'A':av>bv?'B':null;
    return null;
  };

  if(loading) return <div className="page-content"><div style={S.pageHeader} className="page-header-row"><h2 style={S.pageTitle}>Log</h2></div><p style={S.muted}>Loading...</p></div>;

  return (
    <div className="page-content">
      <div style={S.pageHeader} className="page-header-row">
        <h2 style={S.pageTitle}>Log</h2>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <div style={S.toggleGroup}>
            <button onClick={()=>setMode('log')}
              style={{...S.toggleBtn, ...(mode==='log'?S.toggleBtnActive:{}), display:'inline-flex', alignItems:'center', gap:8}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              Log
            </button>
            <button onClick={()=>setMode('compare')}
              style={{...S.toggleBtn, ...S.toggleBtnDivider, ...(mode==='compare'?S.toggleBtnActive:{}), display:'inline-flex', alignItems:'center', gap:8}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/></svg>
              Compare
            </button>
          </div>
          {mode==='log' && (
            <button onClick={()=>setShowFilters(v=>!v)} style={{...S.btnSecondary,display:'inline-flex',alignItems:'center',gap:8}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="6" x2="21" y2="6"/><circle cx="16" cy="6" r="2"/><line x1="4" y1="12" x2="21" y2="12"/><circle cx="10" cy="12" r="2"/><line x1="4" y1="18" x2="21" y2="18"/><circle cx="18" cy="18" r="2"/></svg>
              Filters {countFilters(filters)>0&&<span style={{background:'#1e3a5f',color:'#fff',borderRadius:10,padding:'1px 7px',fontSize:11}}>{countFilters(filters)}</span>}
            </button>
          )}
        </div>
      </div>

      {mode==='log' && (<>
        <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',marginBottom:12}}>
          <span style={S.muted}>{filtered.length} game{filtered.length!==1?'s':''} filtered</span>
        </div>
        {showFilters&&<div style={S.card}><div style={S.cardTitle}>Filters</div><FilterPanel filters={filters} setFilters={setFilters} games={games} onClear={()=>setFilters(emptyFilters())}/></div>}
        {filtered.length>0&&(
          <div style={S.card}>
            <div style={S.cardTitle}>Stats — {filtered.length} Game{filtered.length!==1?'s':''}</div>
            <div style={{overflowX:'auto'}}>
              <table style={{borderCollapse:'collapse',fontSize:13,width:'100%'}}>
                <thead><tr style={{background:'#f7fafc'}}>
                  {['G','PA','AB','H','2B','3B','HR','R','RBI','BB','K','AVG','OBP','SLG','OPS','W','L','T','FLD%'].map(h=>(
                    <th key={h} style={{...thS,cursor:'default'}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody><tr>
                  {[summaryStats.g,summaryStats.pa,summaryStats.ab,summaryStats.h,summaryStats.doubles,summaryStats.triples,summaryStats.hr,summaryStats.r,summaryStats.rbi,summaryStats.bb,summaryStats.k].map((v,i)=><td key={i} style={tdS}>{v}</td>)}
                  {[summaryStats.avg,summaryStats.obp,summaryStats.slg,summaryStats.ops].map((v,i)=><td key={i} style={{...tdS,color:'#1e3a5f',fontWeight:600}}>{v}</td>)}
                  <td style={{...tdS,color:'#276749',fontWeight:600}}>{summaryStats.w}</td>
                  <td style={{...tdS,color:'#c53030',fontWeight:600}}>{summaryStats.l}</td>
                  <td style={{...tdS,color:'#b7791f',fontWeight:600}}>{summaryStats.tie}</td>
                  <td style={{...tdS,color:'#2b6cb0',fontWeight:600}}>{summaryStats.fldPct}</td>
                </tr></tbody>
              </table>
            </div>
            {totalPA>0&&(
              <div style={{marginTop:16,paddingTop:14,borderTop:'1px solid #edf2f7'}}>
                <div style={{...S.cardTitle,marginBottom:10}}>AB Breakdown</div>
                <div style={{display:'flex',height:28,borderRadius:6,overflow:'hidden',gap:2}}>
                  {hitPct>0&&<div style={{width:`${hitPct}%`,background:'#276749',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:11,fontWeight:700}}>{hitPct}%</div>}
                  {kPct>0&&<div style={{width:`${kPct}%`,background:'#c53030',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:11,fontWeight:700}}>{kPct}%</div>}
                  {otherPct>0&&<div style={{width:`${otherPct}%`,background:'#a0aec0',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:11,fontWeight:700}}>{otherPct}%</div>}
                </div>
                <div style={{display:'flex',gap:16,marginTop:8,fontSize:12}}>
                  <span><span style={{color:'#276749',fontWeight:700}}>■</span> Hits {hitPct}%</span>
                  <span><span style={{color:'#c53030',fontWeight:700}}>■</span> Ks {kPct}%</span>
                  <span><span style={{color:'var(--muted)',fontWeight:700}}>■</span> Other {otherPct}%</span>
                </div>
              </div>
            )}
          </div>
        )}
        {filtered.length===0?<div style={S.empty}><p>No games match the current filters.</p></div>:(
          <div style={S.card}>
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                <thead><tr style={{background:'#f7fafc',borderBottom:'2px solid #e2e8f0'}}>
                  <th onClick={()=>toggleSort('date')} style={{...thS,textAlign:'left',paddingLeft:14}}>Date <SortIcon k="date"/></th>
                  <th style={{...thS,textAlign:'left'}}>Opponent</th>
                  <th style={thS}>Result</th>
                  <th onClick={()=>toggleSort('rd')}  style={thS}>+/- <SortIcon k="rd"/></th>
                  <th onClick={()=>toggleSort('ab')}  style={thS}>AB <SortIcon k="ab"/></th>
                  <th onClick={()=>toggleSort('h')}   style={thS}>H <SortIcon k="h"/></th>
                  <th onClick={()=>toggleSort('avg')} style={thS}>AVG <SortIcon k="avg"/></th>
                  <th onClick={()=>toggleSort('r')}   style={thS}>R <SortIcon k="r"/></th>
                  <th onClick={()=>toggleSort('rbi')} style={thS}>RBI <SortIcon k="rbi"/></th>
                  <th onClick={()=>toggleSort('hr')}  style={thS}>HR <SortIcon k="hr"/></th>
                  <th onClick={()=>toggleSort('bb')}  style={thS}>BB <SortIcon k="bb"/></th>
                  <th onClick={()=>toggleSort('k')}   style={thS}>K <SortIcon k="k"/></th>
                </tr></thead>
                <tbody>
                  {sorted.map(game=>{
                    const s=calcGameStats(allABs[game.id]||[],inclFoulK), res=getResult(game), rd=runDiff(game);
                    return (
                      <tr key={game.id} onClick={()=>go(game.id)} style={{cursor:'pointer',borderBottom:'1px solid #f0f2f5'}}
                        onMouseEnter={e=>e.currentTarget.style.background='#f7fafc'}
                        onMouseLeave={e=>e.currentTarget.style.background=''}>
                        <td style={{...tdS,textAlign:'left',paddingLeft:14,whiteSpace:'nowrap'}}>
                          <a href={pageToPath('game-detail', game.id)} onClick={e=>{ if(e.button===0&&!e.metaKey&&!e.ctrlKey){e.preventDefault(); go(game.id);} }}
                            style={{fontWeight:600,color:'#1a202c',textDecoration:'none',display:'block'}}>
                            {fmtDate(game.date)}{game.time&&<span style={{fontWeight:400,color:'var(--muted)',fontSize:12,marginLeft:6}}>{fmtTime(game.time)}</span>}
                          </a>
                          <div style={{fontSize:11,color:'var(--muted)'}}>{[game.teamName,game.league,game.season,game.park].filter(Boolean).join(' · ')}</div>
                        </td>
                        <td style={{...tdS,textAlign:'left',fontWeight:500,color:'#1a202c'}}>
                          {game.opponent||'—'}
                        </td>
                        <td style={tdS}>{res?<span style={{background:res.color+'18',color:res.color,borderRadius:6,padding:'3px 8px',fontWeight:700,fontSize:12}}>{res.label} {game.myScore}–{game.oppScore}</span>:'—'}</td>
                        <td style={{...tdS,color:rd>0?'#276749':rd<0?'#c53030':'#a0aec0',fontWeight:600}}>{isNaN(rd)||rd===-999?'—':rd>0?`+${rd}`:rd}</td>
                        <td style={tdS}>{s.ab}</td>
                        <td style={tdS}>{s.h}</td>
                        <td style={{...tdS,color:'#1e3a5f',fontWeight:600}}>{calcAVG(s.h,s.ab)}</td>
                        <td style={tdS}>{s.r}</td><td style={tdS}>{s.rbi}</td><td style={tdS}>{s.hr}</td><td style={tdS}>{s.bb}</td><td style={tdS}>{s.kTotal}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </>)}

      {mode==='compare'&&(
        <div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            {[{label:'Set A',f:filtersA,sf:setFiltersA,show:showFA,setShow:setShowFA,set:setA,color:'#1e3a5f'},
              {label:'Set B',f:filtersB,sf:setFiltersB,show:showFB,setShow:setShowFB,set:setB,color:'#276749'}].map(({label,f,sf,show,setShow,set,color})=>(
              <div key={label} style={{...S.card,borderTop:`3px solid ${color}`}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                  <div style={{fontWeight:700,color,fontSize:15}}>{label} <span style={{fontWeight:400,color:'var(--muted)',fontSize:13}}>({set.length} game{set.length!==1?'s':''})</span></div>
                  <button onClick={()=>setShow(v=>!v)} style={{...S.btnSmall,fontSize:11}}>
                    {show?'Hide':'Show'} Filters {countFilters(f)>0&&<span style={{background:color,color:'#fff',borderRadius:10,padding:'1px 6px',fontSize:10,marginLeft:4}}>{countFilters(f)}</span>}
                  </button>
                </div>
                {show&&<FilterPanel filters={f} setFilters={sf} games={games} onClear={()=>sf(emptyFilters())} compact={true}/>}
              </div>
            ))}
          </div>
          <div style={S.card}>
            <div style={S.cardTitle}>Stats Comparison</div>
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                <thead><tr style={{background:'#f7fafc'}}>
                  <th style={{padding:'8px 12px',textAlign:'left',fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.06em'}}>Stat</th>
                  <th style={{padding:'8px 14px',textAlign:'center',fontSize:12,fontWeight:700,color:'#1e3a5f'}}>Set A</th>
                  <th style={{padding:'8px 14px',textAlign:'center',fontSize:12,fontWeight:700,color:'#276749'}}>Set B</th>
                </tr></thead>
                <tbody>
                  {compareStats.map(({label,key,rate})=>{
                    const b=better(key,statsA,statsB);
                    const aS={padding:'9px 14px',textAlign:'center',fontSize:13,fontWeight:b==='A'?700:400,color:b==='A'?'#1e3a5f':rate?'#a0aec0':'#4a5568',background:b==='A'?'rgba(30,58,95,0.05)':'',borderBottom:'1px solid #f0f2f5'};
                    const bS={padding:'9px 14px',textAlign:'center',fontSize:13,fontWeight:b==='B'?700:400,color:b==='B'?'#276749':rate?'#a0aec0':'#4a5568',background:b==='B'?'rgba(39,103,73,0.05)':'',borderBottom:'1px solid #f0f2f5'};
                    return(
                      <tr key={key}>
                        <td style={{padding:'9px 12px',fontSize:12,fontWeight:600,color:'#718096',borderBottom:'1px solid #f0f2f5'}}>{label}</td>
                        <td style={aS}>{statsA[key]??'—'}</td>
                        <td style={bS}>{statsB[key]??'—'}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            {[{label:'Set A',sp:sprayA,sab:sprayABsA,spf:sprayFA,sspf:setSprayFA,spv:sprayVA,sspv:setSprayVA,color:'#1e3a5f'},
              {label:'Set B',sp:sprayB,sab:sprayABsB,spf:sprayFB,sspf:setSprayFB,spv:sprayVB,sspv:setSprayVB,color:'#276749'}].map(({label,sp,spf,sspf,spv,sspv,color})=>(
              <div key={label} style={S.card}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12,flexWrap:'wrap',gap:6}}>
                  <div style={{...S.cardTitle,marginBottom:0}}>{label} — Spray Chart</div>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                    <div style={S.toggleGroup}>
                      {[['spray','Spray'],['heat','Heat'],['zones','Zones']].map(([v,l],i)=>(
                        <button key={v} onClick={()=>sspv(v)} style={{...S.toggleBtn, padding:'6px 12px', fontSize:12, minHeight:28, ...(i>0?S.toggleBtnDivider:{}), ...(spv===v?{background:color,color:'#fff',fontWeight:600}:{})}}>{l}</button>
                      ))}
                    </div>
                    <div style={S.toggleGroup}>
                      {[['all','All'],['hits','Hits']].map(([v,l],i)=>(
                        <button key={v} onClick={()=>sspf(v)} style={{...S.toggleBtn, padding:'6px 12px', fontSize:12, minHeight:28, ...(i>0?S.toggleBtnDivider:{}), ...(spf===v?{background:color,color:'#fff',fontWeight:600}:{})}}>{l}</button>
                      ))}
                    </div>
                    ))}
                  </div>
                </div>
                {sp.length===0?<p style={{...S.muted,textAlign:'center',padding:'20px 0'}}>No mapped balls.</p>:(
                  <>
                    <div style={{display:'flex',justifyContent:'center',background:'var(--spray-bg)',borderRadius:8,padding:8}}>
                      <SprayChart interactive={false} hits={sp} size={260} showHeatmap={spv==='heat'} showZones={spv==='zones'}/>
                    </div>
                    <p style={{...S.hint,marginTop:6,textAlign:'center'}}>{sp.length} ball{sp.length!==1?'s':''}</p>
                  </>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── TRENDS PAGE ───────────────────────────────────────────────────────────────
function TrendsPage({ uid }) {
  const { games, allABs, profile, loading } = useAllData(uid);
  const inclFoulK = profile.includeKFoulInK || false;
  const [filters, setFilters] = useState(emptyFilters());
  const [showFilters, setShowFilters] = useState(false);
  const [activeMetric, setActiveMetric] = useState('avg');
  const [filtersLoaded, setFiltersLoaded] = useState(false);

  useEffect(() => {
    loadSavedFilters(uid).then(saved => {
      if (saved.trends) setFilters(f => ({...f,...saved.trends}));
      if (saved.trendsMetric) setActiveMetric(saved.trendsMetric);
      setFiltersLoaded(true);
    });
  }, [uid]);
  useEffect(() => { if (filtersLoaded) saveFilters(uid, 'trends', filters); }, [filters, filtersLoaded]);
  useEffect(() => { if (filtersLoaded) saveFilters(uid, 'trendsMetric', activeMetric); }, [activeMetric, filtersLoaded]);

  const filtered = applyFilters(games, filters);
  const chronological = [...filtered].sort((a,b)=>{
    const dc=a.date.localeCompare(b.date);
    if(dc!==0) return dc;
    return (a.time||'').localeCompare(b.time||'');
  });

  const dataPoints = chronological.map(game => {
    const abs=allABs[game.id]||[], s=calcGameStats(abs,inclFoulK);
    const obpV=s.ab+s.bb+s.hbp+s.sf>0?(s.h+s.bb+s.hbp)/(s.ab+s.bb+s.hbp+s.sf):null;
    const slgV=s.ab>0?s.tb/s.ab:null;
    const rd=(()=>{const ms=parseInt(game.myScore),os=parseInt(game.oppScore);return(isNaN(ms)||isNaN(os))?null:ms-os;})();
    return {
      date:fmtDate(game.date), shortDate:(game.date||'').slice(5),
      avg:s.ab>0?s.h/s.ab:null, obp:obpV, slg:slgV,
      ops:(obpV!==null&&slgV!==null)?obpV+slgV:null,
      h:s.h, hr:s.hr, rbi:s.rbi, r:s.r, bb:s.bb, k:s.kTotal,
      kPct:s.pa>0?s.kTotal/s.pa:null, bbPct:s.pa>0?s.bb/s.pa:null,
      rd, opponent:game.opponent||'', ab:s.ab,
    };
  });

  const rollingAvg=(arr,key,win=5)=>arr.map((_,i)=>{
    const sl=arr.slice(Math.max(0,i-win+1),i+1).filter(p=>p[key]!==null);
    return sl.length?sl.reduce((s,p)=>s+p[key],0)/sl.length:null;
  });

  const metrics=[
    {key:'avg',  label:'AVG',     color:'#1e3a5f', fmt:v=>v===null?'—':'.'+Math.round(v*1000).toString().padStart(3,'0'), isRate:true},
    {key:'obp',  label:'OBP',     color:'#2b6cb0', fmt:v=>v===null?'—':'.'+Math.round(v*1000).toString().padStart(3,'0'), isRate:true},
    {key:'slg',  label:'SLG',     color:'#276749', fmt:v=>v===null?'—':'.'+Math.round(v*1000).toString().padStart(3,'0'), isRate:true},
    {key:'ops',  label:'OPS',     color:'#b7791f', fmt:v=>v===null?'—':v.toFixed(3), isRate:true},
    {key:'h',    label:'H/Game',  color:'#276749', fmt:v=>v===null?'—':v},
    {key:'hr',   label:'HR/Game', color:'#c53030', fmt:v=>v===null?'—':v},
    {key:'rbi',  label:'RBI/Game',color:'#2b6cb0', fmt:v=>v===null?'—':v},
    {key:'kPct', label:'K%',      color:'#c53030', fmt:v=>v===null?'—':Math.round(v*100)+'%', isRate:true},
    {key:'bbPct',label:'BB%',     color:'#276749', fmt:v=>v===null?'—':Math.round(v*100)+'%', isRate:true},
    {key:'rd',   label:'Run Diff',color:'#718096', fmt:v=>v===null?'—':v>0?`+${v}`:v},
  ];
  const metric=metrics.find(m=>m.key===activeMetric);
  const rolling=rollingAvg(dataPoints,activeMetric);

  function LineChart({points,rolling,metric,height=200}) {
    const [hovered,setHovered]=useState(null);
    if(points.length<2) return <p style={{...S.muted,textAlign:'center',padding:'20px 0'}}>Need at least 2 games to show a trend.</p>;

// ─── SEASON MIGRATION ──────────────────────────────────────────────────────────
// One-time fix: games stored season as "SeasonName - League" concatenation.
// This matches them to the correct season doc and normalises the stored value.
async function migrateSeasonNames(uid) {
  try {
    const [seasSnap, gamesSnap] = await Promise.all([
      seasonsCol(uid).get(),
      gamesCol(uid).get()
    ]);
    const seasons = seasSnap.docs.map(d => ({id:d.id,...d.data()}));
    const updates = [];
    gamesSnap.docs.forEach(d => {
      const g = d.data();
      if (g.seasonId) return; // already migrated
      if (!g.season) return;
      // Find matching season: exact match or starts-with
      const match = seasons.find(s =>
        g.season === s.name ||
        g.season.startsWith(s.name + ' -') ||
        g.season.startsWith(s.name + '-')
      );
      if (match) {
        updates.push(d.ref.update({
          seasonId: match.id,
          season: match.name,
          teamName: g.teamName || match.teamName || '',
          league: g.league || match.league || '',
          tier: g.tier || match.tier || '',
        }));
      }
    });
    if (updates.length > 0) await Promise.all(updates);
  } catch(e) { /* silent — migration is best-effort */ }
}

// ─── ROOT APP ──────────────────────────────────────────────────────────────────
// ─── URL ROUTING HELPERS ───────────────────────────────────────────────────────
// Hash-based routing: #games, #gamelog, #game/abc123
// Hash URLs are never sent to the server, so they work perfectly on GitHub Pages.

function pageToPath(page, gameId = null) {
  if (page === 'game-detail' && gameId) return `#game/${gameId}`;
  if (page === 'games' || !page) return '#games';
  return `#${page}`;
}

function getPageFromHash() {
  const hash = window.location.hash.slice(1); // remove #
  if (!hash) return { page: 'games', gameId: null };
  if (hash.startsWith('game/')) return { page: 'game-detail', gameId: hash.slice(5) };
  const validPages = ['games','practices','stats','gamelog','trends','seasons','parks','bats','profile','new-game','practice-detail'];
  if (validPages.includes(hash)) return { page: hash, gameId: null };
  return { page: 'games', gameId: null };
}

function App() {
  const [user, setUser] = useState(undefined);
  const [darkMode, setDarkMode] = useState(false);

  // Derive page and gameId from URL hash
  const [routeState, setRouteState] = useState(() => getPageFromHash());
  const page = routeState.page;
  const gameId = routeState.gameId;
  const [prevPage, setPrevPage] = useState('games');
  const [pendingNav, setPendingNav] = useState(null); // {newPage, gId} — blocked nav awaiting confirm
  const suppressHashChange = React.useRef(false); // true while we're restoring the URL ourselves

  // doNavigate: actually performs the navigation without any dirty check
  const doNavigate = (newPage, gId) => {
    if (newPage === 'game-detail') {
      setPrevPage(page === 'new-game' ? 'games' : page);
    }
    const resolvedGameId = gId !== null ? gId : gameId;
    const newHash = pageToPath(newPage, resolvedGameId);
    window.location.hash = newHash.slice(1);
    setRouteState({ page: newPage, gameId: resolvedGameId });
  };

  // navigate: called by sidebar links and in-app buttons
  const navigate = (newPage, gId = null) => {
    if (window.__dirtyForm) { setPendingNav({ newPage, gId: gId ?? null }); return; }
    doNavigate(newPage, gId ?? null);
  };

  // hashchange fires on browser back/forward — intercept if form is dirty
  useEffect(() => {
    const onHash = (e) => {
      // Ignore hashchange events we triggered ourselves (URL restoration)
      if (suppressHashChange.current) { suppressHashChange.current = false; return; }
      if (window.__dirtyForm) {
        // Snap the URL back — flag first so our own replace doesn't re-trigger this handler
        suppressHashChange.current = true;
        const oldHash = e.oldURL ? new URL(e.oldURL).hash : '#games';
        window.location.replace(window.location.pathname + window.location.search + (oldHash || '#games'));
        // Show the modal pointing at where the user wanted to go
        const targetRaw = e.newURL ? new URL(e.newURL).hash.slice(1) : 'games';
        const target = targetRaw.startsWith('game/')
          ? { page: 'game-detail', gId: targetRaw.slice(5) }
          : { page: targetRaw || 'games', gId: null };
        setPendingNav(target);
        return;
      }
      setRouteState(getPageFromHash());
    };
    window.addEventListener('hashchange', onHash);
    if (!window.location.hash) window.location.hash = 'games';
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const setGameId = (id) => {
    setRouteState(r => ({ ...r, gameId: id }));
  };
  const [practiceId, setPracticeId] = useState(null);

  useEffect(() => { return auth.onAuthStateChanged(u => {
    setUser(u ?? null);
    if (u) migrateSeasonNames(u.uid); // one-time migration
  }); }, []);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
    document.body.style.background = darkMode ? '#0d1117' : '#f0f2f5';
    document.body.style.color = darkMode ? '#e2e8f0' : '#1a202c';
    // Drive the iOS Safari status-bar tint from the SITE theme, not the OS preference
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', darkMode ? '#0d1117' : '#f0f2f5');
  }, [darkMode]);

  useEffect(() => {
    if (!user) return;
    userDoc(user.uid).collection('settings').doc('prefs').get().then(d => {
      if (d.exists && d.data().darkMode !== undefined) setDarkMode(d.data().darkMode);
    });
  }, [user]);

  const toggleDark = async (val) => {
    setDarkMode(val);
    if (user) await userDoc(user.uid).collection('settings').doc('prefs').set({ darkMode: val }, { merge: true });
  };

  if (user === undefined) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--bg)',color:'var(--muted)',fontSize:14}}>Loading...</div>
  );
  if (!user) return <LoginScreen/>;

  const uid = user.uid;
  const navPage = page === 'game-detail' || page === 'new-game' ? 'games' : page;

  return (
    <div style={{display:'flex', minHeight:'100vh', background:'var(--bg)'}}>
      {pendingNav && (
        <WarnModal
          message="You have unsaved changes. Discard and leave this page?"
          confirmLabel="Discard"
          onConfirm={() => { window.__dirtyForm = false; const {newPage, gId} = pendingNav; setPendingNav(null); doNavigate(newPage, gId); }}
          onCancel={() => setPendingNav(null)}
          confirmColor="#c53030"
        />
      )}
      <Sidebar page={navPage} setPage={navigate} user={user} pageToPath={pageToPath}/>
      <div className="main-wrap">
        {page === 'games'       && <GamesPage uid={uid} setPage={navigate} setGameId={setGameId} active={page}/>}
        {page === 'new-game'    && <NewGamePage uid={uid} setPage={navigate} setGameId={setGameId}/>}
        {page === 'game-detail' && <GameDetailPage key={gameId} uid={uid} gameId={gameId} setPage={navigate} prevPage={prevPage}/>}
        {page === 'bats'        && <BatsPage uid={uid}/>}
        {page === 'profile'     && <ProfilePage uid={uid} darkMode={darkMode} toggleDark={toggleDark}/>}
        {page === 'stats'       && <StatsPage uid={uid}/>}
        {page === 'gamelog'     && <GameLogPage uid={uid} setPage={navigate} setGameId={setGameId}/>}
        {page === 'trends'      && <TrendsPage uid={uid}/>}
        {page === 'seasons'     && <SeasonsPage uid={uid}/>}
        {page === 'practices'   && <PracticesPage uid={uid} setPage={navigate} setPracticeId={setPracticeId}/>}
        {page === 'practice-detail' && <PracticeDetailPage key={practiceId} uid={uid} practiceId={practiceId} setPage={navigate}/>}
        {page === 'parks'       && <ParksPage uid={uid}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<!-- Status bar fix + live height adjuster. The grey bar is a single sticky element (first
     child of <body>) that reserves the status-bar height AND paints the strip. Because the
     exact status-bar height on this device is uncertain, a small −/+ control lets the user
     dial it in (1px steps), saved to localStorage so it persists. iOS only. -->
<script>
(function(){
  var KEY = 'sbHeightPx';
  function isIOS(){
    var standalone = (navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    var ios = /iP(hone|od|ad)/.test(navigator.userAgent || '') ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return standalone || ios;
  }
  function getH(){
    var v = parseInt(localStorage.getItem(KEY), 10);
    return isNaN(v) ? 47 : Math.max(0, Math.min(120, v));
  }
  function bar(){
    var el = document.getElementById('ios-status-cover');
    if (!el){
      el = document.createElement('div');
      el.id = 'ios-status-cover';
      el.style.cssText = 'position:sticky;top:0;left:0;right:0;z-index:99999;pointer-events:none;background:var(--bg);';
      document.body.insertBefore(el, document.body.firstChild);
    } else if (el !== document.body.firstElementChild){
      document.body.insertBefore(el, document.body.firstChild);
    }
    return el;
  }
  function setH(h){
    h = Math.max(0, Math.min(120, h));
    localStorage.setItem(KEY, h);
    bar().style.height = h + 'px';
    var lbl = document.getElementById('sb-adj-val');
    if (lbl) lbl.textContent = h + 'px';
  }
  function ensureAdj(){
    if (document.getElementById('sb-adj')) return;
    var wrap = document.createElement('div');
    wrap.id = 'sb-adj';
    wrap.style.cssText = 'position:fixed;right:8px;bottom:96px;z-index:100000;display:flex;align-items:center;gap:8px;'
      + 'background:#111;color:#fff;border-radius:24px;padding:6px 10px;font:13px/1 -apple-system,sans-serif;'
      + 'box-shadow:0 4px 16px rgba(0,0,0,.4);';
    var minus = document.createElement('button');
    minus.textContent = '−';
    var plus = document.createElement('button');
    plus.textContent = '+';
    var bstyle = 'width:36px;height:36px;border-radius:18px;border:none;background:#333;color:#fff;font-size:20px;line-height:1;cursor:pointer;';
    minus.style.cssText = bstyle; plus.style.cssText = bstyle;
    var lbl = document.createElement('span');
    lbl.id = 'sb-adj-val';
    lbl.textContent = getH() + 'px';
    lbl.style.cssText = 'min-width:44px;text-align:center;font-variant-numeric:tabular-nums;';
    var tag = document.createElement('span');
    tag.textContent = 'bar';
    tag.style.cssText = 'opacity:.6;font-size:11px;';
    minus.addEventListener('click', function(){ setH(getH() - 1); });
    plus.addEventListener('click', function(){ setH(getH() + 1); });
    wrap.appendChild(tag); wrap.appendChild(minus); wrap.appendChild(lbl); wrap.appendChild(plus);
    document.body.appendChild(wrap);
  }
  function apply(){
    if (!isIOS()){ bar().style.height = '0px'; return; }
    bar().style.height = getH() + 'px';
    ensureAdj();
  }
  if (document.body) apply();
  else document.addEventListener('DOMContentLoaded', apply);
  ['orientationchange','resize','pageshow','load'].forEach(function(ev){
    window.addEventListener(ev, function(){ setTimeout(apply, 200); });
  });
})();
</script>
